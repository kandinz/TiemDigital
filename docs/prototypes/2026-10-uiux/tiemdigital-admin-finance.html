<style>
#td-finance{font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#142033}#td-finance *{box-sizing:border-box}#td-finance .fi-app{--bg:#f6f8fc;--paper:#fff;--ink:#142033;--muted:#5c697c;--line:#dfe5ef;--soft:#eaf0ff;--link:#3358cf;--brand:#3358cf;--good:#236448;--warn:#925000;--warm:#fff3de;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;container:finance / inline-size;min-width:0;color-scheme:light}#td-finance .fi-app[data-theme=dark]{--bg:#131923;--paper:#1b2432;--ink:#ecf0f8;--muted:#b1bfd1;--line:#344257;--soft:#283a5d;--link:#a6bcff;--good:#9bd6b4;--warn:#ffd599;--warm:#3c3022;color-scheme:dark}#td-finance .fi-phone{max-width:390px;margin:auto}#td-finance h1,#td-finance h2,#td-finance h3,#td-finance p{margin:0}#td-finance h1{font-size:26px}#td-finance h2{font-size:19px}#td-finance h3{font-size:14px}#td-finance button,#td-finance input,#td-finance select,#td-finance textarea{font:inherit}#td-finance button{cursor:inherit}#td-finance :focus-visible{outline:2px solid var(--link);outline-offset:3px}
#td-finance .fi-button{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:40px;padding:8px 11px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600}#td-finance .fi-primary{background:var(--brand);border-color:var(--brand);color:#fff}#td-finance .fi-link{border:0;background:none;color:var(--link);min-height:32px;font-size:12px}#td-finance .fi-icon{width:16px;height:16px;flex-shrink:0}#td-finance .fi-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-finance .fi-between{justify-content:space-between}#td-finance .fi-small{font-size:12px;color:var(--muted)}
#td-finance .fi-demo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;color:var(--muted);font-size:12px}#td-finance .fi-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:650px}#td-finance .fi-side{padding:20px 12px;background:var(--paper);border-right:1px solid var(--line)}#td-finance .fi-logo{padding:0 9px 20px;font-size:19px;font-weight:700}#td-finance .fi-logo em{font-style:normal;color:var(--link)}#td-finance .fi-side .fi-button{display:flex;justify-content:flex-start;width:100%;border:0;background:transparent;color:var(--muted);margin:4px 0}#td-finance .fi-side .fi-current{background:var(--soft);color:var(--link)}#td-finance .fi-main{min-width:0}#td-finance .fi-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#td-finance .fi-content{padding:22px;min-width:0}#td-finance .fi-title{margin-bottom:19px}#td-finance .fi-title p{margin-top:5px}#td-finance .fi-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}#td-finance .fi-tabs [aria-current=page]{background:var(--soft);border-color:var(--link);color:var(--link)}#td-finance .fi-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:14px;min-width:0}#td-finance input:not([type=checkbox]),#td-finance select,#td-finance textarea{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px}#td-finance .fi-item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}#td-finance .fi-item p{margin-top:4px}#td-finance .fi-notice{padding:12px 13px;background:var(--soft);border-radius:8px;font-size:12px;margin:15px 0}#td-finance .fi-warning{background:var(--warm);color:var(--warn)}#td-finance .fi-field{display:block;font-size:13px;margin:14px 0}#td-finance .fi-field input,#td-finance .fi-field textarea,#td-finance .fi-field select{margin-top:7px}#td-finance .fi-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}#td-finance .fi-line span{color:var(--muted)}#td-finance .fi-line strong{text-align:right;overflow-wrap:anywhere}#td-finance .fi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}#td-finance .fi-kpi{font-size:18px;font-weight:700;color:var(--muted);margin-top:8px}#td-finance .fi-amount{font-variant-numeric:tabular-nums;font-weight:650}#td-finance .fi-good{color:var(--good)}
#td-finance .fi-wrap{position:relative}#td-finance .fi-wrap:has(.fi-drawer){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px)}#td-finance .fi-wrap:has(.fi-drawer) .fi-layout{grid-template-columns:1fr}#td-finance .fi-wrap:has(.fi-drawer) .fi-side{display:none}#td-finance .fi-drawer{background:var(--paper);border-left:1px solid var(--line);border-radius:0 12px 12px 0;padding:22px;min-width:0}#td-finance .fi-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}#td-finance .fi-footer{padding:0 22px 20px;font-size:12px;color:var(--muted)}#td-finance .fi-bottom{display:none}
@container finance (max-width:720px){#td-finance .fi-layout{display:block;min-height:0}#td-finance .fi-side{display:none}#td-finance .fi-content{padding:19px 15px}#td-finance .fi-top{padding:16px}#td-finance .fi-grid{grid-template-columns:1fr}#td-finance .fi-wrap:has(.fi-drawer){display:block}#td-finance .fi-wrap:has(.fi-drawer) .fi-layout{display:none}#td-finance .fi-drawer{border:0;border-radius:12px;padding:18px}#td-finance input:not([type=checkbox]),#td-finance select,#td-finance textarea{font-size:16px}#td-finance .fi-bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:5px 4px;border-radius:0 0 12px 12px}#td-finance .fi-bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:3px 0;border:0;background:none;color:var(--muted);font-size:10px}#td-finance .fi-bottom .fi-current{color:var(--link)}#td-finance .fi-footer{padding:0 15px 16px}}
@media(pointer:coarse){#td-finance button{min-height:44px}}
</style>
<div id="td-finance"><div id="td-fi-app" class="fi-app" data-theme="light" aria-label="Tài chính và đối soát TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById('td-fi-app'),prior=window.openai?.widgetState?.privateContent||{};
const s={theme:prior.theme==='dark'?'dark':'light',phone:prior.phone===true,tab:'Báo cáo',period:'Hôm nay',query:'',panel:'',id:null,message:''};
const txs=[{id:'T-01',name:'Chi mua NCC · Trợ lý AI Pro',kind:'Chi',amount:'99.000 ₫',status:'Cần đối soát',date:'01/11/2026'},{id:'T-02',name:'Đơn bán TD-1042',kind:'Thu',amount:'258.000 ₫',status:'Đã xác nhận',date:'01/11/2026'}],journals=[{id:'J-01',name:'Nạp ví · Minh Anh',amount:'+200.000 ₫',date:'01/11/2026',kind:'Nạp ví'},{id:'J-02',name:'Thanh toán đơn TD-1042',amount:'−129.000 ₫',date:'01/11/2026',kind:'Thanh toán'}],bank=[{id:'BK-01',name:'Chuyển khoản NAP1041',amount:'+200.000 ₫',status:'Đã đối soát'},{id:'BK-02',name:'Giao dịch cần kiểm tra',amount:'+79.000 ₫',status:'Cần xử lý'}];
const icon=n=>'<i class="fi-icon" data-lucide="'+n+'" aria-hidden="true"></i>',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,attrs='',primary=false)=>'<button type="button" class="fi-button cursor-interaction '+(primary?'fi-primary':'')+'" data-action="'+action+'" '+attrs+'>'+label+'</button>',line=(label,value)=>'<div class="fi-line"><span>'+label+'</span><strong>'+value+'</strong></div>';
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:'admin-finance',direction:'Gọn rõ'},privateContent:{theme:s.theme,phone:s.phone}}).catch(()=>{}),nav=[['house','Hôm nay'],['package','Sản phẩm'],['truck','NCC'],['clipboard-list','Đơn hàng'],['chart-no-axes-combined','Tài chính']];
function report(){return '<div class="fi-row fi-between" style="margin-bottom:14px"><div><h2>Báo cáo kinh doanh</h2><p class="fi-small">Theo kỳ · Giờ Việt Nam</p></div><select data-period aria-label="Chọn kỳ" style="width:auto"><option>Hôm nay</option><option>Tháng này</option><option>Tùy chọn</option></select></div><div class="fi-grid">'+['Doanh thu','Chi phí','Lợi nhuận'].map(x=>'<section class="fi-panel"><span class="fi-small">'+x+' · '+s.period+'</span><div class="fi-kpi">Chưa đủ dữ liệu</div></section>').join('')+'</div><div class="fi-notice fi-warning">Cần đối soát đầy đủ đơn bán, đơn nhập NCC và khoản hoàn trước khi xác nhận số tổng. Mua thành công ghi chi ngay; không trừ lại khi bán.</div>'+btn('Xem thu chi','tab','data-tab="Thu chi"');}
function rows(data,kind){const list=data.filter(x=>JSON.stringify(x).toLocaleLowerCase('vi').includes(s.query.toLocaleLowerCase('vi').trim()));return '<label class="fi-field">Tìm trong dữ liệu đã tải<input type="search" data-search value="'+esc(s.query)+'" placeholder="Tìm mã, nội dung…"></label><p class="fi-small">'+list.length+' mục · '+(kind==='transactions'?'Tối đa 500 giao dịch':kind==='journals'?'Tối đa 100 bút toán':'Tối đa 100 giao dịch ngân hàng')+'</p>'+list.map(x=>'<article class="fi-item"><div><strong>'+esc(x.name)+'</strong><p class="fi-small">'+esc(x.id)+' · '+esc(x.date||x.status||'')+'</p><p class="fi-small">'+esc(x.kind||x.status||'')+'</p></div><div class="fi-row"><strong class="fi-amount">'+esc(x.amount)+'</strong>'+btn('Xem','open','data-kind="'+kind+'" data-id="'+x.id+'"')+'</div></article>').join('')+(list.length?'':'<div class="fi-notice">Không tìm thấy giao dịch phù hợp.</div>');}
function transactions(){return '<section class="fi-panel"><div class="fi-row fi-between"><div><h2>Thu chi</h2><p class="fi-small">Khoản ghi nhận và khoản cần đối soát</p></div>'+btn('Ghi thu / chi','add-transaction','',true)+'</div>'+rows(txs,'transactions')+'</section>';}
function wallet(){return '<section class="fi-panel"><div class="fi-row fi-between"><div><h2>Ví & sổ cái</h2><p class="fi-small">Giao dịch ví và đối chiếu số dư</p></div><div class="fi-row">'+btn('Điều chỉnh ví','adjust')+btn('Hoàn ví','refund')+'</div></div>'+rows(journals,'journals')+'</section>';}
function banking(){return '<section class="fi-panel"><div class="fi-row fi-between"><div><h2>Ngân hàng & đối soát</h2><p class="fi-small">Giao dịch nhận và kết quả xử lý</p></div>'+btn('Chạy đối soát','reconcile','',true)+'</div><div class="fi-notice fi-warning">1 giao dịch cần xử lý · Kiểm tra trước khi thử lại.</div>'+rows(bank,'bank')+'</section>';}
function main(){return '<div class="fi-title"><h1>Tài chính</h1><p class="fi-small">Thu chi, ví và đối soát</p></div><nav class="fi-tabs" aria-label="Mục tài chính">'+['Báo cáo','Thu chi','Ví & sổ cái','Ngân hàng & đối soát'].map(x=>btn(x,'tab','data-tab="'+x+'" '+(s.tab===x?'aria-current="page"':''))).join('')+'</nav>'+(s.tab==='Báo cáo'?report():s.tab==='Thu chi'?transactions():s.tab==='Ví & sổ cái'?wallet():banking());}
function panel(){if(!s.panel)return '';let title='',body='';if(s.panel==='detail'){const source=s.kind==='transactions'?txs:s.kind==='journals'?journals:bank,x=source.find(v=>v.id===s.id);title='Chi tiết giao dịch';body=line('Nội dung',esc(x.name))+line('Mã',esc(x.id))+line('Số tiền',esc(x.amount))+line('Trạng thái',esc(x.status||x.kind||''))+(s.kind==='transactions'&&x.status==='Cần đối soát'?'<div class="fi-notice fi-warning">Kiểm tra đơn NCC và khoản đã ghi trước khi xác nhận chi. Không mua lại.</div>':'')+(s.kind==='bank'&&x.status==='Cần xử lý'?'<div class="fi-notice fi-warning">Thử lại xử lý giao dịch ngân hàng, không thử mua hay giao hàng.</div>'+btn('Thử xử lý lại','simulate'):'');}else if(s.panel==='add-transaction'){title='Ghi thu / chi';body='<label class="fi-field">Loại<select><option>Chi phí</option><option>Thu</option><option>Đơn nhập NCC</option></select></label><label class="fi-field">Nội dung<input placeholder="Nội dung giao dịch"></label><label class="fi-field">Số tiền<input type="number" min="0"></label><div class="fi-notice fi-warning">Kiểm tra khoản nhập đã ghi để tránh trùng. Số liệu chính xác cần đối soát nguồn.</div>'+btn('Lưu giao dịch','simulate','',true);}else if(s.panel==='adjust'){title='Điều chỉnh ví';body='<label class="fi-field">Khách hàng<input placeholder="Mã khách hàng"></label><label class="fi-field">Số tiền điều chỉnh (+/−)<input type="number"></label><label class="fi-field">Lý do<input></label>'+btn('Xác nhận điều chỉnh','simulate','',true);}else if(s.panel==='refund'){title='Hoàn vào ví';body='<label class="fi-field">Mã đơn hàng<input placeholder="Mã đơn thanh toán bằng ví"></label><label class="fi-field">Lý do<input></label><div class="fi-notice">Hoàn toàn bộ đơn đủ điều kiện đã thanh toán bằng ví. Trạng thái thực tế cần được kiểm tra trước khi xác nhận.</div>'+btn('Kiểm tra đơn','simulate');}else if(s.panel==='reconcile'){title='Chạy đối soát';body='<label class="fi-field">Từ ngày<input type="date" value="2026-11-01"></label><label class="fi-field">Đến ngày<input type="date" value="2026-11-01"></label><p class="fi-small">Kiểm tra giao dịch ngân hàng trong khoảng ngày đã chọn.</p>'+btn('Chạy đối soát','simulate','style="margin-top:16px"',true);}return '<section class="fi-drawer" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="fi-head"><h2>'+esc(title)+'</h2>'+btn(icon('x'),'close','aria-label="Đóng"')+'</div>'+body+(s.message?'<div class="fi-notice" role="status">'+esc(s.message)+'</div>':'')+'</section>';}
function render(){app.dataset.theme=s.theme;app.classList.toggle('fi-phone',s.phone);app.innerHTML='<div class="fi-demo"><span>Tài chính · Dữ liệu minh họa</span><div class="fi-row">'+btn(icon(s.theme==='light'?'moon':'sun'),'theme','aria-label="Đổi sáng tối"')+'<button class="fi-link cursor-interaction" data-action="device">'+(s.phone?'Xem desktop':'Xem mobile')+'</button></div></div><div class="fi-wrap"><div class="fi-layout"><aside class="fi-side"><div class="fi-logo">Tiệm<em>Digital</em> <span class="fi-small">Admin</span></div>'+nav.map(([i,t])=>'<button class="fi-button '+(t==='Tài chính'?'fi-current':'')+'">'+icon(i)+t+'</button>').join('')+'</aside><main class="fi-main"><header class="fi-top"><strong>Tài chính</strong>'+btn(icon('settings'),'noop','aria-label="Cài đặt"')+'</header><div class="fi-content">'+main()+'</div><footer class="fi-footer">TiệmDigital · Bản mẫu, dữ liệu minh họa</footer></main></div>'+panel()+'</div><nav class="fi-bottom" aria-label="Điều hướng admin">'+nav.map(([i,t])=>'<button class="'+(t==='Tài chính'?'fi-current':'')+'">'+icon(i)+'<span>'+t+'</span></button>').join('')+'</nav>';const period=app.querySelector('[data-period]');if(period)period.value=s.period;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
app.addEventListener('input',e=>{if(e.target.matches('[data-search]')){s.query=e.target.value;const pos=e.target.selectionStart;render();const n=app.querySelector('[data-search]');n.focus();n.setSelectionRange(pos,pos);}});
app.addEventListener('change',e=>{if(e.target.matches('[data-period]')){s.period=e.target.value;render();}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;s.message='';switch(b.dataset.action){case'theme':s.theme=s.theme==='light'?'dark':'light';save();break;case'device':s.phone=!s.phone;save();break;case'tab':s.tab=b.dataset.tab;s.query='';s.panel='';break;case'open':s.panel='detail';s.kind=b.dataset.kind;s.id=b.dataset.id;break;case'add-transaction':s.panel='add-transaction';break;case'adjust':s.panel='adjust';break;case'refund':s.panel='refund';break;case'reconcile':s.panel='reconcile';break;case'close':s.panel='';break;case'simulate':s.message='Đã mô phỏng thao tác; không tạo giao dịch hay thay đổi số dư thật.';break;}render();});
render();window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!p)return;s.theme=p.theme==='dark'?'dark':'light';s.phone=p.phone===true;render();});
})();
</script>
