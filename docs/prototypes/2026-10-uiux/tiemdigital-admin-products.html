<style>
#td-products{font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#142033}#td-products *{box-sizing:border-box}#td-products [hidden]{display:none!important}#td-products .pr-app{--bg:#f6f8fc;--paper:#fff;--ink:#142033;--muted:#5c697c;--line:#dfe5ef;--soft:#eaf0ff;--link:#3358cf;--brand:#3358cf;--good:#236448;--warn:#925000;--warm:#fff3de;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;container:pr / inline-size;min-width:0;color-scheme:light}#td-products .pr-app[data-theme=dark]{--bg:#131923;--paper:#1b2432;--ink:#ecf0f8;--muted:#b1bfd1;--line:#344257;--soft:#283a5d;--link:#a6bcff;--good:#9bd6b4;--warn:#ffd599;--warm:#3c3022;color-scheme:dark}#td-products .pr-phone{max-width:390px;margin:auto}#td-products h1,#td-products h2,#td-products h3,#td-products p{margin:0}#td-products h1{font-size:26px;line-height:1.2}#td-products h2{font-size:19px;line-height:1.3}#td-products h3{font-size:14px}#td-products button,#td-products input,#td-products select{font:inherit}#td-products button{cursor:inherit}#td-products button:focus-visible,#td-products input:focus-visible,#td-products select:focus-visible{outline:2px solid var(--link);outline-offset:3px}
#td-products .pr-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 11px;min-height:38px;font-size:12px;font-weight:600}#td-products .pr-primary{background:var(--brand);border-color:var(--brand);color:#fff}#td-products .pr-button:disabled{opacity:.5;cursor:default}#td-products .pr-link{border:0;background:none;color:var(--link);padding:4px 0;min-height:32px;font-size:12px}#td-products .pr-icon{width:16px;height:16px;flex-shrink:0}#td-products .pr-small{font-size:12px;color:var(--muted)}#td-products .pr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-products .pr-between{justify-content:space-between}
#td-products .pr-demo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;font-size:12px;color:var(--muted)}#td-products .pr-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:650px}#td-products .pr-sidebar{padding:20px 12px;background:var(--paper);border-right:1px solid var(--line)}#td-products .pr-logo{padding:0 9px 20px;font-size:19px;font-weight:700;letter-spacing:-.5px}#td-products .pr-logo em{font-style:normal;color:var(--link)}#td-products .pr-sidebar .pr-button{display:flex;justify-content:flex-start;width:100%;border:0;background:transparent;color:var(--muted);margin:4px 0}#td-products .pr-sidebar .pr-current{background:var(--soft);color:var(--link)}#td-products .pr-main{min-width:0}#td-products .pr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#td-products .pr-content{padding:22px;min-width:0}#td-products .pr-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}#td-products .pr-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}#td-products .pr-tabs [aria-current=page]{background:var(--soft);color:var(--link);border-color:var(--link)}
#td-products .pr-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:17px;min-width:0}#td-products .pr-filters{display:grid;grid-template-columns:minmax(0,1fr) 140px 130px;gap:8px}#td-products input:not([type=checkbox]),#td-products select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px}#td-products input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand);flex-shrink:0}#td-products .pr-notice{border-radius:8px;background:var(--warm);color:var(--warn);padding:10px 12px;font-size:12px;margin-top:12px}#td-products .pr-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}#td-products .pr-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}#td-products .pr-table th{text-align:left;color:var(--muted);font-weight:500;padding:10px 6px}#td-products .pr-table td{vertical-align:middle;padding:13px 6px;border-top:1px solid var(--line);overflow-wrap:anywhere}#td-products .pr-table th:nth-child(1){width:36px}#td-products .pr-table th:nth-child(2){width:25%}#td-products .pr-table th:nth-child(3){width:17%}#td-products .pr-table th:nth-child(4){width:14%}#td-products .pr-table th:nth-child(5){width:12%}#td-products .pr-table td:last-child{width:200px}#td-products .pr-name{border:0;background:none;color:var(--ink);font-weight:650;padding:0;text-align:left}#td-products .pr-price{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}#td-products .pr-status{display:inline-block;font-size:11px;color:var(--good)}#td-products .pr-warning{color:var(--warn)}#td-products .pr-cards{display:none}#td-products .pr-empty{text-align:center;color:var(--muted);padding:30px 10px}
#td-products .pr-overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 18%,transparent);z-index:4;display:flex;justify-content:flex-end;border-radius:12px}#td-products .pr-wrap{position:relative}#td-products .pr-drawer{background:var(--paper);width:min(520px,100%);padding:22px;border-left:1px solid var(--line);border-radius:0 12px 12px 0;min-width:0}#td-products .pr-drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}#td-products .pr-field{display:block;font-size:12px;margin:15px 0}#td-products .pr-field input,#td-products .pr-field select{margin-top:6px}#td-products .pr-review-row{padding:14px 0;border-top:1px solid var(--line)}#td-products .pr-review-row .pr-field{margin:8px 0 0}#td-products .pr-progress{padding:12px;background:var(--soft);border-radius:8px;font-size:12px;margin:15px 0}#td-products .pr-footer{font-size:12px;color:var(--muted);padding:0 22px 20px}#td-products .pr-bottom{display:none}
@container pr (max-width:720px){#td-products .pr-layout{display:block;min-height:0}#td-products .pr-sidebar{display:none}#td-products .pr-content{padding:19px 15px}#td-products .pr-top{padding:16px}#td-products .pr-filters{grid-template-columns:1fr 1fr}#td-products .pr-filters input{grid-column:1/-1;font-size:16px}#td-products select,#td-products .pr-field input{font-size:16px}#td-products .pr-table{display:none}#td-products .pr-cards{display:block}#td-products .pr-card{border-top:1px solid var(--line);padding:15px 0}#td-products .pr-card-top{display:flex;align-items:flex-start;gap:10px}#td-products .pr-card-info{min-width:0;flex:1}#td-products .pr-card-actions{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 0 27px}#td-products .pr-drawer{width:100%;border:0;border-radius:12px}#td-products .pr-bottom{display:grid;position:sticky;bottom:0;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:5px 4px;border-radius:0 0 12px 12px}#td-products .pr-bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:3px 0;border:0;background:none;color:var(--muted);font-size:10px}#td-products .pr-bottom .pr-current{color:var(--link)}#td-products .pr-footer{padding:0 15px 16px}}
#td-products .pr-wrap:has(.pr-overlay){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px)}#td-products .pr-wrap:has(.pr-overlay) .pr-layout{grid-template-columns:1fr}#td-products .pr-wrap:has(.pr-overlay) .pr-sidebar{display:none}#td-products .pr-overlay{position:relative;inset:auto;background:transparent;display:block}#td-products .pr-drawer{width:100%;min-height:100%}
@container pr (max-width:720px){#td-products .pr-wrap:has(.pr-overlay){display:block}#td-products .pr-wrap:has(.pr-overlay) .pr-layout{display:none}}
@media(pointer:coarse){#td-products button{min-height:44px}}
</style>
<div id="td-products"><div id="td-pr-app" class="pr-app" data-theme="light" aria-label="Bản mẫu quản lý sản phẩm TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById('td-pr-app'),prior=window.openai?.widgetState?.privateContent||{};
const s={theme:prior.theme==='dark'?'dark':'light',phone:prior.phone===true,tab:'Hàng từ NCC',query:'',provider:'Tất cả NCC',stock:'Tất cả',categoryFilter:'Mọi danh mục',sort:'Mặc định',selected:new Set(),dialog:'',draft:[],markup:30,category:'Công cụ AI',result:[],scenario:'normal',details:null};
const items=[{id:1,name:'Trợ lý AI Pro',provider:'NCC A',category:'Công cụ AI',cost:99000,stock:'Còn hàng',linked:false},{id:2,name:'Thiết kế sáng tạo',provider:'NCC B',category:'Thiết kế',cost:59000,stock:'Còn hàng',linked:false},{id:3,name:'Lưu trữ đám mây',provider:'NCC A',category:'Tiện ích',cost:39000,stock:'Không rõ số lượng',linked:false},{id:4,name:'Bộ công cụ nội dung',provider:'NCC B',category:'Công cụ AI',cost:79000,stock:'Hết hàng',linked:false},{id:5,name:'Tài khoản làm việc',provider:'NCC C',category:'Tiện ích',cost:129000,stock:'Còn hàng',linked:true}];
const icon=n=>'<i class="pr-icon" data-lucide="'+n+'" aria-hidden="true"></i>',money=n=>new Intl.NumberFormat('vi-VN').format(n)+' ₫',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,extra='',primary=false)=>'<button type="button" class="pr-button cursor-interaction '+(primary?'pr-primary':'')+'" data-action="'+action+'" '+extra+'>'+label+'</button>';
function saleCatalog(){const rows=items.filter(p=>p.linked&&p.name.toLocaleLowerCase('vi').includes(s.query.toLocaleLowerCase('vi').trim()));return '<section class="pr-panel"><div class="pr-filters"><input type="search" aria-label="Tìm sản phẩm đang bán" data-search value="'+esc(s.query)+'" placeholder="Tìm sản phẩm đang bán…"></div><div class="pr-toolbar"><strong>'+rows.length+' sản phẩm đang bán</strong></div>'+rows.map(p=>'<article class="pr-review-row"><div class="pr-row pr-between"><div><strong>'+esc(p.name)+'</strong><p class="pr-small">'+p.category+' · '+p.provider+' · Đang bán</p><span class="pr-price">'+money(p.salePrice??Math.round(p.cost*1.3))+'</span></div>'+btn('Sửa','edit-sale','data-id="'+p.id+'"')+'</div></article>').join('')+(rows.length?'':'<div class="pr-empty">Không tìm thấy sản phẩm đang bán.</div>')+'</section>';}
function stockCatalog(){return '<section class="pr-panel"><div class="pr-row pr-between"><div><h2>Kho</h2><p class="pr-small">Hàng chưa giao và đã giao theo từng sản phẩm</p></div></div><article class="pr-review-row"><div class="pr-row pr-between"><div><strong>Kho tài khoản làm việc</strong><p class="pr-small">Chưa giao: 3 · Đã giao: 2</p></div>'+btn('Xem hàng','stock-detail')+'</div></article></section>';}
const nav=[['house','Hôm nay'],['package','Sản phẩm'],['truck','NCC'],['clipboard-list','Đơn hàng'],['chart-no-axes-combined','Tài chính']];
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:'admin-products',direction:'Gọn rõ'},privateContent:{theme:s.theme,phone:s.phone}}).catch(()=>{});
function visible(){const rows=items.filter(p=>(s.scenario!=='provider-error'||p.provider!=='NCC C')&&(s.tab!=='Danh mục bán'||p.linked)&&(s.provider==='Tất cả NCC'||p.provider===s.provider)&&(s.stock==='Tất cả'||p.stock===s.stock)&&(s.categoryFilter==='Mọi danh mục'||p.category===s.categoryFilter)&&[p.name,p.provider,p.category].join(' ').toLocaleLowerCase('vi').includes(s.query.toLocaleLowerCase('vi').trim()));if(s.sort==='Giá thấp trước')rows.sort((a,b)=>a.cost-b.cost);if(s.sort==='Giá cao trước')rows.sort((a,b)=>b.cost-a.cost);return rows;}
function actions(p){const disabled=p.stock==='Hết hàng'?'disabled':'';return btn('Mua dùng','purchase','data-id="'+p.id+'" data-purpose="use" '+disabled)+' '+btn('Mua nhập kho','purchase','data-id="'+p.id+'" data-purpose="stock" '+disabled);}
function checkbox(p){return '<input type="checkbox" aria-label="Chọn '+esc(p.name)+'" data-select="'+p.id+'" '+(s.selected.has(p.id)?'checked ':'')+(p.linked?'disabled':'')+'>';}
function table(rows){return '<table class="pr-table"><thead><tr><th><input type="checkbox" aria-label="Chọn sản phẩm hiển thị có thể lên kệ" data-all '+(rows.some(p=>!p.linked)&&rows.filter(p=>!p.linked).every(p=>s.selected.has(p.id))?'checked':'')+'></th><th>Sản phẩm</th><th>Nhà cung cấp</th><th>Giá nguồn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+checkbox(p)+'</td><td><button class="pr-name cursor-interaction" data-action="detail" data-id="'+p.id+'">'+esc(p.name)+'</button><div class="pr-small">'+p.category+'</div></td><td>'+p.provider+'</td><td class="pr-price">'+money(p.cost)+'</td><td><span class="pr-status '+(p.stock==='Hết hàng'?'pr-warning':'')+'">'+(p.linked?'Đã lên kệ':p.stock)+'</span></td><td><div class="pr-row">'+actions(p)+'</div></td></tr>').join('')+'</tbody></table><div class="pr-cards">'+rows.map(p=>'<article class="pr-card"><div class="pr-card-top">'+checkbox(p)+'<div class="pr-card-info"><button class="pr-name cursor-interaction" data-action="detail" data-id="'+p.id+'">'+esc(p.name)+'</button><div class="pr-small">'+p.provider+' · '+p.category+'</div><div class="pr-row" style="margin-top:5px"><span class="pr-price">'+money(p.cost)+'</span><span class="pr-status">'+(p.linked?'Đã lên kệ':p.stock)+'</span></div></div></div><div class="pr-card-actions">'+actions(p)+'</div></article>').join('')+'</div>';}
function catalog(){if(s.tab==='Kho')return stockCatalog();if(s.tab==='Danh mục bán')return saleCatalog();const rows=visible();return '<div class="pr-panel"><div class="pr-filters"><input type="search" aria-label="Tìm sản phẩm" placeholder="Tìm tên, danh mục, nhà cung cấp…" value="'+esc(s.query)+'" data-search><select data-provider aria-label="Lọc nhà cung cấp">'+['Tất cả NCC','NCC A','NCC B','NCC C'].map(x=>'<option '+(s.provider===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select data-stock aria-label="Lọc tồn hàng">'+['Tất cả','Còn hàng','Hết hàng','Không rõ số lượng'].map(x=>'<option '+(s.stock===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select data-category-filter aria-label="Lọc danh mục">'+['Mọi danh mục','Công cụ AI','Thiết kế','Tiện ích'].map(x=>'<option '+(s.categoryFilter===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select data-sort aria-label="Sắp xếp giá">'+['Mặc định','Giá thấp trước','Giá cao trước'].map(x=>'<option '+(s.sort===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+(s.scenario==='provider-error'?'<div class="pr-notice">NCC C chưa tải được. Các NCC còn lại vẫn sử dụng được. <button class="pr-link cursor-interaction" data-action="retry-provider">Thử tải lại</button></div>':'')+'<div class="pr-toolbar"><div class="pr-row"><strong>'+rows.length+' sản phẩm</strong><span class="pr-small">· Đã chọn '+s.selected.size+'</span></div>'+btn('Lên kệ đã chọn ('+s.selected.size+')','review',s.selected.size?'':'disabled',true)+'</div><p class="pr-small">Chọn trong danh sách đã tải; sản phẩm đã lên kệ không chọn lại.</p>'+(rows.length?table(rows):'<div class="pr-empty">Không tìm thấy sản phẩm phù hợp.</div>')+'</div>';}
function draftBody(){return '<p class="pr-small">Kiểm tra giá và thông tin trước khi đưa '+s.draft.length+' sản phẩm lên kệ.</p><label class="pr-field">Giá bán tăng theo % so với giá nguồn<input type="number" min="0" max="1000" value="'+s.markup+'" data-markup></label>'+btn('Áp dụng giá cho tất cả','apply-markup')+'<label class="pr-field">Danh mục áp dụng chung<select data-category>'+['Công cụ AI','Thiết kế','Tiện ích'].map(x=>'<option '+(x===s.category?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+btn('Áp dụng danh mục cho tất cả','apply-category')+'<div style="margin-top:20px">'+s.draft.map(d=>'<article class="pr-review-row"><strong>'+esc(d.name)+'</strong><div class="pr-small">'+d.provider+' · Giá nguồn '+money(d.cost)+'</div><label class="pr-field">Tên hiển thị<input value="'+esc(d.name)+'" data-name="'+d.id+'"></label><label class="pr-field">Mô tả<input value="'+esc(d.description)+'" data-description="'+d.id+'"></label><label class="pr-field">Ảnh nguồn<input value="'+esc(d.image)+'" data-image="'+d.id+'"></label><label class="pr-field">Giá bán (VNĐ)<input type="number" min="0" value="'+d.price+'" data-price="'+d.id+'"></label><label class="pr-field">Danh mục<input value="'+esc(d.category)+'" data-item-category="'+d.id+'"></label></article>').join('')+'</div><div class="pr-notice">Một lần xác nhận sẽ bật bán các sản phẩm được lưu thành công. Nội dung có thể sửa sau.</div>'+btn('Xác nhận và lên kệ','publish','style="width:100%;margin-top:15px"',true);}
function resultBody(){const ok=s.result.filter(x=>x.status==='ok'),bad=s.result.filter(x=>x.status!=='ok');return '<div class="pr-progress"><strong>'+ok.length+' sản phẩm đã lên kệ</strong> · '+bad.length+' cần xử lý</div>'+s.result.map(r=>'<article class="pr-review-row"><strong>'+esc(r.name)+'</strong><p class="pr-small">'+(r.status==='ok'?'Đã lên kệ':r.status==='unknown'?'Chưa rõ kết quả · Kiểm tra trạng thái trước khi thử lại':'Chưa lưu được · Có thể thử lại')+'</p>'+(r.status==='fail'?btn('Thử lại mục này','retry-item','data-id="'+r.id+'"'):r.status==='unknown'?btn('Kiểm tra trạng thái','check-item','data-id="'+r.id+'"'):'')+'</article>').join('')+btn('Hoàn tất','close-dialog','style="width:100%;margin-top:15px"',true);}
function dialog(){if(!s.dialog)return '';let title='',body='';if(s.dialog==='review'){title='Đưa sản phẩm lên kệ';body=draftBody();}if(s.dialog==='result'){title='Kết quả lên kệ';body=resultBody();}if(s.dialog==='detail'){const p=items.find(x=>x.id===s.details);title=p.name;body='<p class="pr-small">'+p.provider+' · '+p.category+'</p><div class="pr-progress">Giá nguồn '+money(p.cost)+' · '+p.stock+'</div><p class="pr-small">'+(p.linked?'Sản phẩm đã được liên kết với danh mục bán.':'Tên, mô tả và hình ảnh được lấy từ nguồn để chỉnh khi lên kệ.')+'</p><div class="pr-row" style="margin-top:18px">'+actions(p)+'</div>';}if(s.dialog==='purchase'){const p=items.find(x=>x.id===s.details);title=s.purpose==='use'?'Mua dùng':'Mua nhập kho';body='<p class="pr-small">'+p.name+' · '+p.provider+'</p><div class="pr-progress">Luồng mua và nhập kho được tiếp tục tại phần Đơn nhập NCC.</div>'+btn('Đóng','close-dialog');}if(s.dialog==='edit-sale'){const p=items.find(x=>x.id===s.details);title='Sửa sản phẩm';body='<label class="pr-field">Tên sản phẩm<input data-sale-name value="'+esc(p.name)+'"></label><label class="pr-field">Giá bán<input data-sale-price type="number" min="0" value="'+(p.salePrice??Math.round(p.cost*1.3))+'"></label>'+btn('Lưu thay đổi','save-sale','',true);}if(s.dialog==='stock-detail'){title='Hàng trong kho';body='<h3>Kho tài khoản làm việc</h3><div class="pr-progress">Chưa giao: 3 · Đã giao: 2</div><article class="pr-review-row"><strong>DEMO-KEY-01</strong><p class="pr-small">Chưa giao · Nhập từ đơn NCC</p></article><article class="pr-review-row"><strong>DEMO-KEY-02</strong><p class="pr-small">Đã giao · Liên kết đơn bán</p></article>';}return '<div class="pr-overlay"><section class="pr-drawer" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="pr-drawer-head"><h2>'+esc(title)+'</h2>'+btn(icon('x'),'close-dialog','aria-label="Đóng"')+'</div>'+body+'</section></div>';}
function render(){app.dataset.theme=s.theme;app.classList.toggle('pr-phone',s.phone);app.innerHTML='<div class="pr-demo"><span>Sản phẩm · Dữ liệu minh họa</span><div class="pr-row">'+btn(icon(s.theme==='light'?'moon':'sun'),'theme','aria-label="Đổi sáng tối"')+'<button class="pr-link cursor-interaction" data-action="device">'+(s.phone?'Xem desktop':'Xem mobile')+'</button></div></div><div class="pr-wrap"><div class="pr-layout"><aside class="pr-sidebar"><div class="pr-logo">Tiệm<em>Digital</em> <span class="pr-small">Admin</span></div>'+nav.map(([i,t])=>'<button type="button" class="pr-button '+(t==='Sản phẩm'?'pr-current':'')+'">'+icon(i)+t+'</button>').join('')+'</aside><main class="pr-main"><header class="pr-top"><strong>Sản phẩm</strong>'+btn(icon('settings'),'settings','aria-label="Cài đặt"')+'</header><div class="pr-content"><div class="pr-title"><div><h1>Sản phẩm</h1><p class="pr-small">Quản lý nguồn hàng và danh mục bán</p></div>'+btn('Mô phỏng lỗi NCC','toggle-provider')+'</div><nav class="pr-tabs" aria-label="Các mục sản phẩm">'+['Danh mục bán','Hàng từ NCC','Kho'].map(x=>btn(x,'tab','data-tab="'+x+'" '+(s.tab===x?'aria-current="page"':''))).join('')+'</nav>'+catalog()+'</div><footer class="pr-footer">TiệmDigital · Bản mẫu tương tác, dữ liệu minh họa</footer></main></div>'+dialog()+'</div><nav class="pr-bottom" aria-label="Điều hướng admin">'+nav.map(([i,t])=>'<button type="button" class="'+(t==='Sản phẩm'?'pr-current':'')+'">'+icon(i)+'<span>'+t+'</span></button>').join('')+'</nav>';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
app.addEventListener('input',e=>{if(e.target.matches('[data-search]')){s.query=e.target.value;const pos=e.target.selectionStart;render();const input=app.querySelector('[data-search]');input.focus();input.setSelectionRange(pos,pos);}if(e.target.matches('[data-markup]'))s.markup=Math.max(0,Number(e.target.value)||0);if(e.target.matches('[data-price]')){const d=s.draft.find(x=>x.id===Number(e.target.dataset.price));d.price=Math.max(0,Number(e.target.value)||0);}if(e.target.matches('[data-item-category]'))s.draft.find(x=>x.id===Number(e.target.dataset.itemCategory)).category=e.target.value;for(const key of ['name','description','image'])if(e.target.hasAttribute('data-'+key))s.draft.find(x=>x.id===Number(e.target.dataset[key]))[key]=e.target.value;});
app.addEventListener('change',e=>{if(e.target.matches('[data-provider]')){s.provider=e.target.value;render();}if(e.target.matches('[data-stock]')){s.stock=e.target.value;render();}if(e.target.matches('[data-category-filter]')){s.categoryFilter=e.target.value;render();}if(e.target.matches('[data-sort]')){s.sort=e.target.value;render();}if(e.target.matches('[data-category]'))s.category=e.target.value;if(e.target.matches('[data-select]')){const id=Number(e.target.dataset.select);e.target.checked?s.selected.add(id):s.selected.delete(id);render();}if(e.target.matches('[data-all]')){visible().filter(p=>!p.linked).forEach(p=>e.target.checked?s.selected.add(p.id):s.selected.delete(p.id));render();}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const apply=d=>{const p=items.find(x=>x.id===d.id);Object.assign(p,{name:d.name,description:d.description,image:d.image,category:d.category,salePrice:d.price});};if(b.dataset.action==='publish')s.draft.forEach((d,i)=>{if(i!==1)apply(d);});if(b.dataset.action==='retry-item'){const d=s.draft.find(x=>x.id===Number(b.dataset.id));if(d)apply(d);}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case'theme':s.theme=s.theme==='light'?'dark':'light';save();break;case'device':s.phone=!s.phone;save();break;case'tab':s.tab=b.dataset.tab;s.query='';s.provider='Tất cả NCC';s.stock='Tất cả';break;case'toggle-provider':s.scenario=s.scenario==='normal'?'provider-error':'normal';break;case'retry-provider':s.scenario='normal';break;case'detail':s.details=Number(b.dataset.id);s.dialog='detail';break;case'purchase':s.details=Number(b.dataset.id);s.purpose=b.dataset.purpose;s.dialog='purchase';break;case'edit-sale':s.details=Number(b.dataset.id);s.dialog='edit-sale';break;case'stock-detail':s.dialog='stock-detail';break;case'save-sale':{const p=items.find(x=>x.id===s.details);p.name=app.querySelector('[data-sale-name]').value;p.salePrice=Math.max(0,Number(app.querySelector('[data-sale-price]').value)||0);s.dialog='';break;}case'close-dialog':s.dialog='';break;case'review':s.draft=items.filter(p=>s.selected.has(p.id)&&!p.linked).map(p=>({...p,description:'Mô tả từ NCC',image:'Ảnh sản phẩm từ NCC',price:Math.round(p.cost*(1+s.markup/100))}));if(s.draft.length)s.dialog='review';break;case'apply-markup':s.draft.forEach(d=>d.price=Math.round(d.cost*(1+s.markup/100)));break;case'apply-category':s.draft.forEach(d=>d.category=s.category);break;case'publish':s.result=s.draft.map((d,i)=>({id:d.id,name:d.name,status:i===1?'fail':'ok'}));s.result.filter(r=>r.status==='ok').forEach(r=>{items.find(p=>p.id===r.id).linked=true;s.selected.delete(r.id);});s.dialog='result';break;case'retry-item':{const r=s.result.find(x=>x.id===Number(b.dataset.id));r.status='ok';items.find(x=>x.id===r.id).linked=true;s.selected.delete(r.id);break;}case'check-item':{const r=s.result.find(x=>x.id===Number(b.dataset.id));r.status='fail';break;}}render();});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.dialog){s.dialog='';render();}});render();window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!p)return;s.theme=p.theme==='dark'?'dark':'light';s.phone=p.phone===true;render();});
})();
</script>
