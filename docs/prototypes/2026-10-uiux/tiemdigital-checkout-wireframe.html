<style>
#td-checkout{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5;color:#142033}
#td-checkout *{box-sizing:border-box}#td-checkout [hidden]{display:none!important}
#td-checkout .co-app{--co-bg:#f6f8fc;--co-paper:#fff;--co-text:#142033;--co-muted:#5c697c;--co-line:#dfe5ef;--co-soft:#eaf0ff;--co-brand:#3358cf;--co-link:#3358cf;--co-good:#236448;--co-warn:#925000;--co-warm:#fff3de;background:var(--co-bg);color:var(--co-text);border:1px solid var(--co-line);border-radius:12px;container:checkout / inline-size;color-scheme:light;min-width:0}
#td-checkout .co-app[data-theme=dark]{--co-bg:#131923;--co-paper:#1b2432;--co-text:#ecf0f8;--co-muted:#b1bfd1;--co-line:#344257;--co-soft:#283a5d;--co-link:#a6bcff;--co-good:#9bd6b4;--co-warn:#ffd599;--co-warm:#3c3022;color-scheme:dark}
#td-checkout .co-phone{max-width:390px;margin-inline:auto}#td-checkout h1,#td-checkout h2,#td-checkout h3,#td-checkout p{margin:0}
#td-checkout button,#td-checkout input,#td-checkout select{font:inherit}#td-checkout button{cursor:inherit}#td-checkout button:focus-visible,#td-checkout input:focus-visible,#td-checkout select:focus-visible{outline:2px solid var(--co-link);outline-offset:3px}
#td-checkout .co-demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 22px;background:var(--co-paper);border-bottom:1px solid var(--co-line);border-radius:12px 12px 0 0;color:var(--co-muted);font-size:12px}
#td-checkout .co-demo select{max-width:230px;padding:6px 9px;font-size:12px}#td-checkout .co-demo label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#td-checkout .co-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 26px;background:var(--co-paper);border-bottom:1px solid var(--co-line)}
#td-checkout .co-logo{font-size:21px;font-weight:700;letter-spacing:-.8px;background:none;border:0;color:var(--co-text);padding:0}#td-checkout .co-logo em{font-style:normal;color:var(--co-link)}
#td-checkout .co-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-checkout .co-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 13px;border:1px solid var(--co-line);border-radius:8px;background:var(--co-paper);color:var(--co-text);font-size:13px;font-weight:600}
#td-checkout .co-primary{background:var(--co-brand);border-color:var(--co-brand);color:#fff}#td-checkout .co-button:disabled{opacity:.55;cursor:default}#td-checkout .co-wide{width:100%}#td-checkout .co-link{border:0;background:transparent;padding:4px 0;color:var(--co-link);font-size:12px;min-height:32px}
#td-checkout .co-icon{width:16px;height:16px}#td-checkout .co-small{font-size:12px;color:var(--co-muted)}#td-checkout .co-main{padding:25px 26px 30px;min-width:0}
#td-checkout h1{font-size:27px;font-weight:650;line-height:1.2;letter-spacing:-.7px}#td-checkout h2{font-size:23px;font-weight:650;line-height:1.25;letter-spacing:-.5px}#td-checkout h3{font-size:16px;font-weight:650}
#td-checkout .co-workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,410px);gap:24px;align-items:start}
#td-checkout .co-context{padding-top:8px}#td-checkout .co-context h1{margin-bottom:20px}#td-checkout .co-product{padding:22px;border:1px solid var(--co-line);border-radius:12px;background:var(--co-paper)}
#td-checkout .co-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:10px;background:var(--co-soft);color:var(--co-link);font-weight:650;font-size:22px;margin-bottom:15px}#td-checkout .co-product p{margin:8px 0 18px;color:var(--co-muted);font-size:13px}#td-checkout .co-price{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.6px}#td-checkout .co-instock{font-size:12px;color:var(--co-good)}
#td-checkout .co-panel{min-width:0;background:var(--co-paper);border:1px solid var(--co-line);border-radius:12px;padding:23px}#td-checkout .co-panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}#td-checkout .co-panel h2{margin-bottom:9px}#td-checkout .co-subtitle{font-size:13px;color:var(--co-muted);margin-bottom:22px}
#td-checkout .co-selection{padding:15px 0;border-bottom:1px solid var(--co-line);display:flex;align-items:center;gap:12px}#td-checkout .co-selection .co-mark{margin:0;width:39px;height:39px;font-size:17px;flex-shrink:0}#td-checkout .co-selection strong{font-size:14px}#td-checkout .co-qty{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px 0;font-size:13px}
#td-checkout input:not([type=radio]){padding:10px 11px;border:1px solid var(--co-line);border-radius:8px;background:var(--co-paper);color:var(--co-text);width:100%;min-width:0;font-size:14px}#td-checkout .co-qty input{width:76px}#td-checkout select{padding:9px;border:1px solid var(--co-line);border-radius:8px;color:var(--co-text);background:var(--co-paper)}
#td-checkout .co-field{display:block;margin:14px 0;font-size:13px}#td-checkout .co-field input{margin-top:7px}#td-checkout .co-total{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin:20px 0;font-size:13px}#td-checkout .co-total strong{font-size:22px;font-variant-numeric:tabular-nums}
#td-checkout .co-methods{border:0;padding:0;margin:21px 0}#td-checkout .co-methods legend{font-size:13px;font-weight:600;margin-bottom:10px}#td-checkout .co-method{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid var(--co-line);border-radius:9px;margin:8px 0;font-size:13px}#td-checkout .co-method:has(input:checked){background:var(--co-soft);border-color:var(--co-link)}#td-checkout .co-method input{margin:4px 0 0;accent-color:var(--co-brand)}#td-checkout .co-method strong{display:block;font-weight:600}#td-checkout .co-method small{display:block;color:var(--co-muted);font-size:12px;margin-top:3px}
#td-checkout .co-note{font-size:12px;color:var(--co-muted);margin-top:12px!important}#td-checkout .co-notice{padding:13px 14px;background:var(--co-soft);border-radius:8px;margin:18px 0;font-size:13px}#td-checkout .co-warning{background:var(--co-warm);color:var(--co-warn)}#td-checkout .co-status{font-size:12px;border-radius:30px;padding:4px 9px;display:inline-flex;align-items:center;gap:5px;background:var(--co-soft);color:var(--co-link)}#td-checkout .co-success{color:var(--co-good)}
#td-checkout .co-lines{margin:16px 0}#td-checkout .co-line{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:13px}#td-checkout .co-line>span:first-child{color:var(--co-muted)}#td-checkout .co-line>strong{text-align:right;font-weight:600;overflow-wrap:anywhere}
#td-checkout .co-qr{width:166px;height:166px;margin:20px auto 9px;display:grid;place-items:center;border:10px solid var(--co-line);background:var(--co-soft);color:var(--co-link);font-size:15px;font-weight:600;text-align:center;line-height:1.4}#td-checkout .co-qr .co-icon{width:48px;height:48px;margin:auto auto 8px;display:block}#td-checkout .co-center{text-align:center}#td-checkout .co-data{width:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:var(--co-bg);border:1px solid var(--co-line);border-radius:8px;padding:13px;font:13px/1.7 Consolas,monospace;margin:12px 0;color:var(--co-text)}
#td-checkout .co-result-heading{display:flex;gap:12px;align-items:center;margin:18px 0}#td-checkout .co-result-heading>.co-icon{width:28px;height:28px;color:var(--co-good);flex-shrink:0}#td-checkout .co-result-heading h2{margin:0}#td-checkout .co-history{max-width:850px;margin:auto}#td-checkout .co-history-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}#td-checkout .co-order{display:flex;justify-content:space-between;gap:18px;align-items:center;background:var(--co-paper);border:1px solid var(--co-line);border-radius:12px;padding:20px;margin-top:12px}#td-checkout .co-order p{margin:5px 0 10px;font-size:13px;color:var(--co-muted)}
#td-checkout .co-simulation{border-top:1px dashed var(--co-line);padding-top:13px;margin-top:23px}#td-checkout .co-simulation .co-button{margin-top:8px;font-size:12px;min-height:36px}#td-checkout .co-divider{text-align:center;color:var(--co-muted);font-size:12px;margin:18px 0}#td-checkout .co-footer{font-size:12px;color:var(--co-muted);padding-top:24px}#td-checkout .co-auth-tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}#td-checkout .co-auth-tabs [aria-pressed=true]{background:var(--co-soft);color:var(--co-link);border-color:var(--co-link)}
@container checkout (max-width:700px){#td-checkout .co-workspace{grid-template-columns:1fr;gap:0}#td-checkout .co-context{display:none}#td-checkout .co-main{padding:18px 16px 24px}#td-checkout .co-panel{border:0;padding:4px 0;background:var(--co-bg)}#td-checkout .co-header{padding:18px 16px}#td-checkout .co-demo{padding:10px 16px}#td-checkout .co-demo select{max-width:100%}#td-checkout .co-account-label{display:none}#td-checkout .co-order{align-items:flex-start;padding:15px;flex-direction:column;gap:8px}#td-checkout input:not([type=radio]){font-size:16px}#td-checkout .co-history-head h1{font-size:24px}#td-checkout .co-panel-top{margin-bottom:16px}#td-checkout .co-simulation{margin-top:20px}}
@media(pointer:coarse){#td-checkout button,#td-checkout .co-method{min-height:44px}}
</style>
<div id="td-checkout"><div id="td-co-app" class="co-app" data-theme="light" aria-label="Luồng mua hàng TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById("td-co-app");
const prior=window.openai?.widgetState?.privateContent||{};
const s={theme:prior.theme==="dark"?"dark":"light",phone:prior.phone===true,scenario:"guest",stage:"purchase",auth:false,qty:1,balance:500000,method:"wallet",loginTab:"password",authBack:"purchase",view:"shop",busy:false,order:null,orders:[],copy:false};
const labels={guest:"Khách chưa đăng nhập",wallet:"Ví đủ số dư",qr:"Ví thiếu số dư",partial:"Giao một phần",review:"Chờ đối soát",handling:"Cần shop xử lý",error:"Lỗi kết nối",expired:"QR hết hạn"};
const money=n=>new Intl.NumberFormat("vi-VN").format(n)+" ₫",total=()=>129000*s.qty;
const icon=n=>'<i class="co-icon" data-lucide="'+n+'" aria-hidden="true"></i>';
const button=(text,action,primary=false,extra="")=>'<button type="button" class="co-button cursor-interaction '+(primary?'co-primary ':'')+'" data-action="'+action+'" '+extra+'>'+text+'</button>';
const primary=(text,action,extra="")=>button(text,action,true,extra).replace('class="co-button','class="co-button co-wide');
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:"checkout",direction:"Gọn rõ",scenario:s.scenario},privateContent:{theme:s.theme,phone:s.phone}}).catch(()=>{});
const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};
function chooseMethod(){s.method=s.balance>=total()?"wallet":"qr";}
function scenario(value){s.scenario=value;s.auth=value!=="guest";s.qty=value==="partial"?2:1;s.balance=["qr","expired"].includes(value)?50000:500000;s.stage="purchase";s.view="shop";s.busy=false;s.order=null;chooseMethod();render();save();}
function selection(){return '<div class="co-selection"><div class="co-mark">AI</div><div><strong>Trợ lý AI Pro</strong><div class="co-small">Gói 30 ngày · '+money(129000)+' / sản phẩm</div></div></div>';}
function quantity(){return '<label class="co-qty">Số lượng<input aria-label="Số lượng" type="number" min="1" max="20" value="'+s.qty+'" data-qty></label>';}
function summary(){return '<div class="co-total"><span>Tổng thanh toán</span><strong data-total>'+money(total())+'</strong></div>';}
function simulation(text,action){return '<div class="co-simulation"><div class="co-small">Điều khiển bản mẫu · Không giao dịch thật</div>'+button(text,action)+'</div>';}
function line(label,value){return '<div class="co-line"><span>'+label+'</span><strong>'+value+'</strong></div>';}
function purchase(){return '<h2>Xác nhận mua hàng</h2><div class="co-subtitle">Kiểm tra lựa chọn trước khi thanh toán.</div>'+selection()+quantity()+(s.auth?'<div class="co-small">Người mua: Minh Anh</div><fieldset class="co-methods"><legend>Thanh toán bằng</legend><label class="co-method"><input type="radio" name="payment" value="wallet" '+(s.method==="wallet"?'checked ':'')+(s.balance<total()?'disabled':'')+'><span><strong>Ví TiệmDigital</strong><small>Số dư '+money(s.balance)+(s.balance<total()?' · Chưa đủ thanh toán':'')+'</small></span></label><label class="co-method"><input type="radio" name="payment" value="qr" '+(s.method==="qr"?'checked':'')+'><span><strong>Chuyển khoản QR</strong><small>Thanh toán toàn bộ '+money(total())+' qua ngân hàng</small></span></label></fieldset>':'<div class="co-notice">Đăng nhập để mua hàng. Sản phẩm và số lượng được giữ lại.</div>')+summary()+(s.auth?primary(s.method==="wallet"?'Thanh toán '+money(total()):'Tiếp tục với QR · '+money(total()),"confirm"):primary("Đăng nhập để tiếp tục","login"))+'<p class="co-note">'+(s.auth?(s.method==="wallet"?'Tiền được trừ từ ví khi xác nhận thanh toán.':'Bước tiếp theo hiển thị thông tin chuyển khoản.'):'Chưa tạo đơn hoặc trừ tiền.')+'</p>';}
function auth(){return '<h2>Đăng nhập để mua</h2><div class="co-subtitle">Giữ '+s.qty+' × Trợ lý AI Pro · '+money(total())+'</div><div class="co-auth-tabs">'+["password","email","telegram"].map((v,i)=>button(["Mật khẩu","Mã email","Telegram"][i],"auth-tab",false,'data-tab="'+v+'" aria-pressed="'+(s.loginTab===v)+'"')).join("")+'</div>'+(s.loginTab==="password"?'<form data-auth-form><label class="co-field">Tên đăng nhập hoặc email<input autocomplete="off" value="minhanh_demo" aria-label="Tên đăng nhập hoặc email" required></label><label class="co-field">Mật khẩu<input type="password" autocomplete="off" value="demo-only" aria-label="Mật khẩu" required></label><button type="submit" class="co-button co-primary co-wide cursor-interaction">Đăng nhập & tiếp tục</button></form>':s.loginTab==="email"?'<label class="co-field">Email<input type="email" value="minhanh@example.com" aria-label="Email"></label>'+primary("Gửi mã đăng nhập","send-otp"):'<div class="co-notice">Kết nối tài khoản qua bot Telegram, rồi quay lại để tiếp tục đơn đang mua.</div>'+primary("Tiếp tục với Telegram","telegram"))+'<div class="co-divider">Chưa có tài khoản?</div>'+button("Tạo tài khoản","register",false,'style="width:100%"')+'<p class="co-note">Bản mẫu dùng thông tin giả lập; không nhập mật khẩu thật.</p>';}
function register(){return '<h2>Tạo tài khoản</h2><div class="co-subtitle">Sau khi đăng ký, quay lại đơn đang mua.</div><form data-auth-form><label class="co-field">Tên đăng nhập<input value="minhanh_demo" required></label><label class="co-field">Mật khẩu<input type="password" value="demo-only" required></label><label class="co-field">Email (không bắt buộc)<input type="email" placeholder="Để đăng nhập bằng mã email"></label><button type="submit" class="co-button co-primary co-wide cursor-interaction">Tạo tài khoản & tiếp tục</button></form><p class="co-note">Thông tin minh họa, không tạo tài khoản thật.</p>';}
function otp(){return '<h2>Kiểm tra email</h2><div class="co-subtitle">Mã đăng nhập gửi tới minhanh@example.com</div><form data-auth-form><label class="co-field">Mã xác thực<input inputmode="numeric" value="123456" required></label><button class="co-button co-primary co-wide cursor-interaction" type="submit">Xác nhận & tiếp tục</button></form><p class="co-note">Mã minh họa, không gửi email thật.</p>';}
function busy(){return '<h2>Đang xác nhận đơn</h2>'+selection()+'<div class="co-notice" role="status">Đang kiểm tra giá và thanh toán…</div>'+summary()+primary("Đang xử lý…","noop","disabled")+'<p class="co-note">Giữ màn hình này trong khi kiểm tra.</p>';}
function qr(){return '<h2>Quét mã để thanh toán</h2><div class="co-subtitle">Đơn '+s.order.id+' · Chờ xác nhận từ ngân hàng</div><div class="co-qr" aria-label="Vị trí mã QR minh họa, không dùng thanh toán"><div>'+icon("qr-code")+'QR minh họa<br><span class="co-small">Không dùng thanh toán</span></div></div><div class="co-center co-small">Thời gian còn lại 09:59</div><div class="co-lines">'+line("Số tiền",money(s.order.amount))+line("Ngân hàng","ACB · Minh họa")+line("Tài khoản","0000000000")+line("Chủ tài khoản","TIEMDIGITAL DEMO")+line("Nội dung",s.order.memo)+'</div>'+button(icon("copy")+" Sao chép nội dung","copy-memo",false,'style="width:100%"')+'<p class="co-note">Chuyển đúng số tiền và nội dung. Kết quả tự cập nhật khi nhận được xác nhận.</p>'+button("Xem trong Đơn hàng của tôi","history",false,'style="width:100%;margin-top:16px"')+simulation("Mô phỏng ngân hàng xác nhận","bank-paid");}
function expired(){return '<h2>Mã QR đã hết hạn</h2><div class="co-subtitle">Đơn '+s.order.id+' · Chưa xác nhận thanh toán</div>'+selection()+'<div class="co-notice co-warning">Nếu đã chuyển tiền, kiểm tra trạng thái đơn trước khi thanh toán tiếp.</div>'+primary("Kiểm tra trạng thái đơn","check-expired")+button("Xem đơn hàng","history",false,'style="width:100%;margin-top:10px"');}
function review(){return '<h2>Đang kiểm tra thanh toán</h2><div class="co-subtitle">Đơn '+s.order.id+'</div><div class="co-notice co-warning">Chưa xác định được kết quả thanh toán. Shop đang đối soát đơn này.</div><div class="co-lines">'+line("Tổng tiền",money(s.order.amount))+line("Thanh toán","Chờ đối soát")+line("Giao hàng","Chưa xác nhận")+'</div>'+primary("Kiểm tra lại trạng thái","refresh-review")+'<p class="co-note">Bạn có thể xem lại đơn. Chưa thanh toán lại khi kết quả còn đang kiểm tra.</p>'+button("Đơn hàng của tôi","history",false,'style="width:100%;margin-top:14px"')+simulation("Mô phỏng đối soát thành công","bank-paid");}
function error(){return '<h2>Chưa kết nối được</h2><div class="co-notice co-warning" role="alert">Không tải được thông tin xác nhận. Chưa tạo đơn hoặc trừ tiền.</div>'+selection()+summary()+primary("Tải lại thông tin","retry-load")+button("Quay lại lựa chọn","back-purchase",false,'style="width:100%;margin-top:10px"');}
function result(){const o=s.order,partial=o.delivery==="partial",pending=o.delivery==="waiting",handling=o.delivery==="handling";return '<span class="co-status co-success">'+icon("check")+'Đã thanh toán</span><div class="co-result-heading">'+icon(pending?"package-open":partial||handling?"clock-3":"circle-check")+'<h2>'+(pending?'Đang giao hàng':partial?'Đã giao '+o.delivered+'/'+o.qty:handling?'Shop đang xử lý':'Nhận hàng thành công')+'</h2></div><div class="co-subtitle">Đơn '+o.id+' · Trợ lý AI Pro</div><div class="co-lines">'+line("Thanh toán",money(o.amount)+' · '+(o.method==="wallet"?'Ví':'QR'))+line("Giao hàng",pending?'Đang chuẩn bị':partial?'Còn '+(o.qty-o.delivered)+' sản phẩm chờ giao':handling?'Cần shop xử lý':o.qty+'/'+o.qty+' sản phẩm')+'</div>'+(partial?'<div class="co-notice co-warning">Phần đã giao dùng được ngay. Phần còn lại tiếp tục được shop xử lý trong đơn này.</div>':handling?'<div class="co-notice co-warning">Đã nhận tiền; shop đang kiểm tra để hoàn tất giao hàng. Bạn không cần mua lại.</div>':'')+(o.delivered>0?'<h3>Dữ liệu đã nhận</h3><pre class="co-data">'+o.value+'</pre>'+primary(icon("copy")+(s.copy?' Đã sao chép':' Sao chép toàn bộ'),"copy")+'<p class="co-note">Lưu lại thông tin và đọc hướng dẫn sử dụng trong dữ liệu giao.</p>':'<p class="co-note">Thông tin nhận hàng sẽ xuất hiện tại đây và trong chi tiết đơn.</p>')+button("Đơn hàng của tôi","history",false,'style="width:100%;margin-top:18px"')+(pending?simulation("Mô phỏng kết quả giao hàng","delivered"):partial||handling?button("Kiểm tra tiến trình","refresh-delivery",false,'style="width:100%;margin-top:8px"'):'');}
function panel(){const titles={purchase:"Mua hàng",auth:"Đăng nhập",register:"Đăng ký",otp:"Mã email",telegram:"Telegram",busy:"Đang xử lý",qr:"Thanh toán",expired:"Thanh toán",result:"Kết quả đơn",review:"Trạng thái đơn",error:"Kết nối",closed:"Sản phẩm"};const body={purchase,auth,register,otp,busy,qr,expired,result,review,error,telegram:()=>'<h2>Tiếp tục trên Telegram</h2><div class="co-notice">Xác nhận với bot rồi trở lại màn hình mua hàng.</div>'+simulation("Mô phỏng đăng nhập thành công","signed-in"),closed:()=>'<h2>Trợ lý AI Pro</h2>'+selection()+'<div class="co-subtitle" style="margin-top:16px">Lựa chọn của bạn: '+s.qty+' sản phẩm.</div>'+primary("Mua ngay","back-purchase")};return '<section class="co-panel" aria-label="'+titles[s.stage]+'"><div class="co-panel-top"><span class="co-small">'+titles[s.stage]+'</span>'+button(icon(s.stage==="auth"||s.stage==="register"||s.stage==="otp"?"arrow-left":"x"),"close",false,'aria-label="Quay lại hoặc đóng khung" '+(s.busy?'disabled':''))+'</div><div aria-live="polite">'+body[s.stage]()+'</div></section>';}
function history(){return '<section class="co-history"><div class="co-history-head"><h1>Đơn hàng của tôi</h1>'+button("Tiếp tục mua sắm","shop")+'</div><p class="co-small">Các đơn gần đây · Thanh toán và giao hàng được theo dõi riêng.</p>'+(s.orders.length?s.orders.slice().reverse().map(o=>'<article class="co-order"><div><strong>'+o.id+' · Trợ lý AI Pro</strong><p>'+o.qty+' sản phẩm · '+money(o.amount)+'</p><div class="co-row"><span class="co-status">'+(o.payment==="paid"?'Đã thanh toán':o.payment==="review"?'Chờ đối soát':o.payment==="expired"?'QR hết hạn':'Chờ thanh toán')+'</span><span class="co-small">'+(o.delivered>0?'Đã giao '+o.delivered+'/'+o.qty:o.delivery==="waiting"?'Đang giao':o.delivery==="handling"?'Shop đang xử lý':'Chưa giao')+'</span></div></div>'+button("Xem chi tiết","order",false,'data-id="'+o.id+'"')+'</article>').join(""):'<div class="co-notice">Bạn chưa có đơn hàng. Chọn sản phẩm để bắt đầu.</div>')+'</section>';}
function render(){app.dataset.theme=s.theme;app.classList.toggle("co-phone",s.phone);app.innerHTML='<div class="co-demo"><label>Tình huống mẫu<select data-scenario aria-label="Tình huống mẫu">'+Object.entries(labels).map(([v,l])=>'<option value="'+v+'" '+(s.scenario===v?'selected':'')+'>'+l+'</option>').join("")+'</select></label><button class="co-link cursor-interaction" data-action="device">'+(s.phone?'Xem desktop':'Xem mobile')+'</button></div><header class="co-header"><button class="co-logo cursor-interaction" data-action="shop">Tiệm<em>Digital</em></button><div class="co-row">'+button(icon(s.theme==="light"?'moon':'sun'),"theme",false,'aria-label="Đổi chế độ sáng tối"')+button(icon("clipboard-list")+'<span class="co-account-label">Đơn hàng</span>',"history")+'</div></header><main class="co-main">'+(s.view==="history"?history():'<div class="co-workspace"><div class="co-context"><h1>Sản phẩm số</h1><article class="co-product"><div class="co-mark">AI</div><div class="co-small">Công cụ AI</div><h3>Trợ lý AI Pro</h3><p>Gói tháng cho công việc và học tập.</p><div class="co-price">'+money(129000)+'</div><p class="co-instock">Còn hàng · Gói 30 ngày</p>'+primary("Mua ngay","back-purchase")+'</article><p class="co-note">Tên/ảnh sản phẩm mở chi tiết; Mua ngay mở khung mua.</p></div>'+panel()+'</div>')+'<footer class="co-footer">TiệmDigital · Bản mẫu tương tác, dữ liệu minh họa</footer></main>';icons();}
function signedIn(){s.auth=true;s.stage=s.authBack;s.view=s.authBack==="history"?'history':'shop';if(s.stage==="history")s.stage="purchase";chooseMethod();render();}
function createOrder(){const o={id:"TD-"+String(1042+s.orders.length),qty:s.qty,amount:total(),method:s.method,payment:"pending",delivery:"none",delivered:0,value:"",memo:"TD"+String(1042+s.orders.length)};s.order=o;s.orders.push(o);return o;}
function paid(){s.order.payment="paid";s.order.delivery="waiting";s.stage="result";render();}
function fulfill(){const o=s.order;o.delivery=s.scenario==="partial"?"partial":s.scenario==="handling"?"handling":"complete";o.delivered=o.delivery==="partial"?Math.max(1,o.qty-1):o.delivery==="handling"?0:o.qty;o.value=Array.from({length:o.delivered},(_,i)=>"DEMO-KEY-"+o.id+"-"+String(i+1).padStart(2,"0")).join("\n");render();}
app.addEventListener("submit",e=>{if(e.target.matches("[data-auth-form]")){e.preventDefault();signedIn();}});
app.addEventListener("input",e=>{if(e.target.matches("[data-qty]")){s.qty=Math.max(1,Math.min(20,Math.trunc(Number(e.target.value))||1));e.target.value=s.qty;chooseMethod();const focus=e.target;const p=app.querySelector(".co-panel");p.outerHTML=panel();app.querySelector("[data-qty]").focus();icons();}});
app.addEventListener("change",e=>{if(e.target.matches("[data-scenario]"))scenario(e.target.value);if(e.target.name==="payment"){s.method=e.target.value;render();}});
app.addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b||b.disabled)return;switch(b.dataset.action){
case"theme":s.theme=s.theme==="light"?"dark":"light";render();save();break;
case"device":s.phone=!s.phone;render();save();break;
case"login":s.authBack="purchase";s.stage="auth";render();break;
case"signed-in":signedIn();break;
case"auth-tab":s.loginTab=b.dataset.tab;render();break;
case"register":s.stage="register";render();break;
case"send-otp":s.stage="otp";render();break;
case"telegram":s.stage="telegram";render();break;
case"close":if(s.stage==="auth"||s.stage==="telegram"){s.stage="purchase";}else if(s.stage==="register"||s.stage==="otp"){s.stage="auth";}else if(s.order&&["qr","result","expired","review"].includes(s.stage)){s.view="history";}else{s.stage="closed";}render();break;
case"shop":s.view="shop";s.stage="closed";render();break;
case"back-purchase":s.view="shop";s.stage="purchase";s.order=null;chooseMethod();render();break;
case"history":if(!s.auth){s.authBack="history";s.stage="auth";s.view="shop";}else{s.view="history";}render();break;
case"confirm":if(s.busy)return;if(s.scenario==="error"){s.stage="error";render();break;}s.busy=true;s.stage="busy";render();setTimeout(()=>{s.busy=false;createOrder();if(s.scenario==="review"){s.order.payment="review";s.stage="review";render();}else if(s.method==="qr"){s.stage=s.scenario==="expired"?"expired":"qr";if(s.stage==="expired")s.order.payment="expired";render();}else{s.balance-=s.order.amount;paid();}},650);break;
case"bank-paid":paid();break;
case"delivered":fulfill();break;
case"order":s.order=s.orders.find(o=>o.id===b.dataset.id);s.qty=s.order.qty;s.copy=false;s.view="shop";s.stage=s.order.payment==="paid"?"result":s.order.payment==="review"?"review":s.order.payment==="expired"?"expired":"qr";render();break;
case"retry-load":s.scenario="wallet";s.stage="purchase";chooseMethod();render();break;
case"check-expired":s.order.payment="review";s.stage="review";render();break;
case"refresh-review":case"refresh-delivery":b.textContent="Đã kiểm tra · Chưa có cập nhật";break;
case"copy":case"copy-memo":{const value=b.dataset.action==="copy"?s.order.value:s.order.memo;try{await navigator.clipboard.writeText(value);s.copy=true;b.textContent="Đã sao chép";}catch{b.textContent="Chọn dữ liệu để sao chép";}break;}
}});
render();window.addEventListener("openai:set_globals",e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(!v)return;s.theme=v.theme==="dark"?"dark":"light";s.phone=v.phone===true;render();});
})();
</script>
