<style>
#td-account{font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#142033}#td-account *{box-sizing:border-box}#td-account [hidden]{display:none!important}

#td-account .ac-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}#td-account .ac-between{justify-content:space-between}#td-account .ac-small{color:var(--ac-muted);font-size:12px}#td-account .ac-demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 22px;background:var(--ac-surface);border-bottom:1px solid var(--ac-line);border-radius:12px 12px 0 0;color:var(--ac-muted);font-size:12px}#td-account .ac-demo label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-account .ac-demo select{font-size:12px;padding:6px 8px;max-width:235px}

#td-account .ac-shell{display:grid;grid-template-columns:196px minmax(0,1fr);gap:28px;padding:26px}#td-account .ac-side{padding-top:4px}#td-account .ac-user{margin-bottom:22px}#td-account .ac-avatar{width:43px;height:43px;border-radius:50%;background:var(--ac-soft);color:var(--ac-link);font-size:16px;font-weight:650;display:grid;place-items:center;margin-bottom:12px}#td-account .ac-user strong{display:block;font-weight:650;font-size:15px}
#td-account .ac-nav{display:flex;flex-direction:column;gap:5px}#td-account .ac-nav button{justify-content:flex-start;border:0;background:transparent;padding:11px 12px;text-align:left;color:var(--ac-muted)}#td-account .ac-nav [aria-current=page]{background:var(--ac-soft);color:var(--ac-link)}#td-account .ac-side-foot{margin-top:25px;border-top:1px solid var(--ac-line);padding-top:15px}#td-account .ac-content{min-width:0}#td-account .ac-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:21px;flex-wrap:wrap}

#td-account .ac-note{font-size:12px;color:var(--ac-muted);margin-top:12px!important}#td-account .ac-notice{background:var(--ac-soft);border-radius:8px;padding:13px 15px;font-size:13px;margin:15px 0;overflow-wrap:anywhere}#td-account .ac-warning{background:var(--ac-warm);color:var(--ac-warn)}#td-account .ac-error{color:var(--ac-bad)}#td-account .ac-good{color:var(--ac-good)}
#td-account .ac-tools{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;margin:17px 0 15px}#td-account input,#td-account select{min-width:0;width:100%;padding:10px 11px;border:1px solid var(--ac-line);border-radius:8px;background:var(--ac-surface);color:var(--ac-text);font-size:14px}#td-account input::placeholder{color:var(--ac-muted)}#td-account .ac-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}#td-account .ac-table th{color:var(--ac-muted);font-size:12px;font-weight:500;text-align:left;padding:9px 9px 11px}#td-account .ac-table td{padding:15px 9px;border-top:1px solid var(--ac-line);vertical-align:top;overflow-wrap:anywhere}#td-account .ac-table th:first-child{width:48%}#td-account .ac-table th:nth-child(2){width:28%}#td-account .ac-table th:last-child{width:24%;text-align:right}#td-account .ac-table td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}#td-account .ac-mobile-transactions{display:none}#td-account .ac-empty{text-align:center;color:var(--ac-muted);padding:25px 10px;font-size:13px}
#td-account .ac-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px}#td-account .ac-topup-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:18px;align-items:start}#td-account .ac-field{display:block;font-size:13px;margin-top:16px}#td-account .ac-field input{margin-top:7px}#td-account .ac-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}#td-account .ac-grid .ac-field{margin-top:0}#td-account .ac-amounts{display:flex;gap:7px;margin:12px 0 20px;flex-wrap:wrap}#td-account .ac-amounts button{font-size:12px;padding:8px 10px}#td-account .ac-amounts [aria-pressed=true]{background:var(--ac-soft);border-color:var(--ac-link);color:var(--ac-link)}#td-account .ac-sep{border:0;border-top:1px solid var(--ac-line);margin:19px 0}#td-account .ac-line{display:flex;justify-content:space-between;gap:14px;font-size:13px;margin:12px 0}#td-account .ac-line>span{color:var(--ac-muted)}#td-account .ac-line strong{text-align:right;font-weight:600;overflow-wrap:anywhere}
#td-account .ac-badge{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:4px 9px;background:var(--ac-soft);color:var(--ac-link);font-size:12px}#td-account .ac-qr{width:158px;height:158px;display:grid;place-items:center;margin:18px auto 10px;background:var(--ac-soft);color:var(--ac-link);border:9px solid var(--ac-line);text-align:center;font-weight:600}#td-account .ac-qr .ac-icon{width:36px;height:36px;display:block;margin:0 auto 9px}#td-account .ac-center{text-align:center}#td-account .ac-sim{margin-top:20px;padding-top:13px;border-top:1px dashed var(--ac-line)}#td-account .ac-sim .ac-button{margin-top:8px;font-size:12px}
#td-account .ac-profile-form{margin-top:18px}#td-account .ac-form-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}#td-account .ac-inline-title{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}#td-account .ac-footer{padding:0 26px 23px;font-size:12px;color:var(--ac-muted)}#td-account .ac-auth{max-width:400px;margin:0 auto}#td-account .ac-tg-steps{padding-left:20px;font-size:13px;margin:16px 0;color:var(--ac-muted)}#td-account .ac-tg-steps li{padding-left:3px;margin-top:8px}#td-account .ac-pending{margin-bottom:18px}
@container account (max-width:720px){#td-account .ac-shell{display:block;padding:20px 16px}#td-account .ac-side{padding:0}#td-account .ac-user,#td-account .ac-side-foot{display:none}#td-account .ac-nav{flex-direction:row;gap:3px;margin-bottom:24px;border-bottom:1px solid var(--ac-line);padding-bottom:8px}#td-account .ac-nav button{justify-content:center;flex:1;font-size:12px;padding:9px 5px;gap:5px;white-space:nowrap}#td-account .ac-nav .ac-icon{display:none}#td-account .ac-title h1{font-size:25px}#td-account .ac-topup-grid,#td-account .ac-grid{grid-template-columns:1fr;gap:14px}#td-account .ac-paper{padding:18px;margin-bottom:15px}#td-account .ac-header{padding:18px 16px}#td-account .ac-demo{padding:10px 16px}#td-account .ac-header-label{display:none}#td-account .ac-wallet-head{align-items:flex-start;flex-direction:column;gap:17px}#td-account .ac-balance{font-size:33px}#td-account .ac-wallet-head .ac-button{width:100%}#td-account .ac-tools{grid-template-columns:1fr;gap:8px}#td-account .ac-table{display:none}#td-account .ac-mobile-transactions{display:block}#td-account .ac-transaction{padding:14px 0;border-top:1px solid var(--ac-line)}#td-account .ac-transaction strong{font-size:13px;font-weight:600}#td-account .ac-transaction p{color:var(--ac-muted);font-size:12px;margin-top:5px}#td-account .ac-transaction .ac-amount{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}#td-account .ac-footer{padding:0 16px 20px}#td-account input,#td-account select{font-size:16px}}
#td-account .ac-shell:has([data-action=signed-in]) .ac-side{display:none}#td-account .ac-shell:has([data-action=signed-in]){grid-template-columns:1fr}
@media(pointer:coarse){#td-account button{min-height:44px}}
</style>
<div id="td-account"><div id="td-ac-app" class="ac-app" data-theme="light" aria-label="Hồ sơ và ví TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById("td-ac-app"),prior=window.openai?.widgetState?.privateContent||{};
const defaults=()=>({name:"Minh Anh",username:"minhanh_demo",email:"minhanh@example.com"});
const s={theme:prior.theme==="dark"?"dark":"light",phone:prior.phone===true,scenario:"normal",tab:"wallet",screen:"home",balance:350000,amount:200000,query:"",kind:"all",intent:null,topupNumber:1,profile:defaults(),draft:defaults(),hasPassword:true,telegram:null,tgStage:"idle",notice:"",error:"",busy:false,reauth:false,resume:"",checkoutContext:false};
const scenarios={normal:"Tài khoản thông thường",emailOnly:"Chưa tạo mật khẩu",buying:"Đang có đơn muốn mua",fresh:"Cần đăng nhập lại",topupError:"Nạp tiền bị từ chối",expired:"QR nạp hết hạn",tgConflict:"Telegram đã có giao dịch",tgOff:"Bot chưa cấu hình"};
let transactions=[{id:"J-1042",label:"Thanh toán đơn TD-1042",kind:"out",delta:-129000,date:"Hôm nay, 09:14",memo:"Trợ lý AI Pro"},{id:"J-1041",label:"Nạp tiền qua QR",kind:"in",delta:200000,date:"Hôm nay, 09:10",memo:"NAP1041"},{id:"J-1030",label:"Hoàn tiền vào ví",kind:"in",delta:79000,date:"Hôm qua, 16:32",memo:"Đơn TD-1030"}];
const originalTransactions=transactions.map(t=>({...t}));
const money=n=>new Intl.NumberFormat("vi-VN").format(n)+" ₫",icon=n=>'<i class="ac-icon" data-lucide="'+n+'" aria-hidden="true"></i>';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const button=(text,action,primary=false,extra="")=>'<button type="button" class="ac-button cursor-interaction '+(primary?'ac-primary ':'')+'" data-action="'+action+'" '+extra+'>'+text+'</button>';
const primary=(text,action,extra="")=>button(text,action,true,extra).replace('class="ac-button','class="ac-button ac-wide');
const line=(label,value)=>'<div class="ac-line"><span>'+label+'</span><strong>'+value+'</strong></div>';
const sim=(text,action)=>'<div class="ac-sim"><p class="ac-small">Điều khiển bản mẫu · Không thực hiện giao dịch</p>'+button(text,action)+'</div>';
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:"account",direction:"Gọn rõ",scenario:s.scenario},privateContent:{theme:s.theme,phone:s.phone}}).catch(()=>{});
const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};
function notices(){return (s.error?'<div class="ac-notice ac-warning" role="alert">'+esc(s.error)+'</div>':'')+(s.notice?'<div class="ac-notice" role="status">'+esc(s.notice)+'</div>':'');}
function context(){return s.checkoutContext?'<div class="ac-notice"><strong>Bạn đang chọn Trợ lý AI Pro</strong><p class="ac-note">Tổng đơn dự kiến '+money(129000)+'. Nạp ví xong vẫn cần xác nhận thanh toán.</p><button class="ac-link cursor-interaction" data-action="return-order">Quay lại xác nhận mua →</button></div>':'';}
function nav(){return '<aside class="ac-side"><div class="ac-user"><div class="ac-avatar">MA</div><strong>'+esc(s.profile.name)+'</strong><span class="ac-small">@'+esc(s.profile.username)+'</span></div><nav class="ac-nav" aria-label="Tài khoản">'+[["orders","clipboard-list","Đơn hàng"],["wallet","wallet","Ví"],["security","shield-check","Hồ sơ & bảo mật"]].map(([v,i,t])=>button(icon(i)+t,"tab",false,'data-tab="'+v+'" '+(s.tab===v?'aria-current="page"':''))).join("")+'</nav><div class="ac-side-foot"><button class="ac-link cursor-interaction" data-action="logout">Đăng xuất</button></div></aside>';}
function wallet(){return '<div class="ac-title"><h1>Ví của tôi</h1>'+button(icon("refresh-cw"),"refresh",false,'aria-label="Cập nhật số dư và giao dịch"')+'</div>'+context()+notices()+'<section class="ac-paper"><div class="ac-wallet-head"><div><span class="ac-small">Số dư khả dụng</span><div class="ac-balance" data-balance>'+money(s.balance)+'</div></div>'+button(icon("plus")+" Nạp tiền","topup",true)+'</div></section>'+(s.intent&&s.intent.status==="pending"?'<div class="ac-notice ac-pending"><strong>Đang chờ nạp '+money(s.intent.amount)+'</strong><p class="ac-note">Nội dung '+s.intent.memo+'</p>'+button("Mở lại mã QR","open-intent")+'</div>':'')+'<section class="ac-paper"><div class="ac-row ac-between"><h2>Giao dịch ví</h2><span class="ac-small">100 giao dịch gần nhất</span></div><div class="ac-tools"><input type="search" data-search aria-label="Tìm giao dịch trong danh sách" placeholder="Tìm mã đơn hoặc nội dung…" value="'+esc(s.query)+'"><select data-kind aria-label="Lọc tiền vào ra"><option value="all">Tất cả giao dịch</option><option value="in">Tiền vào</option><option value="out">Tiền ra</option></select></div><div data-transactions></div></section>';}
function transactionRows(){const items=transactions.filter(t=>(s.kind==="all"||t.kind===s.kind)&&(t.label+" "+t.memo+" "+t.id).toLocaleLowerCase("vi").includes(s.query.toLocaleLowerCase("vi").trim()));const delta=t=>'<span class="'+(t.delta>0?'ac-good':'')+'">'+(t.delta>0?'+':'−')+money(Math.abs(t.delta))+'</span>';return items.length?'<table class="ac-table"><thead><tr><th>Giao dịch</th><th>Thời gian</th><th>Biến động ví</th></tr></thead><tbody>'+items.map(t=>'<tr><td><strong>'+t.label+'</strong><div class="ac-small">'+t.id+' · '+t.memo+'</div></td><td>'+t.date+'</td><td>'+delta(t)+'</td></tr>').join("")+'</tbody></table><div class="ac-mobile-transactions">'+items.map(t=>'<article class="ac-transaction"><div class="ac-row ac-between"><strong>'+t.label+'</strong><strong class="ac-amount">'+delta(t)+'</strong></div><p>'+t.date+' · '+t.id+'</p><p>'+t.memo+'</p></article>').join("")+'</div>':'<p class="ac-empty">Không có giao dịch khớp bộ lọc.</p>';}
function topup(){let content='';const i=s.intent;if(s.screen==="topup"){content='<h2>Nạp tiền vào ví</h2><p class="ac-note">Chọn số tiền, sau đó chuyển khoản theo mã QR.</p>'+notices()+'<form data-topup-form><label class="ac-field">Số tiền nạp (VNĐ)<input type="number" inputmode="numeric" min="1" step="1" value="'+s.amount+'" data-amount required></label><div class="ac-amounts">'+[100000,200000,500000].map(n=>button(money(n),"amount",false,'data-value="'+n+'" aria-pressed="'+(s.amount===n)+'"')).join("")+'</div><button class="ac-button ac-primary ac-wide cursor-interaction" type="submit" '+(s.busy?'disabled':'')+'>'+(s.busy?'Đang tạo QR…':'Tạo mã QR nạp tiền')+'</button></form><p class="ac-note">Hạn mức nạp áp dụng theo cấu hình của cửa hàng.</p>';}else if(s.screen==="qr"){content='<span class="ac-badge">'+icon("clock-3")+'Chờ thanh toán</span><h2 style="margin-top:14px">Nạp '+money(i.amount)+'</h2><div class="ac-qr" aria-label="Vị trí mã QR minh họa, không dùng thanh toán"><div>'+icon("qr-code")+'QR minh họa<br><span class="ac-small">Không dùng thanh toán</span></div></div><p class="ac-small ac-center">Thời gian còn lại 09:59</p><hr class="ac-sep">'+line("Ngân hàng","ACB · Minh họa")+line("Tài khoản","0000000000")+line("Chủ tài khoản","TIEMDIGITAL DEMO")+line("Số tiền",money(i.amount))+line("Nội dung",i.memo)+button(icon("copy")+" Sao chép nội dung","copy-memo",false,'style="width:100%;margin-top:8px"')+'<p class="ac-note">Chuyển đúng số tiền và nội dung; số dư tự cập nhật khi được xác nhận. Bạn có thể quay lại ví trong lúc chờ.</p>'+sim("Mô phỏng ngân hàng xác nhận","topup-paid");}else if(s.screen==="expired"){content='<h2>QR nạp đã hết hạn</h2><div class="ac-notice ac-warning">Chưa nhận được xác nhận nạp tiền. Nếu đã chuyển khoản, kiểm tra lại trước khi tạo QR mới.</div>'+line("Số tiền",money(i.amount))+line("Nội dung",i.memo)+notices()+primary("Kiểm tra trạng thái","check-intent")+(s.reauth?button("Tạo mã mới","renew-intent",false,'style="width:100%;margin-top:10px"'):'')+'<p class="ac-note">Cần hỗ trợ? Liên hệ cửa hàng kèm nội dung chuyển khoản.</p>';}else if(s.screen==="topup-success"){content='<span class="ac-badge ac-good">'+icon("circle-check")+'Đã nạp tiền</span><h2 style="margin-top:16px">+'+money(i.amount)+' vào ví</h2>'+line("Số dư hiện tại",money(s.balance))+'<div class="ac-notice">Tiền đã vào ví. Chưa thanh toán đơn hàng nào.</div>'+primary(s.checkoutContext?'Quay lại xác nhận mua':'Xem ví & giao dịch',s.checkoutContext?'return-order':'wallet-home');}return '<button class="ac-link ac-back cursor-interaction" data-action="wallet-home" '+(s.busy?'disabled':'')+'>'+icon("arrow-left")+'Trở về ví</button><div class="ac-topup-grid"><section class="ac-paper"><span class="ac-small">Số dư ví</span><div class="ac-balance">'+money(s.balance)+'</div><p class="ac-small">Dùng để thanh toán đơn hàng tại TiệmDigital.</p>'+context()+'</section><section class="ac-paper">'+content+'</section></div>';}
function profile(){return '<div class="ac-title"><h1>Hồ sơ & bảo mật</h1></div>'+notices()+'<section class="ac-paper"><h2>Thông tin tài khoản</h2><form data-profile-form class="ac-profile-form"><div class="ac-grid"><label class="ac-field">Tên hiển thị<input name="name" value="'+esc(s.draft.name)+'" maxlength="100" required data-draft></label><label class="ac-field">Tên đăng nhập<input name="username" value="'+esc(s.draft.username)+'" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.]+" required data-draft></label></div><label class="ac-field">Email (không bắt buộc)<input type="email" name="email" value="'+esc(s.draft.email)+'" maxlength="254" data-draft></label><p class="ac-note">Tên đăng nhập: 3–30 ký tự gồm chữ, số, dấu chấm hoặc gạch dưới.</p>'+(!s.hasPassword?'<div class="ac-notice">Bạn đang đăng nhập bằng mã email. Tạo mật khẩu trước khi xóa email đăng nhập.</div>':'')+'<div class="ac-form-actions"><button class="ac-button ac-primary cursor-interaction" type="submit" '+(s.busy?'disabled':'')+'>Lưu hồ sơ</button><span class="ac-small">Email dùng nhận mã đăng nhập</span></div></form></section><section class="ac-paper"><h2>'+(s.hasPassword?'Đổi mật khẩu':'Tạo mật khẩu')+'</h2><p class="ac-note">'+(s.hasPassword?'Dùng mật khẩu mới cho lần đăng nhập tiếp theo.':'Thêm cách đăng nhập bằng tên đăng nhập và mật khẩu.')+'</p><form data-password-form>'+ (s.hasPassword?'<label class="ac-field">Mật khẩu hiện tại<input name="currentPassword" type="password" autocomplete="off" value="demo-only" required></label>':'')+'<div class="ac-grid" style="margin-top:16px"><label class="ac-field">Mật khẩu mới<input name="newPassword" type="password" autocomplete="off" value="demo-new-password" minlength="8" maxlength="128" required></label><label class="ac-field">Nhập lại mật khẩu mới<input name="confirmation" type="password" autocomplete="off" value="demo-new-password" minlength="8" maxlength="128" required></label></div><div class="ac-form-actions"><button class="ac-button ac-primary cursor-interaction" type="submit">'+(s.hasPassword?'Đổi mật khẩu':'Tạo mật khẩu')+'</button></div></form><p class="ac-note">Thông tin giả lập. Không nhập mật khẩu thật vào bản mẫu.</p></section>'+telegram()+'<button class="ac-link cursor-interaction" data-action="logout">Đăng xuất tài khoản</button>';}
function telegram(){let body='';if(s.telegram){body='<div class="ac-notice"><span class="ac-good">Đã liên kết</span> · Telegram ID '+s.telegram+'</div><p class="ac-note">Thông báo đơn hàng được gửi theo cấu hình của cửa hàng.</p>'+button("Hủy liên kết","unlink");if(s.tgStage==="unlink")body+='<div class="ac-notice ac-warning">Ngừng gửi thông báo đơn tới Telegram này? Bạn vẫn có thể đăng nhập bằng email hoặc mật khẩu.</div>'+button("Giữ liên kết","keep-link")+' '+button("Xác nhận hủy liên kết","confirm-unlink");}else if(s.tgStage==="link"){body='<ol class="ac-tg-steps"><li>Mở bot từ liên kết vừa tạo.</li><li>Bot trả Telegram ID; nhập ID bên dưới.</li><li>Xác nhận để liên kết với tài khoản hiện tại.</li></ol>'+button(icon("external-link")+" Mở bot Telegram","open-bot",true)+'<p class="ac-note">Mã liên kết còn hiệu lực 04:59.</p><form data-link-form><label class="ac-field">Telegram ID từ bot<input name="telegramId" inputmode="numeric" pattern="[0-9]+" placeholder="Ví dụ: 123456789" required></label><div class="ac-form-actions"><button type="submit" class="ac-button ac-primary cursor-interaction">Xác nhận liên kết</button>'+button("Hủy","cancel-link")+'</div></form>'+sim("Mô phỏng bot trả ID","bot-id");}else{body='<p class="ac-note">Liên kết Telegram này với tài khoản hiện tại để nhận thông báo đơn hàng khi cửa hàng bật gửi.</p>'+button("Liên kết Telegram","link",false,'style="margin-top:16px"');}return '<section class="ac-paper"><div class="ac-inline-title"><h2>Telegram</h2><span class="ac-small">'+(s.telegram?'Đã liên kết':'Chưa liên kết')+'</span></div>'+body+'</section>';}
function auth(){return '<section class="ac-paper ac-auth"><h2>Đăng nhập lại</h2><p class="ac-note">Phiên xác thực cần được làm mới. Thông tin hồ sơ đang sửa được giữ lại.</p><label class="ac-field">Tên đăng nhập<input value="'+esc(s.profile.username)+'" readonly></label><label class="ac-field">Mật khẩu<input type="password" autocomplete="off" value="demo-only"></label>'+sim("Mô phỏng đăng nhập lại thành công","reauth")+button("Quay lại, chưa lưu","cancel-reauth",false,'style="margin-top:14px;width:100%"')+'</section>';}
function orders(){return '<div class="ac-title"><h1>Đơn hàng của tôi</h1></div><section class="ac-paper"><div class="ac-row ac-between"><h2>TD-1042 · Trợ lý AI Pro</h2><span class="ac-badge ac-good">Đã thanh toán</span></div><p class="ac-note">1 sản phẩm · '+money(129000)+' · Đã giao 1/1</p>'+button("Xem dữ liệu đã nhận","order-data",false,'style="margin-top:16px"')+(s.screen==="order-data"?'<div class="ac-notice"><code>DEMO-KEY-TD-1042-01</code></div>':'')+'</section><p class="ac-small">Bố cục lịch sử và nhận hàng theo phần mua nhanh đã duyệt.</p>';}
function returnOrder(){return '<section class="ac-paper ac-auth"><h2>Xác nhận mua hàng</h2><p class="ac-note">Trợ lý AI Pro · 1 sản phẩm</p>'+line("Tổng thanh toán",money(129000))+line("Số dư ví",money(s.balance))+'<div class="ac-notice">Đã quay lại đơn đang chọn. Bạn cần xác nhận để thanh toán.</div>'+primary("Thanh toán bằng ví · "+money(129000),"demo-pay",s.balance<129000?'disabled':'')+button("Trở về ví","wallet-home",false,'style="width:100%;margin-top:12px"')+'</section>';}
function render(){app.dataset.theme=s.theme;app.classList.toggle("ac-phone",s.phone);const signedOut=s.screen==="signed-out";app.innerHTML='<div class="ac-demo"><label>Tình huống mẫu<select data-scenario aria-label="Tình huống mẫu">'+Object.entries(scenarios).map(([v,t])=>'<option value="'+v+'" '+(s.scenario===v?'selected':'')+'>'+t+'</option>').join("")+'</select></label><button class="ac-link cursor-interaction" data-action="device">'+(s.phone?'Xem desktop':'Xem mobile')+'</button></div><header class="ac-header"><button class="ac-logo cursor-interaction" data-action="store">Tiệm<em>Digital</em></button><div class="ac-row">'+button(icon(s.theme==="light"?'moon':'sun'),"theme",false,'aria-label="Đổi chế độ sáng tối"')+button(icon("store")+'<span class="ac-header-label">Cửa hàng</span>',"store")+'</div></header><div class="ac-shell">'+nav()+'<main class="ac-content">'+(signedOut?'<section class="ac-paper"><h1>Đã đăng xuất</h1><p class="ac-note">Đăng nhập để xem ví và đơn hàng của bạn.</p>'+sim("Mô phỏng đăng nhập lại","signed-in")+'</section>':s.screen==="reauth"?auth():s.screen==="return-order"?returnOrder():s.tab==="security"?profile():s.tab==="orders"?orders():s.screen==="home"?wallet():topup())+'</main></div><footer class="ac-footer">TiệmDigital · Bản mẫu tương tác, dữ liệu minh họa</footer>';const list=app.querySelector('[data-transactions]');if(list){list.innerHTML=transactionRows();app.querySelector('[data-kind]').value=s.kind;}icons();}
function fresh(task="profile"){if(s.scenario==="fresh"&&!s.reauth){s.resume=task;s.screen="reauth";s.error="";s.notice="";render();return false;}return true;}
function resetScenario(v){s.scenario=v;s.tab=["emailOnly","fresh","tgConflict","tgOff"].includes(v)?"security":"wallet";s.screen="home";s.profile=defaults();s.draft=defaults();s.hasPassword=v!=="emailOnly";s.telegram=null;s.tgStage="idle";s.balance=v==="buying"?50000:350000;s.checkoutContext=v==="buying";s.intent=null;s.amount=200000;s.reauth=false;s.notice="";s.error="";s.busy=false;render();save();}
app.addEventListener('input',e=>{if(e.target.matches('[data-draft]'))s.draft[e.target.name]=e.target.value;if(e.target.matches('[data-amount]'))s.amount=Number(e.target.value);if(e.target.matches('[data-search]')){s.query=e.target.value;app.querySelector('[data-transactions]').innerHTML=transactionRows();}});
app.addEventListener('change',e=>{if(e.target.matches('[data-scenario]')){transactions=originalTransactions.map(t=>({...t}));s.query="";s.kind="all";resetScenario(e.target.value);}if(e.target.matches('[data-kind]')){s.kind=e.target.value;app.querySelector('[data-transactions]').innerHTML=transactionRows();}});
app.addEventListener('submit',e=>{e.preventDefault();s.notice="";s.error="";
if(e.target.matches('[data-topup-form]')){if(s.busy)return;if(s.scenario==="topupError"){s.error="Chưa tạo được QR. Số tiền không nằm trong hạn mức cửa hàng cho phép. Hãy điều chỉnh và thử lại.";render();return;}if(!Number.isSafeInteger(s.amount)||s.amount<=0){s.error="Nhập số tiền nạp hợp lệ.";render();return;}s.busy=true;render();setTimeout(()=>{s.busy=false;s.intent={id:"I-"+s.topupNumber,memo:"NAPDEMO"+s.topupNumber++,amount:s.amount,status:s.scenario==="expired"?"expired":"pending"};s.screen=s.intent.status==="expired"?"expired":"qr";render();},500);}
if(e.target.matches('[data-profile-form]')){if(!fresh())return;if(!s.hasPassword&&!s.draft.email.trim()){s.error="Hãy tạo mật khẩu trước khi xóa email đăng nhập.";render();return;}s.profile={name:s.draft.name.trim(),username:s.draft.username.trim().toLowerCase(),email:s.draft.email.trim().toLowerCase()};s.draft={...s.profile};s.notice="Đã lưu hồ sơ.";render();}
if(e.target.matches('[data-password-form]')){const data=new FormData(e.target);if(data.get('newPassword')!==data.get('confirmation')){s.error="Mật khẩu nhập lại chưa khớp.";render();return;}if(!fresh("password"))return;s.notice=s.hasPassword?"Đã đổi mật khẩu. Các phiên đăng nhập khác được đăng xuất.":"Đã tạo mật khẩu. Bạn có thể đăng nhập bằng tên đăng nhập hoặc email.";s.hasPassword=true;render();}
if(e.target.matches('[data-link-form]')){if(s.scenario==="tgConflict"){s.error="Telegram này đã liên kết hoặc có giao dịch ở tài khoản khác. Liên hệ hỗ trợ để kiểm tra.";render();return;}const id=new FormData(e.target).get('telegramId');if(!/^\d+$/.test(id)){s.error="Nhập Telegram ID nhận từ bot.";render();return;}s.telegram=id;s.tgStage="idle";s.notice="Đã liên kết Telegram.";render();}
});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){
case'theme':s.theme=s.theme==="light"?"dark":"light";render();save();break;
case'device':s.phone=!s.phone;render();save();break;
case'tab':if(s.screen==="signed-out")break;s.tab=b.dataset.tab;s.screen="home";s.notice="";s.error="";render();break;
case'refresh':s.notice="Đã cập nhật số dư và giao dịch.";render();break;
case'topup':s.tab="wallet";s.screen=s.intent?.status==="pending"?"qr":"topup";s.notice="";s.error="";render();break;
case'amount':s.amount=Number(b.dataset.value);render();break;
case'open-intent':s.screen="qr";render();break;
case'wallet-home':s.tab="wallet";s.screen="home";s.notice="";s.error="";render();break;
case'topup-paid':if(s.intent.status!=="paid"){s.balance+=s.intent.amount;s.intent.status="paid";transactions.unshift({id:"J-DEMO-"+s.intent.id,label:"Nạp tiền qua QR",kind:"in",delta:s.intent.amount,date:"Vừa xong",memo:s.intent.memo});}s.screen="topup-success";render();break;
case'check-intent':s.notice="Đã kiểm tra: QR hết hạn, chưa có xác nhận nạp tiền. Nếu đã chuyển tiền, liên hệ cửa hàng.";s.reauth=true;render();break;
case'renew-intent':s.intent=null;s.screen="topup";s.notice="";s.error="";s.scenario="normal";render();break;
case'return-order':s.screen="return-order";render();break;
case'demo-pay':s.balance-=129000;s.checkoutContext=false;s.tab="orders";s.screen="home";render();break;
case'link':if(s.scenario==="tgOff"){s.error="Bot Telegram chưa được cấu hình. Bạn vẫn có thể nhận hàng trong Đơn hàng của tôi.";}else{s.tgStage="link";s.error="";s.notice="";}render();break;
case'open-bot':s.notice="Bản mẫu không mở bot thật. Dùng nút mô phỏng ở cuối mục Telegram để nhận ID mẫu.";render();break;
case'bot-id':app.querySelector('[name=telegramId]').value="123456789";break;
case'cancel-link':s.tgStage="idle";s.notice="";s.error="";render();break;
case'unlink':s.tgStage="unlink";render();break;
case'keep-link':s.tgStage="idle";render();break;
case'confirm-unlink':s.telegram=null;s.tgStage="idle";s.notice="Đã hủy liên kết Telegram.";render();break;
case'copy-memo':try{await navigator.clipboard.writeText(s.intent.memo);b.textContent="Đã sao chép";}catch{b.textContent="Chọn nội dung phía trên để sao chép";}break;
case'reauth':s.reauth=true;s.screen="home";s.notice=s.resume==="password"?"Đã đăng nhập lại. Nhập lại mật khẩu để tiếp tục.":"Đã đăng nhập lại. Kiểm tra thông tin rồi bấm Lưu hồ sơ.";render();break;
case'cancel-reauth':s.screen="home";s.notice="Thông tin đang sửa chưa được lưu.";render();break;
case'logout':s.screen="signed-out";s.notice="";s.error="";render();break;
case'signed-in':s.screen="home";s.tab="wallet";render();break;
case'store':s.notice="Bạn có thể tiếp tục mua sản phẩm từ danh mục đã duyệt.";s.screen="home";s.tab="wallet";render();break;
case'order-data':s.screen="order-data";render();break;
}});
render();window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(!v)return;s.theme=v.theme==="dark"?"dark":"light";s.phone=v.phone===true;render();});
})();
</script>
