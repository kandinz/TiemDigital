<style>
#td-settings{font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#142033}#td-settings *{box-sizing:border-box}#td-settings .st-app{--bg:#f6f8fc;--paper:#fff;--ink:#142033;--muted:#5c697c;--line:#dfe5ef;--soft:#eaf0ff;--link:#3358cf;--brand:#3358cf;--warn:#925000;--warm:#fff3de;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;container:settings / inline-size;min-width:0;color-scheme:light}#td-settings .st-app[data-theme=dark]{--bg:#131923;--paper:#1b2432;--ink:#ecf0f8;--muted:#b1bfd1;--line:#344257;--soft:#283a5d;--link:#a6bcff;--warn:#ffd599;--warm:#3c3022;color-scheme:dark}#td-settings .st-phone{max-width:390px;margin:auto}#td-settings h1,#td-settings h2,#td-settings h3,#td-settings p{margin:0}#td-settings h1{font-size:26px}#td-settings h2{font-size:19px}#td-settings h3{font-size:14px}#td-settings button,#td-settings input,#td-settings select,#td-settings textarea{font:inherit}#td-settings button{cursor:inherit}#td-settings :focus-visible{outline:2px solid var(--link);outline-offset:3px}
#td-settings .st-button{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:40px;padding:8px 11px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600}#td-settings .st-primary{background:var(--brand);border-color:var(--brand);color:#fff}#td-settings .st-link{border:0;background:none;color:var(--link);min-height:32px;font-size:12px}#td-settings .st-icon{width:16px;height:16px;flex-shrink:0}#td-settings .st-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-settings .st-between{justify-content:space-between}#td-settings .st-small{font-size:12px;color:var(--muted)}
#td-settings .st-demo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;color:var(--muted);font-size:12px}#td-settings .st-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:650px}#td-settings .st-side{padding:20px 12px;background:var(--paper);border-right:1px solid var(--line)}#td-settings .st-logo{padding:0 9px 20px;font-size:19px;font-weight:700}#td-settings .st-logo em{font-style:normal;color:var(--link)}#td-settings .st-side .st-button{display:flex;justify-content:flex-start;width:100%;border:0;background:transparent;color:var(--muted);margin:4px 0}#td-settings .st-side .st-current{background:var(--soft);color:var(--link)}#td-settings .st-main{min-width:0}#td-settings .st-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#td-settings .st-content{padding:22px;min-width:0}#td-settings .st-title{margin-bottom:19px}#td-settings .st-title p{margin-top:5px}#td-settings .st-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}#td-settings .st-tabs [aria-current=page]{background:var(--soft);border-color:var(--link);color:var(--link)}#td-settings .st-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:14px;min-width:0}#td-settings input:not([type=checkbox]),#td-settings select,#td-settings textarea{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px}#td-settings input[type=checkbox]{accent-color:var(--brand);width:17px;height:17px}#td-settings .st-item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}#td-settings .st-item p{margin-top:4px}#td-settings .st-notice{padding:12px 13px;background:var(--soft);border-radius:8px;font-size:12px;margin:15px 0}#td-settings .st-warning{background:var(--warm);color:var(--warn)}#td-settings .st-field{display:block;font-size:13px;margin:14px 0}#td-settings .st-field input,#td-settings .st-field textarea{margin-top:7px}#td-settings .st-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:14px 0}#td-settings .st-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}#td-settings .st-line span{color:var(--muted)}#td-settings .st-line strong{text-align:right;overflow-wrap:anywhere}
#td-settings .st-wrap{position:relative}#td-settings .st-wrap:has(.st-drawer){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px)}#td-settings .st-wrap:has(.st-drawer) .st-layout{grid-template-columns:1fr}#td-settings .st-wrap:has(.st-drawer) .st-side{display:none}#td-settings .st-drawer{background:var(--paper);border-left:1px solid var(--line);border-radius:0 12px 12px 0;padding:22px;min-width:0}#td-settings .st-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}#td-settings .st-footer{padding:0 22px 20px;font-size:12px;color:var(--muted)}#td-settings .st-bottom{display:none}
@container settings (max-width:720px){#td-settings .st-layout{display:block;min-height:0}#td-settings .st-side{display:none}#td-settings .st-content{padding:19px 15px}#td-settings .st-top{padding:16px}#td-settings .st-wrap:has(.st-drawer){display:block}#td-settings .st-wrap:has(.st-drawer) .st-layout{display:none}#td-settings .st-drawer{border:0;border-radius:12px;padding:18px}#td-settings input:not([type=checkbox]),#td-settings select,#td-settings textarea{font-size:16px}#td-settings .st-bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:5px 4px;border-radius:0 0 12px 12px}#td-settings .st-bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:3px 0;border:0;background:none;color:var(--muted);font-size:10px}#td-settings .st-bottom .st-current{color:var(--link)}#td-settings .st-footer{padding:0 15px 16px}}
@media(pointer:coarse){#td-settings button{min-height:44px}}
</style>
<div id="td-settings"><div id="td-st-app" class="st-app" data-theme="light" aria-label="Nhà cung cấp và cài đặt TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById('td-st-app'),prior=window.openai?.widgetState?.privateContent||{};
const s={theme:prior.theme==='dark'?'dark':'light',phone:prior.phone===true,section:'providers',tab:'Thanh toán',query:'',panel:'',id:null,message:'',conflict:false};
const providers=[{id:'a',name:'NCC A',status:'Đang bật',balance:'35,00 USD',time:'09:20 · 01/11/2026',api:'••••••••A17',bot:'@ncc_a_demo'},{id:'b',name:'NCC B',status:'Đang bật',balance:'Chưa tải được',time:'Lỗi cập nhật',api:'••••••••B29',bot:'Chưa cấu hình'}];
const pages=[{id:'bao-hanh',title:'Chính sách bảo hành',status:'Đã xuất bản',version:'Bản 3'},{id:'lien-he',title:'Liên hệ',status:'Bản nháp',version:'Bản 2'}],logs=[{id:'log1',action:'Cập nhật sản phẩm',actor:'Owner',time:'Hôm nay · 09:15'},{id:'log2',action:'Thay đổi cấu hình',actor:'Owner',time:'Hôm qua · 18:10'}];
const icon=n=>'<i class="st-icon" data-lucide="'+n+'" aria-hidden="true"></i>',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,attrs='',primary=false)=>'<button type="button" class="st-button cursor-interaction '+(primary?'st-primary':'')+'" data-action="'+action+'" '+attrs+'>'+label+'</button>',line=(label,value)=>'<div class="st-line"><span>'+label+'</span><strong>'+value+'</strong></div>';
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:'admin-settings',direction:'Gọn rõ'},privateContent:{theme:s.theme,phone:s.phone}}).catch(()=>{}),nav=[['house','Hôm nay'],['package','Sản phẩm'],['truck','NCC'],['clipboard-list','Đơn hàng'],['chart-no-axes-combined','Tài chính']];
function providersPage(){const rows=providers.filter(p=>p.name.toLowerCase().includes(s.query.toLowerCase()));return '<div class="st-title"><h1>Nhà cung cấp</h1><p class="st-small">Kết nối API và số dư</p></div><section class="st-panel"><div class="st-row st-between"><h2>Danh sách nhà cung cấp</h2>'+btn('Thêm nhà cung cấp','new-provider','',true)+'</div><label class="st-field">Tìm nhà cung cấp<input type="search" data-search value="'+esc(s.query)+'" placeholder="Tên nhà cung cấp"></label>'+rows.map(p=>'<article class="st-item"><div><strong>'+p.name+'</strong><p class="st-small">'+p.status+' · '+p.time+'</p></div><div><strong>'+p.balance+'</strong><p class="st-small">'+p.api+'</p></div>'+btn('Chi tiết','provider','data-id="'+p.id+'"')+'</article>').join('')+(rows.length?'':'<div class="st-notice">Không tìm thấy nhà cung cấp.</div>')+'</section><section class="st-panel"><h2>Tỷ giá và danh mục</h2><p class="st-small" style="margin:8px 0 14px">Tỷ giá USD và từ khóa danh mục theo cấu hình.</p>'+btn('Cấu hình','rate')+'</section>';}
function payment(){return '<section class="st-panel"><div class="st-row st-between"><h2>Thanh toán chuyển khoản</h2><span class="st-small">Đã cấu hình · Minh họa</span></div>'+line('Ngân hàng','ACB · Minh họa')+line('Tài khoản','••••••1234')+line('Hạn mức nạp','Theo cấu hình')+line('Hạn mã QR','10 phút')+(s.conflict?'<div class="st-notice st-warning">Cấu hình đã thay đổi ở nơi khác. Tải lại trước khi lưu.</div>':'')+btn('Chỉnh cấu hình','payment-edit')+' '+btn('Mô phỏng xung đột phiên bản','conflict')+'</section><p class="st-small">Giao dịch ngân hàng và đối soát nằm trong Tài chính.</p>';}
function telegram(){return '<section class="st-panel"><h2>Thông báo Telegram</h2><label class="st-field">Chat ID của admin<input value="123456789" aria-label="Chat ID admin"></label><label class="st-check"><input type="checkbox" checked> Cảnh báo cần xử lý gửi tới admin</label><h3>Thông báo đơn hàng cho khách</h3><p class="st-small">Gửi tới Telegram đã liên kết của khách khi bật cấu hình.</p><label class="st-check"><input type="checkbox" checked> Đã thanh toán</label><label class="st-check"><input type="checkbox" checked> Đã giao</label><label class="st-check"><input type="checkbox" checked> Giao một phần</label><div class="st-row">'+btn('Lưu cài đặt','feedback','',true)+btn('Gửi thử','feedback')+'</div><p class="st-small" style="margin-top:10px">Bản mẫu không gửi tin thật.</p></section><section class="st-panel"><div class="st-row st-between"><div><h2>Webhook & hàng đợi</h2><p class="st-small">1 thông báo lỗi cần kiểm tra</p></div>'+btn('Xem lỗi','outbox')+'</div></section>';}
function content(){return '<section class="st-panel"><div class="st-row st-between"><h2>Nội dung trang</h2>'+btn('Tạo trang','new-page','',true)+'</div><p class="st-small" style="margin:8px 0">Quản lý bản nháp và bản đã xuất bản</p>'+pages.map(p=>'<article class="st-item"><div><strong>'+p.title+'</strong><p class="st-small">'+p.version+' · '+p.status+'</p></div>'+btn('Chỉnh sửa','page','data-id="'+p.id+'"')+'</article>').join('')+'</section>';}
function audit(){const rows=logs.filter(x=>x.action.toLowerCase().includes(s.query.toLowerCase()));return '<section class="st-panel"><div class="st-row st-between"><h2>Nhật ký quản trị</h2>'+btn('Xuất dữ liệu đã tải','feedback')+'</div><label class="st-field">Tìm hoạt động<input type="search" data-search value="'+esc(s.query)+'"></label><p class="st-small">Tối đa 100 sự kiện gần nhất</p>'+rows.map(x=>'<article class="st-item"><div><strong>'+x.action+'</strong><p class="st-small">'+x.actor+' · '+x.time+'</p></div>'+btn('Xem','audit-item','data-id="'+x.id+'"')+'</article>').join('')+'</section>';}
function settingsPage(){return '<div class="st-title"><h1>Cài đặt</h1><p class="st-small">Thiết lập và theo dõi hệ thống</p></div><nav class="st-tabs" aria-label="Mục cài đặt">'+['Thanh toán','Telegram','Nội dung trang','Nhật ký'].map(x=>btn(x,'tab','data-tab="'+x+'" '+(s.tab===x?'aria-current="page"':''))).join('')+'</nav>'+(s.tab==='Thanh toán'?payment():s.tab==='Telegram'?telegram():s.tab==='Nội dung trang'?content():audit());}
function panel(){if(!s.panel)return '';let title='',body='';if(s.panel==='provider'||s.panel==='new-provider'){const p=providers.find(x=>x.id===s.id)||{name:'',api:'Chưa có',bot:'',balance:'Chưa tải',time:''};title=s.panel==='provider'?p.name:'Thêm nhà cung cấp';body='<label class="st-field">Tên nhà cung cấp<input value="'+esc(p.name)+'"></label><label class="st-field">Địa chỉ API<input value="https://example.test"></label><label class="st-field">API key<input type="password" value="demo-only" autocomplete="off"></label><p class="st-small">Key đang lưu: '+p.api+' · Không nhập key thật vào bản mẫu.</p><label class="st-field">Bot Telegram<input value="'+esc(p.bot)+'"></label>'+line('Số dư gần nhất',p.balance)+line('Thời điểm',p.time||'Chưa có')+'<label class="st-check"><input type="checkbox" checked> Bật nhà cung cấp</label><div class="st-row">'+btn('Lưu','simulate','',true)+btn('Cập nhật số dư','simulate')+'</div>';}else if(s.panel==='rate'){title='Tỷ giá và danh mục';body='<label class="st-field">Tỷ giá USD/VNĐ<input type="number" value="25000"></label><label class="st-field">Từ khóa danh mục<input value="AI, công cụ, thiết kế"></label>'+btn('Lưu cấu hình','simulate','',true);}else if(s.panel==='payment-edit'){title='Cấu hình thanh toán';body='<label class="st-field">Ngân hàng<input value="ACB"></label><label class="st-field">Số tài khoản<input value="0000001234"></label><label class="st-field">Chủ tài khoản<input value="TIEM DIGITAL DEMO"></label><label class="st-field">Nạp tối thiểu<input type="number" value="10000"></label><label class="st-field">Nạp tối đa<input type="number" value="10000000"></label><label class="st-field">Thời hạn QR (giây)<input type="number" value="600"></label><p class="st-small">Số và ngân hàng chỉ minh họa.</p>'+btn('Lưu cấu hình','simulate','',true);}else if(s.panel==='outbox'){title='Thông báo lỗi';body='<div class="st-notice st-warning">ORDER_PARTIAL · Gửi thông báo khách chưa thành công.</div><p class="st-small">Thử gửi lại thông báo, không mua hàng hoặc giao hàng lại.</p>'+btn('Thử gửi lại','simulate','style="margin-top:14px"');}else if(s.panel==='page'||s.panel==='new-page'){const p=pages.find(x=>x.id===s.id)||{title:''};title='Nội dung trang';body='<label class="st-field">Tiêu đề<input value="'+esc(p.title)+'"></label><label class="st-field">Đường dẫn<input value="'+esc(s.id||'trang-moi')+'"></label><label class="st-field">Nội dung<textarea rows="5">Nội dung minh họa…</textarea></label><p class="st-small">Khối văn bản, liên kết hoặc ảnh PNG/JPEG/WebP tối đa 2 MB.</p><div class="st-row" style="margin-top:16px">'+btn('Lưu bản nháp','simulate','',true)+btn('Xuất bản','simulate')+'</div>'+btn('Xem phiên bản','versions','style="margin-top:10px"');}else if(s.panel==='versions'){title='Các phiên bản';body='<div class="st-item"><strong>Bản 3 · Đã xuất bản</strong></div><div class="st-item"><strong>Bản 2 · Bản trước</strong></div>'+btn('Quay lại','back-page');}else if(s.panel==='audit-item'){const l=logs.find(x=>x.id===s.id);title='Chi tiết nhật ký';body=line('Hoạt động',l.action)+line('Người thực hiện',l.actor)+line('Thời gian',l.time);}else if(s.panel==='feedback'){title='Thao tác mô phỏng';body='<p class="st-small">Không thực hiện thay đổi hoặc gửi tin thật.</p>';}return '<section class="st-drawer" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="st-head"><h2>'+esc(title)+'</h2>'+btn(icon('x'),'close','aria-label="Đóng"')+'</div>'+body+(s.message?'<div class="st-notice" role="status">'+esc(s.message)+'</div>':'')+'</section>';}
function render(){app.dataset.theme=s.theme;app.classList.toggle('st-phone',s.phone);app.innerHTML='<div class="st-demo"><span>NCC & cài đặt · Minh họa</span><div class="st-row">'+btn(icon(s.theme==='light'?'moon':'sun'),'theme','aria-label="Đổi sáng tối"')+'<button class="st-link cursor-interaction" data-action="device">'+(s.phone?'Xem desktop':'Xem mobile')+'</button></div></div><div class="st-wrap"><div class="st-layout"><aside class="st-side"><div class="st-logo">Tiệm<em>Digital</em> <span class="st-small">Admin</span></div>'+nav.map(([i,t])=>'<button class="st-button '+(s.section==='providers'&&t==='NCC'?'st-current':'')+'" '+(t==='NCC'?'data-action="providers"':'')+'>'+icon(i)+t+'</button>').join('')+'<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">'+btn(icon('settings')+' Cài đặt','settings')+'</aside><main class="st-main"><header class="st-top"><strong>'+(s.section==='providers'?'Nhà cung cấp':'Cài đặt')+'</strong><div class="st-row">'+btn('NCC','providers')+btn(icon('settings'),'settings','aria-label="Cài đặt"')+'</div></header><div class="st-content">'+(s.section==='providers'?providersPage():settingsPage())+'</div><footer class="st-footer">TiệmDigital · Bản mẫu, dữ liệu minh họa</footer></main></div>'+panel()+'</div><nav class="st-bottom" aria-label="Điều hướng admin">'+nav.map(([i,t])=>'<button class="'+(s.section==='providers'&&t==='NCC'?'st-current':'')+'" '+(t==='NCC'?'data-action="providers"':'')+'>'+icon(i)+'<span>'+t+'</span></button>').join('')+'</nav>';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
app.addEventListener('input',e=>{if(e.target.matches('[data-search]')){s.query=e.target.value;const pos=e.target.selectionStart;render();const n=app.querySelector('[data-search]');n.focus();n.setSelectionRange(pos,pos);}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;s.message='';switch(b.dataset.action){case'theme':s.theme=s.theme==='light'?'dark':'light';save();break;case'device':s.phone=!s.phone;save();break;case'providers':s.section='providers';s.panel='';s.query='';break;case'settings':s.section='settings';s.panel='';s.query='';break;case'tab':s.tab=b.dataset.tab;s.query='';s.panel='';break;case'provider':s.panel='provider';s.id=b.dataset.id;break;case'new-provider':s.panel='new-provider';s.id=null;break;case'rate':s.panel='rate';break;case'payment-edit':s.panel='payment-edit';break;case'conflict':s.conflict=true;break;case'outbox':s.panel='outbox';break;case'page':s.panel='page';s.id=b.dataset.id;break;case'new-page':s.panel='new-page';s.id=null;break;case'versions':s.panel='versions';break;case'back-page':s.panel='page';break;case'audit-item':s.panel='audit-item';s.id=b.dataset.id;break;case'close':s.panel='';break;case'simulate':s.message='Đã mô phỏng thao tác, không thay đổi dữ liệu hay gửi tin thật.';break;case'feedback':s.panel='feedback';break;}render();});
render();window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!p)return;s.theme=p.theme==='dark'?'dark':'light';s.phone=p.phone===true;render();});
})();
</script>
