<style>
#td-admin {font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#142033}#td-admin *{box-sizing:border-box}#td-admin [hidden]{display:none!important}
#td-admin .ad-app{--bg:#f6f8fc;--paper:#fff;--ink:#142033;--muted:#5c697c;--line:#dfe5ef;--soft:#eaf0ff;--link:#3358cf;--brand:#3358cf;--good:#236448;--warn:#925000;--warm:#fff3de;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;container:admin / inline-size;min-width:0;color-scheme:light}
#td-admin .ad-app[data-theme=dark]{--bg:#131923;--paper:#1b2432;--ink:#ecf0f8;--muted:#b1bfd1;--line:#344257;--soft:#283a5d;--link:#a6bcff;--good:#9bd6b4;--warn:#ffd599;--warm:#3c3022;color-scheme:dark}#td-admin .ad-phone{max-width:390px;margin:auto}
#td-admin h1,#td-admin h2,#td-admin h3,#td-admin p{margin:0}#td-admin h1{font-size:26px;line-height:1.2;letter-spacing:-.6px}#td-admin h2{font-size:17px;font-weight:650}#td-admin h3{font-size:14px;font-weight:650}#td-admin button,#td-admin select{font:inherit}#td-admin button{cursor:inherit}#td-admin button:focus-visible,#td-admin select:focus-visible{outline:2px solid var(--link);outline-offset:3px}
#td-admin .ad-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 12px;min-height:40px;font-size:13px;font-weight:600}#td-admin .ad-icon{width:16px;height:16px;flex-shrink:0}#td-admin .ad-link{border:0;padding:4px 0;background:none;color:var(--link);font-size:12px;min-height:32px}#td-admin .ad-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-admin .ad-between{justify-content:space-between}#td-admin .ad-small{font-size:12px;color:var(--muted)}
#td-admin .ad-demo{background:var(--paper);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;padding:10px 19px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}#td-admin .ad-demo label{display:flex;align-items:center;gap:8px}#td-admin .ad-demo select{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px}
#td-admin .ad-layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:680px}#td-admin .ad-sidebar{background:var(--paper);border-right:1px solid var(--line);padding:22px 14px}#td-admin .ad-logo{font-size:20px;letter-spacing:-.6px;font-weight:700;padding:0 10px 23px}#td-admin .ad-logo em{color:var(--link);font-style:normal}#td-admin .ad-nav{display:grid;gap:4px}#td-admin .ad-nav button{border:0;justify-content:flex-start;text-align:left;background:transparent;color:var(--muted);width:100%;padding:10px 12px}#td-admin .ad-nav [aria-current=page]{background:var(--soft);color:var(--link)}#td-admin .ad-badge{margin-left:auto;font-size:11px;border-radius:30px;padding:2px 7px;background:var(--warm);color:var(--warn)}#td-admin .ad-sidebar-foot{margin-top:24px;padding:15px 10px;border-top:1px solid var(--line)}
#td-admin .ad-main{min-width:0}#td-admin .ad-top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border-bottom:1px solid var(--line);padding:18px 25px}#td-admin .ad-top strong{font-size:13px}#td-admin .ad-content{padding:25px;min-width:0}#td-admin .ad-title{display:flex;align-items:start;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}#td-admin .ad-title p{margin-top:6px}
#td-admin .ad-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}#td-admin .ad-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:19px;min-width:0}#td-admin .ad-kpi{font-size:21px;font-weight:700;margin:10px 0 5px;color:var(--muted)}#td-admin .ad-kpi-ready{color:var(--ink);font-variant-numeric:tabular-nums}#td-admin .ad-note{font-size:12px;color:var(--muted)}#td-admin .ad-message{margin-top:14px;background:var(--warm);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:12px}
#td-admin .ad-sections{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}#td-admin .ad-card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}#td-admin .ad-task{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}#td-admin .ad-task p{margin-top:5px}#td-admin .ad-tag{display:inline-flex;padding:4px 8px;border-radius:20px;color:var(--warn);background:var(--warm);font-size:11px}#td-admin .ad-provider{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}#td-admin .ad-provider strong{font-variant-numeric:tabular-nums;font-size:13px}#td-admin .ad-provider p{margin-top:4px}
#td-admin .ad-subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}#td-admin .ad-subnav button[aria-current=page]{color:var(--link);background:var(--soft);border-color:var(--link)}#td-admin .ad-placeholder{padding:26px;text-align:center}#td-admin .ad-placeholder p{max-width:480px;margin:10px auto 0;color:var(--muted)}#td-admin .ad-drawer{margin-top:14px;border-left:3px solid var(--link)}#td-admin .ad-footer{padding:0 25px 22px;color:var(--muted);font-size:12px}#td-admin .ad-bottom{display:none}
@container admin (max-width:720px){#td-admin .ad-layout{display:block;min-height:0}#td-admin .ad-sidebar{display:none}#td-admin .ad-top{padding:16px}#td-admin .ad-content{padding:20px 16px 26px}#td-admin .ad-title h1{font-size:24px}#td-admin .ad-metrics{grid-template-columns:1fr;gap:10px}#td-admin .ad-sections{grid-template-columns:1fr;gap:12px}#td-admin .ad-card{padding:16px}#td-admin .ad-kpi{font-size:20px}#td-admin .ad-footer{padding:0 16px 15px}#td-admin .ad-bottom{position:sticky;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--paper);border-top:1px solid var(--line);padding:5px 4px;border-radius:0 0 12px 12px}#td-admin .ad-bottom button{min-width:0;min-height:54px;padding:5px 2px;border:0;background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;gap:3px;justify-content:center;align-items:center;position:relative}#td-admin .ad-bottom button[aria-current=page]{color:var(--link);font-weight:700}#td-admin .ad-bottom .ad-badge{position:absolute;top:2px;left:60%;padding:1px 5px;font-size:10px}#td-admin .ad-demo{padding:9px 16px}#td-admin .ad-task .ad-button{padding:8px;font-size:12px}}
@media(pointer:coarse){#td-admin button{min-height:44px}}
</style>
<div id="td-admin"><div class="ad-app" id="td-ad-app" data-theme="light" aria-label="Bản mẫu quản trị TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById('td-ad-app'),saved=window.openai?.widgetState?.privateContent||{};
const state={theme:saved.theme==='dark'?'dark':'light',phone:saved.phone===true,section:'today',sub:'',scenario:'normal',detail:''};
const nav=[['today','house','Hôm nay'],['products','package','Sản phẩm'],['providers','truck','NCC'],['orders','clipboard-list','Đơn hàng'],['finance','chart-no-axes-combined','Tài chính']];
const menus={products:['Danh mục bán','Hàng từ NCC','Kho'],providers:['Nhà cung cấp','Kết nối & số dư'],orders:['Đơn bán','Đơn nhập NCC','Bảo hành','Khách hàng'],finance:['Báo cáo','Thu chi','Ví & sổ cái','Ngân hàng & đối soát'],settings:['Thanh toán','Telegram','Nội dung trang','Nhật ký']};
const icons=n=>'<i class="ad-icon" data-lucide="'+n+'" aria-hidden="true"></i>';
const btn=(label,action,attrs='')=>'<button type="button" class="ad-button cursor-interaction" data-action="'+action+'" '+attrs+'>'+label+'</button>';
const list=()=>nav.map(([id,icon,label])=>btn(icons(icon)+'<span>'+label+'</span>'+(id==='orders'?'<span class="ad-badge">2</span>':''),'nav','data-section="'+id+'" '+(state.section===id?'aria-current="page"':''))).join('');
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:'admin-today',direction:'Gọn rõ'},privateContent:{theme:state.theme,phone:state.phone}}).catch(()=>{});
function home(){const warn=state.scenario==='loading'?'Đang tải dữ liệu…':state.scenario==='error'?'Không tải được số liệu':'Chưa đủ dữ liệu';return '<div class="ad-title"><div><h1>Hôm nay</h1><p class="ad-small">31 tháng 10, 2026 · Giờ Việt Nam</p></div>'+btn(icons('refresh-cw')+' Cập nhật','refresh')+'</div><section class="ad-metrics" aria-label="Doanh thu và lợi nhuận"><article class="ad-card"><span class="ad-small">Doanh thu hôm nay</span><div class="ad-kpi">'+warn+'</div><p class="ad-note">Cần xác định thời điểm thanh toán của các đơn.</p>'+btn('Xem báo cáo','goto','data-section="finance" data-sub="Báo cáo"')+'</article><article class="ad-card"><span class="ad-small">Lợi nhuận hôm nay</span><div class="ad-kpi">'+warn+'</div><p class="ad-note">Cần đối chiếu chi phí mua và khoản thu trong ngày.</p>'+btn('Xem đối soát','goto','data-section="finance" data-sub="Thu chi"')+'</article></section><div class="ad-sections"><section class="ad-card"><div class="ad-card-head"><div><h2>Việc cần xử lý</h2><p class="ad-small">Bao gồm việc còn tồn từ trước</p></div><span class="ad-tag">2 việc</span></div><div class="ad-task"><div><strong>Đơn TD-1042 · Giao một phần</strong><p class="ad-small">Còn 1 sản phẩm cần giao · Từ hôm qua</p></div>'+btn('Xem đơn','task','data-id="TD-1042"')+'</div><div class="ad-task"><div><strong>Đơn TD-1038 · Chờ đối soát</strong><p class="ad-small">Cần kiểm tra kết quả thanh toán</p></div>'+btn('Xem đơn','task','data-id="TD-1038"')+'</div></section><section class="ad-card"><div class="ad-card-head"><div><h2>Số dư nhà cung cấp</h2><p class="ad-small">Số liệu lưu gần nhất</p></div>'+btn('Xem tất cả','goto','data-section="providers" data-sub="Kết nối & số dư"')+'</div><div class="ad-provider"><div><strong>NCC Minh họa A</strong><p class="ad-small">Cập nhật lúc 09:20</p></div><strong>35,00 USD</strong></div><div class="ad-provider"><div><strong>NCC Minh họa B</strong><p class="ad-small">Chưa tải được số dư</p></div><span class="ad-tag">Cần kiểm tra</span></div></section></div>';}
function section(){const title={products:'Sản phẩm',providers:'Nhà cung cấp',orders:'Đơn hàng',finance:'Tài chính',settings:'Cài đặt'}[state.section],items=menus[state.section]||[];return '<div class="ad-title"><div><h1>'+title+'</h1><p class="ad-small">'+(state.sub||items[0])+'</p></div></div><nav class="ad-subnav" aria-label="Mục '+title+'">'+items.map(x=>btn(x,'sub','data-sub="'+x+'" '+((state.sub||items[0])===x?'aria-current="page"':''))).join('')+'</nav><section class="ad-card ad-placeholder"><h2>'+(state.sub||items[0])+'</h2><p>'+(state.section==='products'&&state.sub==='Hàng từ NCC'?'Tìm và lọc hàng từ tất cả nhà cung cấp, mua dùng hoặc mua nhập kho ngay tại đây.':state.section==='finance'?'Chỉ hiển thị số tiền khi đã xác minh đầy đủ nguồn và kỳ báo cáo.':state.section==='orders'?'Xem danh sách, trạng thái và thao tác phù hợp của từng đơn.':'Chi tiết màn này được đặc tả trong phần thiết kế tương ứng.')+'</p></section>'+(state.detail?'<section class="ad-card ad-drawer"><div class="ad-row ad-between"><h2>'+state.detail+'</h2>'+btn('Đóng','close-detail')+'</div><p class="ad-small">'+(state.detail==='TD-1042'?'Đã thanh toán · Đã giao một phần · Cần xử lý phần còn lại.':'Đang chờ đối soát thanh toán.')+'</p><div class="ad-message">Mở đúng chi tiết đơn để kiểm tra và xử lý theo trạng thái thực tế.</div></section>':'');}
function render(){app.dataset.theme=state.theme;app.classList.toggle('ad-phone',state.phone);const title=(nav.find(x=>x[0]===state.section)||['','','Cài đặt'])[2];app.innerHTML='<div class="ad-demo"><label>Tình huống mẫu <select data-scenario><option value="normal">Chưa đủ số liệu</option><option value="loading">Đang tải</option><option value="error">Lỗi tải</option></select></label><button class="ad-link cursor-interaction" data-action="device">'+(state.phone?'Xem desktop':'Xem mobile')+'</button></div><div class="ad-layout"><aside class="ad-sidebar"><div class="ad-logo">Tiệm<em>Digital</em> <span class="ad-small">Admin</span></div><nav class="ad-nav" aria-label="Điều hướng quản trị">'+list()+'</nav><div class="ad-sidebar-foot">'+btn(icons('settings')+' Cài đặt','nav','data-section="settings"')+'</div></aside><div class="ad-main"><header class="ad-top"><strong>'+title+'</strong><div class="ad-row">'+btn(icons(state.theme==='light'?'moon':'sun'),'theme','aria-label="Đổi sáng tối"')+btn(icons('settings'),'nav','data-section="settings" aria-label="Cài đặt"')+'</div></header><main class="ad-content">'+(state.section==='today'?home():section())+'</main><footer class="ad-footer">TiệmDigital · Bản mẫu, dữ liệu minh họa</footer></div></div><nav class="ad-bottom" aria-label="Điều hướng quản trị trên điện thoại">'+list()+'</nav>';app.querySelector('[data-scenario]').value=state.scenario;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
app.addEventListener('change',e=>{if(e.target.matches('[data-scenario]')){state.scenario=e.target.value;render();}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'nav':state.section=b.dataset.section;state.sub='';state.detail='';break;case'goto':state.section=b.dataset.section;state.sub=b.dataset.sub;state.detail='';break;case'sub':state.sub=b.dataset.sub;state.detail='';break;case'task':state.section='orders';state.sub='Đơn bán';state.detail=b.dataset.id;break;case'close-detail':state.detail='';break;case'theme':state.theme=state.theme==='light'?'dark':'light';save();break;case'device':state.phone=!state.phone;save();break;case'refresh':state.scenario='normal';break;}render();});
render();window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(!v)return;state.theme=v.theme==='dark'?'dark':'light';state.phone=v.phone===true;render();});
})();
</script>
