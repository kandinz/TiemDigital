<style>
#td-orders{font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#142033}#td-orders *{box-sizing:border-box}#td-orders [hidden]{display:none!important}#td-orders .or-app{--bg:#f6f8fc;--paper:#fff;--ink:#142033;--muted:#5c697c;--line:#dfe5ef;--soft:#eaf0ff;--brand:#3358cf;--link:#3358cf;--good:#236448;--warn:#925000;--warm:#fff3de;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;container:order / inline-size;min-width:0;color-scheme:light}#td-orders .or-app[data-theme=dark]{--bg:#131923;--paper:#1b2432;--ink:#ecf0f8;--muted:#b1bfd1;--line:#344257;--soft:#283a5d;--link:#a6bcff;--good:#9bd6b4;--warn:#ffd599;--warm:#3c3022;color-scheme:dark}#td-orders .or-phone{max-width:390px;margin:auto}#td-orders h1,#td-orders h2,#td-orders h3,#td-orders p{margin:0}#td-orders h1{font-size:26px;line-height:1.2}#td-orders h2{font-size:20px}#td-orders h3{font-size:14px}#td-orders button,#td-orders input,#td-orders select,#td-orders textarea{font:inherit}#td-orders button{cursor:inherit}#td-orders button:focus-visible,#td-orders input:focus-visible,#td-orders select:focus-visible,#td-orders textarea:focus-visible{outline:2px solid var(--link);outline-offset:3px}
#td-orders .or-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--paper);font-size:12px;font-weight:600}#td-orders .or-button:disabled{opacity:.5}#td-orders .or-primary{background:var(--brand);border-color:var(--brand);color:#fff}#td-orders .or-link{border:0;background:none;color:var(--link);padding:4px 0;font-size:12px;min-height:32px}#td-orders .or-icon{width:16px;height:16px;flex-shrink:0}#td-orders .or-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-orders .or-between{justify-content:space-between}#td-orders .or-small{color:var(--muted);font-size:12px}#td-orders .or-good{color:var(--good)}#td-orders .or-warn{color:var(--warn)}
#td-orders .or-demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;font-size:12px;color:var(--muted)}#td-orders .or-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:650px}#td-orders .or-side{padding:20px 12px;background:var(--paper);border-right:1px solid var(--line)}#td-orders .or-logo{padding:0 9px 20px;font-size:19px;font-weight:700}#td-orders .or-logo em{font-style:normal;color:var(--link)}#td-orders .or-side .or-button{display:flex;justify-content:flex-start;width:100%;border:0;background:transparent;color:var(--muted);margin:4px 0}#td-orders .or-side .or-current{background:var(--soft);color:var(--link)}#td-orders .or-main{min-width:0}#td-orders .or-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#td-orders .or-content{padding:22px;min-width:0}#td-orders .or-title{margin-bottom:19px}#td-orders .or-title p{margin-top:5px}#td-orders .or-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}#td-orders .or-tabs [aria-current=page]{background:var(--soft);border-color:var(--link);color:var(--link)}#td-orders .or-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:17px;min-width:0}#td-orders .or-tools{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:9px;margin-bottom:14px}#td-orders input:not([type=checkbox]),#td-orders select,#td-orders textarea{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px}#td-orders input[type=checkbox]{accent-color:var(--brand);width:17px;height:17px}#td-orders .or-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}#td-orders .or-table th{text-align:left;color:var(--muted);font-weight:500;padding:10px 6px}#td-orders .or-table td{padding:13px 6px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}#td-orders .or-table th:first-child{width:23%}#td-orders .or-table th:nth-child(2){width:25%}#td-orders .or-table th:nth-child(3){width:21%}#td-orders .or-table th:nth-child(4){width:16%}#td-orders .or-name{border:0;background:none;color:var(--link);font-weight:650;padding:0;text-align:left}#td-orders .or-cards{display:none}#td-orders .or-tag{display:inline-flex;border-radius:20px;padding:3px 8px;background:var(--warm);color:var(--warn);font-size:11px}#td-orders .or-empty{text-align:center;padding:30px 10px;color:var(--muted)}
#td-orders .or-wrap{position:relative}#td-orders .or-wrap:has(.or-drawer){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px)}#td-orders .or-wrap:has(.or-drawer) .or-layout{grid-template-columns:1fr}#td-orders .or-wrap:has(.or-drawer) .or-side{display:none}#td-orders .or-drawer{background:var(--paper);border-left:1px solid var(--line);border-radius:0 12px 12px 0;padding:22px;min-width:0}#td-orders .or-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}#td-orders .or-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}#td-orders .or-line span{color:var(--muted)}#td-orders .or-line strong{text-align:right;overflow-wrap:anywhere}#td-orders .or-section{border-top:1px solid var(--line);padding-top:17px;margin-top:17px}#td-orders .or-notice{padding:12px 13px;background:var(--soft);border-radius:8px;font-size:12px;margin:15px 0}#td-orders .or-warning{background:var(--warm);color:var(--warn)}#td-orders .or-field{display:block;font-size:13px;margin:14px 0}#td-orders .or-field input,#td-orders .or-field textarea{margin-top:7px}#td-orders .or-check{display:flex;align-items:flex-start;gap:8px;font-size:12px;margin:14px 0}#td-orders .or-data{padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace;color:var(--ink)}#td-orders .or-footer{padding:0 22px 20px;font-size:12px;color:var(--muted)}#td-orders .or-bottom{display:none}
@container order (max-width:720px){#td-orders .or-layout{display:block;min-height:0}#td-orders .or-side{display:none}#td-orders .or-content{padding:19px 15px}#td-orders .or-top{padding:16px}#td-orders .or-tools{grid-template-columns:1fr}#td-orders .or-table{display:none}#td-orders .or-cards{display:block}#td-orders .or-card{border-top:1px solid var(--line);padding:14px 0}#td-orders .or-card p{margin-top:5px}#td-orders .or-card .or-button{margin-top:10px}#td-orders .or-wrap:has(.or-drawer){display:block}#td-orders .or-wrap:has(.or-drawer) .or-layout{display:none}#td-orders .or-drawer{border:0;border-radius:12px;padding:18px}#td-orders input:not([type=checkbox]),#td-orders select,#td-orders textarea{font-size:16px}#td-orders .or-bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:5px 4px;border-radius:0 0 12px 12px}#td-orders .or-bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:3px 0;border:0;background:none;color:var(--muted);font-size:10px}#td-orders .or-bottom .or-current{color:var(--link)}#td-orders .or-footer{padding:0 15px 16px}}
@media(pointer:coarse){#td-orders button{min-height:44px}}
</style>
<div id="td-orders"><div id="td-or-app" class="or-app" data-theme="light" aria-label="Quản lý đơn hàng TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById('td-or-app'),prior=window.openai?.widgetState?.privateContent||{};
const s={theme:prior.theme==='dark'?'dark':'light',phone:prior.phone===true,tab:'Đơn bán',query:'',filter:'Tất cả',panel:'',selected:null,reason:'',values:'',checked:false,message:''};
const orders=[{id:'TD-1042',customer:'Minh Anh',product:'Trợ lý AI Pro',total:258000,payment:'Đã thanh toán',delivery:'Giao một phần',qty:2,delivered:1,attempt:2,alert:true,data:'DEMO-KEY-01'},{id:'TD-1038',customer:'Hải Nam',product:'Thiết kế sáng tạo',total:79000,payment:'Chờ đối soát',delivery:'Chưa giao',qty:1,delivered:0,attempt:1,alert:true,data:''},{id:'TD-1033',customer:'Lan Anh',product:'Lưu trữ đám mây',total:49000,payment:'Đã thanh toán',delivery:'Đã giao',qty:1,delivered:1,attempt:1,alert:false,data:'DEMO-KEY-03'},{id:'TD-1030',customer:'Hoàng Minh',product:'Trợ lý AI Pro',total:129000,payment:'Đã thanh toán',delivery:'Chờ xử lý',qty:1,delivered:0,attempt:3,alert:true,data:''}];
const customers=[{id:'KH-01',name:'Minh Anh',contact:'minhanh@example.com',balance:350000,status:'Đang hoạt động'},{id:'KH-02',name:'Hải Nam',contact:'hainam@example.com',balance:50000,status:'Đang hoạt động'}];
const warranties=[{id:'BH-01',product:'Tài khoản làm việc',customer:'Minh Anh',status:'Còn hạn',until:'30/11/2026',note:'Hỗ trợ theo điều kiện đã ghi'},{id:'BH-02',product:'Thiết kế sáng tạo',customer:'Hải Nam',status:'Hết hạn',until:'20/10/2026',note:''}];
const icon=n=>'<i class="or-icon" data-lucide="'+n+'" aria-hidden="true"></i>',money=n=>new Intl.NumberFormat('vi-VN').format(n)+' ₫',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,attrs='',primary=false)=>'<button type="button" class="or-button cursor-interaction '+(primary?'or-primary':'')+'" data-action="'+action+'" '+attrs+'>'+label+'</button>';
const line=(label,value)=>'<div class="or-line"><span>'+label+'</span><strong>'+value+'</strong></div>';
const nav=[['house','Hôm nay'],['package','Sản phẩm'],['truck','NCC'],['clipboard-list','Đơn hàng'],['chart-no-axes-combined','Tài chính']];
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:'admin-orders',direction:'Gọn rõ'},privateContent:{theme:s.theme,phone:s.phone}}).catch(()=>{});
function filtered(){const rows=s.tab==='Đơn bán'?orders:s.tab==='Khách hàng'?customers:s.tab==='Bảo hành'?warranties:[];return rows.filter(o=>JSON.stringify(o).toLocaleLowerCase('vi').includes(s.query.toLocaleLowerCase('vi').trim())&&(s.filter==='Tất cả'||Object.values(o).includes(s.filter)));}
function list(){if(s.tab==='Đơn nhập NCC')return '<div class="or-notice">Xem luồng mua, nhập kho và chi tiết đơn nhập trong phần Đơn nhập NCC đã thiết kế.</div>';const rows=filtered();const order=s.tab==='Đơn bán',customer=s.tab==='Khách hàng';const filterOptions=order?['Tất cả','Đã thanh toán','Chờ đối soát','Giao một phần','Chờ xử lý','Đã giao']:customer?['Tất cả','Đang hoạt động','Đã khóa']:['Tất cả','Còn hạn','Hết hạn'];const value=o=>order?money(o.total):customer?money(o.balance):o.until;const name=o=>order?o.id:customer?o.name:o.product;const sub=o=>order?o.customer+' · '+o.product:customer?o.contact:o.customer;const status=o=>order?o.delivery:o.status;const payment=o=>order?o.payment:customer?'Số dư ví':'Hạn bảo hành';return '<section class="or-panel"><div class="or-tools"><input type="search" data-search value="'+esc(s.query)+'" aria-label="Tìm trong danh sách" placeholder="Tìm mã, tên, khách hàng…"><select data-filter aria-label="Lọc trạng thái">'+filterOptions.map(x=>'<option '+(x===s.filter?'selected':'')+'>'+x+'</option>').join('')+'</select></div><p class="or-small">'+rows.length+' mục · '+(order||customer?'Tối đa 100 bản ghi gần nhất':'Tối đa 300 bản ghi')+'</p>'+(rows.length?'<table class="or-table"><thead><tr><th>'+(order?'Đơn hàng':customer?'Khách hàng':'Sản phẩm')+'</th><th>'+(order?'Khách / sản phẩm':customer?'Liên hệ':'Khách hàng')+'</th><th>Trạng thái</th><th>'+(order?'Tổng tiền':customer?'Số dư':'Hết hạn')+'</th><th></th></tr></thead><tbody>'+rows.map(o=>'<tr><td><button class="or-name cursor-interaction" data-action="open" data-id="'+o.id+'">'+esc(name(o))+'</button></td><td>'+esc(sub(o))+'</td><td>'+esc(status(o))+'<div class="or-small">'+esc(payment(o))+'</div></td><td>'+value(o)+'</td><td>'+btn('Xem','open','data-id="'+o.id+'"')+'</td></tr>').join('')+'</tbody></table><div class="or-cards">'+rows.map(o=>'<article class="or-card"><div class="or-row or-between"><strong>'+esc(name(o))+'</strong><strong>'+value(o)+'</strong></div><p class="or-small">'+esc(sub(o))+'</p><p><span class="or-tag">'+esc(status(o))+'</span> <span class="or-small">'+esc(payment(o))+'</span></p>'+btn('Xem chi tiết','open','data-id="'+o.id+'"')+'</article>').join('')+'</div>':'<div class="or-empty">Không tìm thấy mục phù hợp.</div>')+'</section>';}
function orderDetail(o){const missing=o.qty-o.delivered;return '<p class="or-small">'+esc(o.customer)+' · '+esc(o.product)+'</p>'+line('Tổng tiền',money(o.total))+line('Thanh toán',esc(o.payment))+line('Giao hàng',esc(o.delivery)+' · '+o.delivered+'/'+o.qty)+(o.alert?'<div class="or-notice or-warning">'+(o.payment==='Chờ đối soát'?'Cần xác minh thanh toán trước khi giao.':o.delivered>0?'Đã giao một phần. Chỉ bổ sung '+missing+' sản phẩm còn thiếu.':'Cần xác minh kết quả mua NCC trước khi thử lại.')+'</div>':'')+(o.data?'<div class="or-section"><h3>Đã giao</h3><pre class="or-data">'+esc(o.data)+'</pre></div>':'')+(o.payment==='Đã thanh toán'&&missing>0?'<div class="or-section"><h3>Hành động</h3><div class="or-row" style="margin-top:10px">'+btn('Bổ sung hàng','resolve')+(o.delivered===0?btn('Thử lại giao hàng','retry'):'')+'</div></div>':'')+(o.delivery==='Đã giao'&&o.alert?'<div class="or-section">'+btn('Đóng cảnh báo','ack')+'</div>':'')+(s.message?'<div class="or-notice" role="status">'+esc(s.message)+'</div>':'');}
function drawer(){if(!s.panel)return '';let title='',body='';if(s.panel==='order'){const o=s.selected;title='Đơn '+o.id;body=orderDetail(o);}else if(s.panel==='resolve'){const o=s.selected;title='Bổ sung hàng';body='<p class="or-small">Đơn '+o.id+' · Còn thiếu '+(o.qty-o.delivered)+' sản phẩm.</p><label class="or-field">Dữ liệu giao bổ sung<textarea data-values rows="5" placeholder="Mỗi dòng một sản phẩm">'+esc(s.values)+'</textarea></label><label class="or-field">Lý do<input data-reason value="'+esc(s.reason)+'" placeholder="Ghi lý do xử lý"></label><div class="or-notice">Chỉ thêm phần còn thiếu; không ghi đè dữ liệu đã giao.</div>'+btn('Xác nhận bổ sung','confirm-resolve','style="width:100%"',true);}else if(s.panel==='retry'){title='Thử lại giao hàng';body='<div class="or-notice or-warning">Chỉ thử lại sau khi xác minh NCC chưa mua. Thao tác này có thể phát sinh mua hàng.</div><label class="or-check"><input type="checkbox" data-check '+(s.checked?'checked':'')+'>Tôi đã xác minh NCC chưa mua cho lần xử lý này.</label><label class="or-field">Lý do<input data-reason value="'+esc(s.reason)+'" placeholder="Ghi kết quả kiểm tra"></label>'+btn('Xác nhận thử lại','confirm-retry','style="width:100%" '+(s.checked&&s.reason.trim()?'':'disabled'),true)+'<p class="or-small" style="margin-top:12px">Nếu trạng thái đã đổi, tải lại đơn trước khi xử lý.</p>';}else if(s.panel==='customer'){const c=s.selected;title=c.name;body=line('Liên hệ',esc(c.contact))+line('Số dư ví',money(c.balance))+line('Tài khoản',esc(c.status))+'<div class="or-section"><h3>Đơn và giao dịch gần đây</h3><p class="or-small">Tối đa 20 đơn và 20 giao dịch theo dữ liệu chi tiết khách.</p></div>'+btn('Xem ví & sổ cái','finance','style="margin-top:16px"');}else if(s.panel==='warranty'){const w=s.selected;title='Bảo hành · '+w.product;body=line('Khách hàng',esc(w.customer))+line('Trạng thái',esc(w.status))+line('Hạn bảo hành',esc(w.until))+'<label class="or-field">Ghi chú<input data-note value="'+esc(w.note)+'"></label>'+btn('Lưu ghi chú','save-note','',true);}else if(s.panel==='finance'){title='Ví & sổ cái';body='<div class="or-notice">Điều chỉnh và hoàn ví được xử lý trong Tài chính theo điều kiện API hiện có.</div>';}return '<section class="or-drawer" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="or-head"><h2>'+esc(title)+'</h2>'+btn(icon('x'),'close','aria-label="Đóng"')+'</div>'+body+'</section>';}
function render(){app.dataset.theme=s.theme;app.classList.toggle('or-phone',s.phone);app.innerHTML='<div class="or-demo"><span>Đơn hàng · Dữ liệu minh họa</span><div class="or-row">'+btn(icon(s.theme==='light'?'moon':'sun'),'theme','aria-label="Đổi sáng tối"')+'<button class="or-link cursor-interaction" data-action="device">'+(s.phone?'Xem desktop':'Xem mobile')+'</button></div></div><div class="or-wrap"><div class="or-layout"><aside class="or-side"><div class="or-logo">Tiệm<em>Digital</em> <span class="or-small">Admin</span></div>'+nav.map(([i,t])=>'<button class="or-button '+(t==='Đơn hàng'?'or-current':'')+'">'+icon(i)+t+'</button>').join('')+'</aside><main class="or-main"><header class="or-top"><strong>Đơn hàng</strong>'+btn(icon('settings'),'noop','aria-label="Cài đặt"')+'</header><div class="or-content"><div class="or-title"><h1>Đơn hàng</h1><p class="or-small">Theo dõi đơn, bảo hành và khách hàng</p></div><nav class="or-tabs" aria-label="Mục đơn hàng">'+['Đơn bán','Đơn nhập NCC','Bảo hành','Khách hàng'].map(x=>btn(x,'tab','data-tab="'+x+'" '+(s.tab===x?'aria-current="page"':''))).join('')+'</nav>'+list()+'</div><footer class="or-footer">TiệmDigital · Bản mẫu, dữ liệu minh họa</footer></main></div>'+drawer()+'</div><nav class="or-bottom" aria-label="Điều hướng admin">'+nav.map(([i,t])=>'<button class="'+(t==='Đơn hàng'?'or-current':'')+'">'+icon(i)+'<span>'+t+'</span></button>').join('')+'</nav>';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
app.addEventListener('input',e=>{if(e.target.matches('[data-search]')){s.query=e.target.value;const pos=e.target.selectionStart;render();const n=app.querySelector('[data-search]');n.focus();n.setSelectionRange(pos,pos);}if(e.target.matches('[data-reason]')){s.reason=e.target.value;if(s.panel==='retry')app.querySelector('[data-action=confirm-retry]').disabled=!(s.checked&&s.reason.trim());}if(e.target.matches('[data-values]'))s.values=e.target.value;});
app.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){s.filter=e.target.value;render();}if(e.target.matches('[data-check]')){s.checked=e.target.checked;app.querySelector('[data-action=confirm-retry]').disabled=!(s.checked&&s.reason.trim());}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case'theme':s.theme=s.theme==='light'?'dark':'light';save();break;case'device':s.phone=!s.phone;save();break;case'tab':s.tab=b.dataset.tab;s.query='';s.filter='Tất cả';s.message='';break;case'open':s.selected=(s.tab==='Đơn bán'?orders:s.tab==='Khách hàng'?customers:warranties).find(x=>x.id===b.dataset.id);s.panel=s.tab==='Đơn bán'?'order':s.tab==='Khách hàng'?'customer':'warranty';s.message='';break;case'close':s.panel='';s.message='';break;case'resolve':s.panel='resolve';s.reason='';s.values='';break;case'retry':s.panel='retry';s.reason='';s.checked=false;break;case'confirm-resolve':{const o=s.selected,values=s.values.split('\n').map(x=>x.trim()).filter(Boolean);if(!s.reason.trim()||values.length!==o.qty-o.delivered){const field=app.querySelector('[data-values]');field.setCustomValidity('Nhập lý do và đúng số lượng còn thiếu.');field.reportValidity();field.setCustomValidity('');return;}o.data=[o.data,...values].filter(Boolean).join('\n');o.delivered=o.qty;o.delivery='Đã giao';s.message='Đã bổ sung hàng. Có thể đóng cảnh báo sau khi kiểm tra.';s.panel='order';break;}case'confirm-retry':s.message='Đã gửi yêu cầu thử lại. Kiểm tra kết quả trước khi xử lý tiếp.';s.panel='order';break;case'ack':s.selected.alert=false;s.message='Đã đóng cảnh báo sau khi giao xong.';break;case'finance':s.panel='finance';break;case'save-note':s.selected.note=app.querySelector('[data-note]').value;s.panel='';break;}render();});
render();window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!p)return;s.theme=p.theme==='dark'?'dark':'light';s.phone=p.phone===true;render();});
})();
</script>
