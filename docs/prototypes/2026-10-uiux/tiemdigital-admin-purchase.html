<style>
#td-buy{font:14px/1.5 "Segoe UI",Arial,sans-serif;color:#142033}#td-buy *{box-sizing:border-box}#td-buy [hidden]{display:none!important}#td-buy .bu-app{--bg:#f6f8fc;--paper:#fff;--ink:#142033;--muted:#5c697c;--line:#dfe5ef;--soft:#eaf0ff;--brand:#3358cf;--link:#3358cf;--good:#236448;--warn:#925000;--warm:#fff3de;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;container:buy / inline-size;min-width:0;color-scheme:light}#td-buy .bu-app[data-theme=dark]{--bg:#131923;--paper:#1b2432;--ink:#ecf0f8;--muted:#b1bfd1;--line:#344257;--soft:#283a5d;--link:#a6bcff;--good:#9bd6b4;--warn:#ffd599;--warm:#3c3022;color-scheme:dark}#td-buy .bu-phone{max-width:390px;margin:auto}#td-buy h1,#td-buy h2,#td-buy h3,#td-buy p{margin:0}#td-buy h1{font-size:26px;line-height:1.2}#td-buy h2{font-size:20px;line-height:1.3}#td-buy h3{font-size:14px}#td-buy button,#td-buy input,#td-buy select{font:inherit}#td-buy button{cursor:inherit}#td-buy button:focus-visible,#td-buy input:focus-visible,#td-buy select:focus-visible{outline:2px solid var(--link);outline-offset:3px}
#td-buy .bu-button{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:40px;padding:9px 12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600}#td-buy .bu-button:disabled{opacity:.5}#td-buy .bu-primary{background:var(--brand);border-color:var(--brand);color:#fff}#td-buy .bu-link{border:0;background:none;color:var(--link);padding:4px 0;min-height:32px;font-size:12px}#td-buy .bu-icon{width:16px;height:16px;flex-shrink:0}#td-buy .bu-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-buy .bu-between{justify-content:space-between}#td-buy .bu-small{font-size:12px;color:var(--muted)}
#td-buy .bu-demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;color:var(--muted);font-size:12px}#td-buy .bu-demo label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#td-buy select,#td-buy input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0;width:100%;font-size:13px}#td-buy .bu-demo select{width:auto;max-width:230px;padding:6px;font-size:12px}
#td-buy .bu-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:650px}#td-buy .bu-side{padding:20px 12px;background:var(--paper);border-right:1px solid var(--line)}#td-buy .bu-logo{padding:0 9px 20px;font-size:19px;font-weight:700}#td-buy .bu-logo em{font-style:normal;color:var(--link)}#td-buy .bu-side .bu-button{display:flex;justify-content:flex-start;width:100%;border:0;background:transparent;color:var(--muted);margin:4px 0}#td-buy .bu-side .bu-current{background:var(--soft);color:var(--link)}#td-buy .bu-main{min-width:0}#td-buy .bu-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#td-buy .bu-content{padding:22px;min-width:0}#td-buy .bu-title{margin-bottom:19px}#td-buy .bu-title p{margin-top:5px}#td-buy .bu-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:15px;min-width:0}#td-buy .bu-product{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}#td-buy .bu-price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}#td-buy .bu-state{font-size:12px;color:var(--good)}#td-buy .bu-warn{color:var(--warn)}#td-buy .bu-card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
#td-buy .bu-wrap{position:relative}#td-buy .bu-wrap:has(.bu-drawer){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px)}#td-buy .bu-wrap:has(.bu-drawer) .bu-layout{grid-template-columns:1fr}#td-buy .bu-wrap:has(.bu-drawer) .bu-side{display:none}#td-buy .bu-drawer{background:var(--paper);border-left:1px solid var(--line);border-radius:0 12px 12px 0;padding:22px;min-width:0}#td-buy .bu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}#td-buy .bu-field{display:block;font-size:13px;margin:15px 0}#td-buy .bu-field input,#td-buy .bu-field select{margin-top:6px}#td-buy .bu-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}#td-buy .bu-line>span{color:var(--muted)}#td-buy .bu-line strong{text-align:right;overflow-wrap:anywhere}#td-buy .bu-note{padding:12px 13px;border-radius:8px;background:var(--soft);font-size:12px;margin:15px 0}#td-buy .bu-warning{background:var(--warm);color:var(--warn)}#td-buy .bu-sim{border-top:1px dashed var(--line);margin-top:20px;padding-top:14px}#td-buy .bu-data{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font:12px/1.6 Consolas,monospace}#td-buy .bu-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}#td-buy .bu-tabs [aria-pressed=true]{background:var(--soft);color:var(--link);border-color:var(--link)}#td-buy .bu-footer{padding:0 22px 20px;font-size:12px;color:var(--muted)}#td-buy .bu-bottom{display:none}
@container buy (max-width:720px){#td-buy .bu-layout{display:block;min-height:0}#td-buy .bu-side{display:none}#td-buy .bu-content{padding:19px 15px}#td-buy .bu-top{padding:16px}#td-buy .bu-wrap:has(.bu-drawer){display:block}#td-buy .bu-wrap:has(.bu-drawer) .bu-layout{display:none}#td-buy .bu-drawer{border:0;border-radius:12px;padding:18px}#td-buy input,#td-buy select{font-size:16px}#td-buy .bu-bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:5px 4px;border-radius:0 0 12px 12px}#td-buy .bu-bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:3px 0;border:0;background:none;color:var(--muted);font-size:10px}#td-buy .bu-bottom .bu-current{color:var(--link)}#td-buy .bu-footer{padding:0 15px 16px}}
@media(pointer:coarse){#td-buy button{min-height:44px}}

<div id="td-buy"><div id="td-bu-app" class="bu-app" data-theme="light" aria-label="Mua NCC và nhập kho TiệmDigital"></div></div>
<script>
(()=>{
const app=document.getElementById('td-bu-app'),prior=window.openai?.widgetState?.privateContent||{};
const s={theme:prior.theme==='dark'?'dark':'light',phone:prior.phone===true,scenario:'instant',page:'catalog',panel:'',purpose:'use',quantity:1,email:'',target:'Kho AI Pro',targetMode:'existing',newName:'',newCategory:'Công cụ AI',newPrice:129000,orders:[],order:null,busy:false};
const scenarios={instant:'NCC giao ngay',pending:'NCC giao sau',importError:'Nhập kho gặp lỗi',uncertain:'Kết quả mua chưa rõ',unsaved:'Mua xong, chưa lưu đơn'};
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+' ₫',icon=n=>'<i class="bu-icon" data-lucide="'+n+'" aria-hidden="true"></i>',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,attrs='',primary=false)=>'<button type="button" class="bu-button cursor-interaction '+(primary?'bu-primary':'')+'" data-action="'+action+'" '+attrs+'>'+label+'</button>';
const nav=[['house','Hôm nay'],['package','Sản phẩm'],['truck','NCC'],['clipboard-list','Đơn hàng'],['chart-no-axes-combined','Tài chính']];
const save=()=>window.openai?.setWidgetState?.({modelContent:{screen:'admin-purchase',direction:'Gọn rõ',scenario:s.scenario},privateContent:{theme:s.theme,phone:s.phone}}).catch(()=>{});
const line=(label,value)=>'<div class="bu-line"><span>'+label+'</span><strong>'+value+'</strong></div>';
const sim=(text,action)=>'<div class="bu-sim"><p class="bu-small">Điều khiển bản mẫu · Không mua hàng thật</p>'+btn(text,action)+'</div>';
function base(){if(s.page==='orders')return '<div class="bu-title"><h1>Đơn nhập NCC</h1><p class="bu-small">Đơn mua dùng và đơn nhập kho</p></div><div class="bu-panel"><div class="bu-row bu-between"><strong>Đơn gần đây</strong>'+btn('Hàng từ NCC','catalog')+'</div>'+(s.orders.length?s.orders.slice().reverse().map(o=>'<article class="bu-card-row"><div><strong>'+o.id+' · Trợ lý AI Pro</strong><p class="bu-small">'+(o.purpose==='stock'?'Mua nhập kho':'Mua dùng')+' · '+money(o.total)+'</p><span class="bu-state '+(o.purchase==='unknown'?'bu-warn':'')+'">'+(o.purchase==='unknown'?'Cần đối soát':o.delivery==='pending'?'Chờ NCC giao':'NCC đã nhận đơn')+'</span></div>'+btn('Xem chi tiết','order','data-id="'+o.id+'"')+'</article>').join(''):'<div class="bu-note">Chưa có đơn nhập trong bản mẫu.</div>')+'</div>';return '<div class="bu-title"><h1>Hàng từ NCC</h1><p class="bu-small">Sản phẩm → Hàng từ NCC</p></div><div class="bu-panel"><div class="bu-product"><div><span class="bu-small">NCC A · Công cụ AI</span><h3>Trợ lý AI Pro</h3><div class="bu-price">99.000 ₫ <span class="bu-small">/ sản phẩm · giá minh họa</span></div><span class="bu-state">Còn hàng</span></div><div class="bu-row">'+btn('Mua dùng','start','data-purpose="use"')+btn('Mua nhập kho','start','data-purpose="stock"','true')+'</div></div></div>'+btn('Xem Đơn nhập NCC','orders');}
function purchase(){const stock=s.purpose==='stock';return '<p class="bu-small">NCC A · Trợ lý AI Pro · Giá tham khảo '+money(99000)+'</p><label class="bu-field">Số lượng<input type="number" min="1" value="'+s.quantity+'" data-quantity></label><label class="bu-field">Email nhận hàng (nếu NCC yêu cầu)<input type="email" value="'+esc(s.email)+'" data-email placeholder="Không bắt buộc"></label>'+(stock?'<h3>Nơi nhận hàng trong kho</h3><div class="bu-tabs">'+btn('Chọn có sẵn','target-mode','data-mode="existing" aria-pressed="'+(s.targetMode==='existing')+'"')+btn('Tạo nhanh','target-mode','data-mode="new" aria-pressed="'+(s.targetMode==='new')+'"')+'</div>'+(s.targetMode==='existing'?'<label class="bu-field">Sản phẩm kho<select data-target><option>Kho AI Pro</option><option>Kho công cụ số</option></select></label>':'<label class="bu-field">Tên sản phẩm kho<input data-new-name value="'+esc(s.newName)+'" placeholder="Nhập tên sản phẩm"></label><label class="bu-field">Danh mục<input data-new-category value="'+esc(s.newCategory)+'"></label><label class="bu-field">Giá bán dự kiến<input type="number" min="0" data-new-price value="'+s.newPrice+'"></label><p class="bu-small">Sản phẩm mới mặc định chưa lên kệ.</p>'):'<div class="bu-note">Hàng được hiển thị trong kết quả mua và Đơn nhập NCC.</div>')+line('Tổng dự kiến',money(99000*s.quantity))+'<div class="bu-note bu-warning">Đơn mua thành công là chi phí kinh doanh. Ghi chi tự động cần dữ liệu được xác minh; kết quả sẽ hiện trạng thái thực tế.</div>'+btn('Xác nhận '+(stock?'mua nhập kho':'mua dùng'),'confirm','style="width:100%" '+(s.busy?'disabled':''),true);}
function status(){const o=s.order;return line('Mua NCC',o.purchase==='unknown'?'Chưa rõ · Cần đối soát':'NCC đã nhận đơn')+line('Giao hàng',o.delivery==='pending'?'Chờ NCC giao':o.delivery==='delivered'?'Đã nhận '+o.qty+' sản phẩm':'Chưa xác nhận')+line('Nhập kho',o.purpose==='use'?'Mua dùng · Không nhập kho':o.imported?'Đã nhập '+o.qty+' sản phẩm':o.delivery==='pending'?'Chờ hàng':'Chưa nhập')+line('Ghi chi','Cần đối soát');}
function orderDetail(){const o=s.order;return '<div class="bu-row bu-between"><span class="bu-small">'+o.id+' · '+(o.purpose==='use'?'Mua dùng':'Mua nhập kho')+'</span><span class="bu-state '+(o.purchase==='unknown'?'bu-warn':'')+'">'+(o.purchase==='unknown'?'Cần đối soát':'NCC đã nhận đơn')+'</span></div><div style="margin:16px 0"><h3>Trợ lý AI Pro</h3><p class="bu-small">NCC A · '+o.qty+' sản phẩm · '+money(o.total)+' dự kiến</p></div>'+status()+(o.purchase==='unknown'?'<div class="bu-note bu-warning">Chưa xác minh kết quả mua. Kiểm tra với NCC trước khi thao tác tiếp; không mua lại.</div>':o.delivery==='pending'?'<div class="bu-note">NCC chưa giao. Kiểm tra lại đơn khi có hàng; đơn tiếp tục nằm trong Đơn nhập NCC.</div>'+btn('Kiểm tra trạng thái','check')+sim('Mô phỏng NCC đã giao','delivered'):o.purchase==='unsaved'?'<div class="bu-note bu-warning">NCC báo thành công nhưng lưu đơn chưa xác nhận. Cần đối soát; không mua lại.</div>':(o.delivery==='delivered'?'<h3 style="margin-top:18px">Dữ liệu nhận được</h3><pre class="bu-data">'+o.data+'</pre>'+btn('Sao chép dữ liệu','copy')+(o.purpose==='stock'&&!o.imported?'<div class="bu-note bu-warning">Hàng đã nhận nhưng chưa nhập kho. Chọn lại nơi nhận nếu cần rồi chỉ thử bước nhập.</div><label class="bu-field">Sản phẩm kho<select data-import-target><option>Kho AI Pro</option><option>Kho công cụ số</option></select></label>'+btn('Nhập kho','import','',true):''):'') )+'<div class="bu-note bu-warning">Chưa xác nhận ghi chi. Theo dõi riêng, không tính lại tiền nhập khi bán.</div>'+btn('Đơn nhập NCC','orders','style="width:100%"');}
function drawer(){if(!s.panel)return '';let title=s.panel==='buy'?(s.purpose==='stock'?'Mua nhập kho':'Mua dùng'):'Chi tiết đơn nhập';let body=s.panel==='buy'?purchase():orderDetail();return '<section class="bu-drawer" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="bu-head"><h2>'+title+'</h2>'+btn(icon('x'),'close','aria-label="Đóng" '+(s.busy?'disabled':''))+'</div>'+body+'</section>';}
function render(){app.dataset.theme=s.theme;app.classList.toggle('bu-phone',s.phone);app.innerHTML='<div class="bu-demo"><label>Tình huống mẫu <select data-scenario>'+Object.entries(scenarios).map(([v,t])=>'<option value="'+v+'" '+(s.scenario===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label><div class="bu-row">'+btn(icon(s.theme==='light'?'moon':'sun'),'theme','aria-label="Đổi sáng tối"')+'<button class="bu-link cursor-interaction" data-action="device">'+(s.phone?'Xem desktop':'Xem mobile')+'</button></div></div><div class="bu-wrap"><div class="bu-layout"><aside class="bu-side"><div class="bu-logo">Tiệm<em>Digital</em> <span class="bu-small">Admin</span></div>'+nav.map(([i,t])=>'<button class="bu-button '+((s.page==='orders'?t==='Đơn hàng':t==='Sản phẩm')?'bu-current':'')+'">'+icon(i)+t+'</button>').join('')+'</aside><main class="bu-main"><header class="bu-top"><strong>'+(s.page==='orders'?'Đơn hàng':'Sản phẩm')+'</strong>'+btn(icon('settings'),'noop','aria-label="Cài đặt"')+'</header><div class="bu-content">'+base()+'</div><footer class="bu-footer">TiệmDigital · Bản mẫu, dữ liệu minh họa</footer></main></div>'+drawer()+'</div><nav class="bu-bottom" aria-label="Điều hướng admin">'+nav.map(([i,t])=>'<button class="'+((s.page==='orders'?t==='Đơn hàng':t==='Sản phẩm')?'bu-current':'')+'">'+icon(i)+'<span>'+t+'</span></button>').join('')+'</nav>';if(app.querySelector('[data-target]'))app.querySelector('[data-target]').value=s.target;if(app.querySelector('[data-import-target]'))app.querySelector('[data-import-target]').value=['Kho AI Pro','Kho công cụ số'].includes(s.target)?s.target:'Kho AI Pro';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
app.addEventListener('input',e=>{if(e.target.matches('[data-quantity]'))s.quantity=Math.max(1,Math.trunc(Number(e.target.value))||1);if(e.target.matches('[data-email]'))s.email=e.target.value;if(e.target.matches('[data-new-name]'))s.newName=e.target.value;if(e.target.matches('[data-new-category]'))s.newCategory=e.target.value;if(e.target.matches('[data-new-price]'))s.newPrice=Number(e.target.value);if(e.target.matches('[data-quantity]')){const value=s.quantity;render();const n=app.querySelector('[data-quantity]');n.focus();n.value=value;}});
app.addEventListener('change',e=>{if(e.target.matches('[data-scenario]')){s.scenario=e.target.value;save();render();}if(e.target.matches('[data-target]')||e.target.matches('[data-import-target]'))s.target=e.target.value;});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case'theme':s.theme=s.theme==='light'?'dark':'light';save();break;case'device':s.phone=!s.phone;save();break;case'start':s.purpose=b.dataset.purpose;s.panel='buy';break;case'target-mode':s.targetMode=b.dataset.mode;break;case'close':s.panel='';break;case'orders':s.page='orders';s.panel='';break;case'catalog':s.page='catalog';s.panel='';break;case'confirm':{if(s.purpose==='stock'&&s.targetMode==='new'&&!s.newName.trim()){const f=app.querySelector('[data-new-name]');f.setCustomValidity('Nhập tên sản phẩm kho');f.reportValidity();f.setCustomValidity('');return;}if(s.busy)return;s.busy=true;render();setTimeout(()=>{s.busy=false;const uncertain=s.scenario==='uncertain',unsaved=s.scenario==='unsaved',pending=s.scenario==='pending';const o={id:'NCC-'+(1001+s.orders.length),purpose:s.purpose,qty:s.quantity,total:99000*s.quantity,purchase:uncertain?'unknown':unsaved?'unsaved':'success',delivery:uncertain||unsaved?'unknown':pending?'pending':'delivered',imported:!uncertain&&!unsaved&&!pending&&s.purpose==='stock'&&s.scenario!=='importError',target:s.targetMode==='new'?s.newName:s.target,data:'DEMO-KEY-01\nDEMO-KEY-02'};s.order=o;s.orders.push(o);s.panel='detail';render();},450);return;}case'order':s.order=s.orders.find(x=>x.id===b.dataset.id);s.panel='detail';break;case'check':b.textContent='Đã kiểm tra · Chưa có cập nhật';return;case'delivered':s.order.delivery='delivered';s.order.data='DEMO-KEY-01\nDEMO-KEY-02';break;case'import':s.order.imported=true;s.order.target=s.target;break;case'copy':try{await navigator.clipboard.writeText(s.order.data);b.textContent='Đã sao chép';}catch{b.textContent='Chọn dữ liệu để sao chép';}return;}render();});
render();window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!p)return;s.theme=p.theme==='dark'?'dark':'light';s.phone=p.phone===true;render();});
})();
</script>
