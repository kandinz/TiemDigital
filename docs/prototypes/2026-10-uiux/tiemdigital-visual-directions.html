  #td-directions .td-app[data-direction="warm"] .td-product .td-cost { grid-column:2; grid-row:2; text-align:left; }

  #td-directions .td-app[data-direction="sharp"] .td-product, #td-directions .td-app[data-direction="sharp"] .td-product:first-child { grid-row:auto; padding:17px; border:1px solid var(--td-line); }
  #td-directions .td-app[data-direction="sharp"] .td-product:first-child .td-name { font-size:21px; }
  #td-directions .td-app[data-direction="sharp"] .td-product:first-child .td-price { font-size:23px; }
  #td-directions .td-app[data-direction="sharp"] .td-product:first-child .td-cost { grid-column:1/3; }
  #td-directions .td-footer { margin-top:22px; padding-top:17px; font-size:11px; }
  #td-directions .td-admin { display:block; min-height:680px; }
  #td-directions .td-sidebar { display:none; }
  #td-directions .td-main { padding:22px 16px; }
  #td-directions .td-heading { margin-bottom:22px; }
  #td-directions .td-heading h1, #td-directions .td-app[data-direction="warm"] .td-heading h1 { font-size:29px; }
  #td-directions .td-metrics { grid-template-columns:1fr 1fr; gap:9px; }
  #td-directions .td-metric { padding:14px; }
  #td-directions .td-metric:first-child { grid-column:1/3; }
  #td-directions .td-metric strong, #td-directions .td-app[data-direction="sharp"] .td-metric strong, #td-directions .td-app[data-direction="warm"] .td-metric strong { font-size:clamp(17px,5.4cqw,23px); }
  #td-directions .td-metric:first-child strong { font-size:32px; }
  #td-directions .td-app[data-direction="warm"] .td-metrics, #td-directions .td-app[data-direction="sharp"] .td-metrics { gap:0; }
  #td-directions .td-metric small { font-size:11px; }
  #td-directions .td-line { grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:15px; }
  #td-directions .td-line .td-row-status { grid-column:1; grid-row:2; }
  #td-directions .td-line .td-row-action { grid-column:2; grid-row:1/3; }
  #td-directions .td-panel-title { padding:14px 15px; }
  #td-directions .td-panel-title h2 { font-size:14px; }
  #td-directions .td-mobile-nav { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-top:1px solid var(--td-line); background:var(--td-paper); padding:10px 5px; border-radius:0 0 var(--td-radius) var(--td-radius); }
  #td-directions .td-mobile-nav button { border:0; background:transparent; color:var(--td-muted); font-size:10px; padding:8px 0; display:flex; flex-direction:column; align-items:center; gap:5px; }
  #td-directions .td-mobile-nav button[aria-pressed="true"] { color:var(--td-accent-ink); }
  #td-directions .td-drawer { width:100%; border-left:0; border-radius:var(--td-radius); }
}
@media (max-width:500px) {
  #td-directions .td-variant { min-height:1050px; }
}
@media (pointer:coarse) {
  #td-directions .td-app button { min-height:44px; }
  #td-directions .td-app input { font-size:16px; }
}

<div id="td-directions" class="viz-carousel" aria-label="Ba hướng thị giác TiệmDigital" data-previous-label="Hướng trước" data-next-label="Hướng tiếp">
  <section class="td-variant" data-variant="Gọn rõ" aria-label="Hướng Gọn rõ">
    <div class="td-preview"><div class="td-app" id="td-clean" data-direction="clean" data-theme="light" aria-label="Gọn rõ — bản mẫu TiệmDigital"></div></div>
  </section>
  <section class="td-variant" data-variant="Tiệm ấm" aria-label="Hướng Tiệm ấm" hidden>
    <div class="td-preview"><div class="td-app" id="td-warm" data-direction="warm" data-theme="light" aria-label="Tiệm ấm — bản mẫu TiệmDigital"></div></div>
  </section>
  <section class="td-variant" data-variant="Sắc nét" aria-label="Hướng Sắc nét" hidden>
    <div class="td-preview"><div class="td-app" id="td-sharp" data-direction="sharp" data-theme="light" aria-label="Sắc nét — bản mẫu TiệmDigital"></div></div>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById("td-directions");
  const products = [
    {id:1,name:"Trợ lý AI Pro",category:"Công cụ AI",description:"Gói tháng cho công việc và học tập.",price:129000,mark:"AI"},
    {id:2,name:"Bộ thiết kế sáng tạo",category:"Thiết kế",description:"Công cụ làm hình ảnh và nội dung.",price:79000,mark:"Ds"},
    {id:3,name:"Lưu trữ đám mây",category:"Tiện ích",description:"Thêm không gian cho tài liệu của bạn.",price:49000,mark:"Cl"}
  ];
  const dirs = {
    clean:{title:"Gọn rõ",eyebrow:"Không gian số của bạn",heading:"Đúng công cụ.\nGọn mọi việc.",intro:"Tìm sản phẩm bạn cần, xem rõ điều kiện và mua nhanh.",accent:"#3358cf",radius:12},
    warm:{title:"Tiệm ấm",eyebrow:"Một tiệm nhỏ, nhiều tiện ích",heading:"Đồ số hay,\ncho ngày nhẹ hơn.",intro:"Một nơi dễ tìm, dễ chọn những công cụ bạn cần.",accent:"#1c6253",radius:18},
    sharp:{title:"Sắc nét",eyebrow:"Tìm nhanh · Chọn đúng",heading:"Công cụ số.\nVào việc ngay.",intro:"Thông tin rõ. Giá dễ xem. Mua ngay khi đã chọn.",accent:"#ba4018",radius:3}
  };
  const navs=[["today","Hôm nay","house"],["products","Sản phẩm","package"],["providers","NCC","building-2"],["orders","Đơn hàng","receipt-text"],["finance","Tài chính","chart-no-axes-combined"]];
  const money=n=>new Intl.NumberFormat("vi-VN").format(n)+" ₫";
  const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const logo=()=>'<div class="td-logo"><span class="td-mark">t.</span><span>Tiệm<em>Digital</em></span></div>';
  const button=(label,action,extra="",primary=false)=>'<button type="button" class="td-button cursor-interaction '+(primary?'td-primary':'')+'" data-action="'+action+'" '+extra+'>'+label+'</button>';
  const states=new Map();
  let saved = window.openai?.widgetState?.privateContent || {};
  const persist=()=>{
    const local={};
    states.forEach((s,key)=>{local[key]={theme:s.theme,view:s.view,phone:s.phone};});
    window.openai?.setWidgetState?.({modelContent:{prototype:"TiệmDigital",lightDefault:true},privateContent:local}).catch(()=>{});
  };
  const productHTML=p=>'<article class="td-product" data-product="'+p.id+'" data-category="'+p.category+'" data-name="'+p.name.toLocaleLowerCase("vi")+'"><div class="td-product-top"><div class="td-product-icon">'+p.mark+'</div><span class="td-stock">Còn hàng</span></div><div class="td-copy"><div class="td-category">'+p.category+'</div><button type="button" class="td-name cursor-interaction" data-action="detail" data-id="'+p.id+'">'+p.name+'</button><p class="td-description">'+p.description+'</p></div><div class="td-cost"><span class="td-price">'+money(p.price)+'</span><span class="td-period">/ tháng</span></div>'+button('Mua ngay '+icon("arrow-up-right"),"buy",'data-id="'+p.id+'"',true).replace('class="td-button','class="td-button td-buy')+'</article>';
  function shop(s) {
    const d=dirs[s.key];
    return '<header class="td-top">'+logo()+'<div class="td-tools">'+button(icon(s.theme==="light"?"moon":"sun"),"theme",'aria-label="Chuyển chế độ sáng tối"')+button(icon("user-round")+'<span class="td-account-word">Tài khoản</span>',"account")+'</div></header><main class="td-shop"><section class="td-hero"><div><p class="td-eyebrow">'+d.eyebrow+'</p><h1>'+d.heading.replace("\n","<br>")+'</h1><p class="td-intro">'+d.intro+'</p></div><label class="td-search">'+icon("search")+'<input type="search" aria-label="Tìm sản phẩm minh họa" placeholder="Bạn đang tìm gì?" value="'+s.q+'"></label></section><nav class="td-chips" aria-label="Danh mục">'+["Tất cả","Công cụ AI","Thiết kế","Tiện ích"].map(c=>'<button type="button" class="td-chip cursor-interaction" data-action="category" data-value="'+c+'" aria-pressed="'+(s.category===c)+'">'+c+'</button>').join("")+'</nav><div class="td-catalog-head"><strong>Sản phẩm</strong><span class="td-result-count">3 sản phẩm</span></div><div class="td-products">'+products.map(productHTML).join("")+'</div><p class="td-empty" hidden>Không tìm thấy sản phẩm phù hợp.</p><footer class="td-footer"><span>TiệmDigital · Công cụ cho mỗi ngày</span><span>Đơn hàng · Hỗ trợ</span></footer></main>';
  }
  function navHTML(s,cls) {
    return '<nav class="'+cls+'" aria-label="Điều hướng admin">'+navs.map(([id,name,i])=>'<button type="button" class="cursor-interaction" data-action="module" data-module="'+id+'" aria-pressed="'+(s.module===id)+'">'+icon(i)+'<span>'+name+'</span>'+(id==="orders"&&cls==="td-nav"?'<span class="td-count">2</span>':"")+'</button>').join("")+'</nav>';
  }
  const metric=(label,value,context)=>'<section class="td-metric"><div class="td-metric-label">'+label+'</div><strong>'+value+'</strong><small>'+context+'</small></section>';
  const row=(title,desc,status,action="Xem",ok=false)=>'<div class="td-line"><div><strong>'+title+'</strong><p>'+desc+'</p></div><div class="td-row-status"><span class="td-status '+(ok?"td-ok":"")+'">'+status+'</span></div><div class="td-row-action">'+button(action,"row",'data-title="'+title+'"')+'</div></div>';
  function adminContent(s) {
    const metrics='<div class="td-metrics">'+metric("Doanh thu",money(1240000),"Hôm nay")+metric("Chi phí",money(860000),"Mua hàng và vận hành")+metric("Lợi nhuận",money(380000),"Doanh thu − chi phí")+'</div>';
    const tasks='<section class="td-panel"><div class="td-panel-title"><h2>Cần xử lý · 2 đơn</h2><button type="button" class="td-text-button cursor-interaction" data-action="module" data-module="orders">Xem đơn hàng →</button></div>'+row("TD1042 · Trợ lý AI Pro","Đơn bán · Còn thiếu 1 sản phẩm","Giao một phần","Xử lý")+row("TD1038 · Bộ thiết kế","Đơn bán · Cần kiểm tra kết quả NCC","Chờ đối soát","Kiểm tra")+'</section>';
    const balances='<section class="td-panel"><div class="td-panel-title"><h2>Số dư nhà cung cấp</h2><button type="button" class="td-text-button cursor-interaction" data-action="module" data-module="providers">Xem NCC →</button></div><div class="td-line"><div><strong>NCC Alpha</strong><p>Cập nhật 2 phút trước</p></div><span class="td-status td-ok">Đang bật</span><span class="td-balance">24,50 USD</span></div><div class="td-line"><div><strong>NCC Beta</strong><p>Cập nhật 5 phút trước</p></div><span class="td-status td-ok">Đang bật</span><span class="td-balance">1.280.000 ₫</span></div></section>';
    if(s.module==="today") return metrics+tasks+balances;
    if(s.module==="products") return '<nav class="td-chips" aria-label="Nhóm sản phẩm"><button type="button" class="td-chip" aria-pressed="true">Danh mục bán</button><button type="button" class="td-chip cursor-interaction" data-action="row" data-title="Hàng từ NCC">Hàng từ NCC</button><button type="button" class="td-chip cursor-interaction" data-action="row" data-title="Kho sản phẩm">Kho</button></nav><section class="td-panel"><div class="td-panel-title"><h2>Danh mục bán</h2>'+button("Thêm sản phẩm","row",'data-title="Thêm sản phẩm"',true)+'</div>'+products.map(p=>row(p.name,p.category+" · "+money(p.price),"Đang bán","Sửa",true)).join("")+'</section>';
    if(s.module==="providers") return balances+'<section class="td-panel"><div class="td-panel-title"><h2>Kết nối nhà cung cấp</h2>'+button("Thêm NCC","row",'data-title="Thêm nhà cung cấp"',true)+'</div>'+row("NCC Alpha","API · Danh mục và số dư","Đã kết nối","Chi tiết",true)+row("NCC Beta","API · Danh mục và số dư","Đã kết nối","Chi tiết",true)+'</section>';
    if(s.module==="orders") return '<nav class="td-chips" aria-label="Loại đơn"><button type="button" class="td-chip cursor-interaction" data-action="order-kind" data-kind="sale" aria-pressed="'+(s.orderKind==="sale")+'">Đơn bán</button><button type="button" class="td-chip cursor-interaction" data-action="order-kind" data-kind="purchase" aria-pressed="'+(s.orderKind==="purchase")+'">Đơn nhập NCC</button></nav>'+(s.orderKind==="sale"?tasks:'<section class="td-panel"><div class="td-panel-title"><h2>Đơn nhập NCC</h2><span class="td-small">Dữ liệu minh họa</span></div>'+row("NCC1045 · Lưu trữ đám mây","NCC Alpha · 3 sản phẩm","Đã nhận hàng","Xem",true)+row("NCC1040 · Trợ lý AI Pro","NCC Beta · 1 sản phẩm","Chờ NCC giao","Kiểm tra")+'</section>');
    return metrics+'<section class="td-panel"><div class="td-panel-title"><h2>Thu / chi</h2><span class="td-small">Hôm nay</span></div>'+row("Đơn bán TD1044","Tiền bán sản phẩm","Thu · 129.000 ₫","Xem",true)+row("Đơn nhập NCC1045","Mua nhập kho — ghi chi khi mua","Chi · 210.000 ₫","Xem")+'</section>';
  }
  function admin(s) {
    const title=navs.find(n=>n[0]===s.module)?.[1]||"Hôm nay";
    return '<div class="td-admin"><aside class="td-sidebar">'+logo()+navHTML(s,"td-nav")+'<div class="td-settings">'+button(icon("settings-2")+"Cài đặt","settings")+'</div></aside><main class="td-main"><header class="td-heading"><div><h1>'+title+'</h1><p>Thứ Bảy, 31 tháng 10 · Dữ liệu minh họa</p></div><div class="td-tools">'+button(icon(s.theme==="light"?"moon":"sun"),"theme",'aria-label="Chuyển chế độ sáng tối"')+button(icon("settings-2"),"settings",'aria-label="Cài đặt"')+'</div></header>'+adminContent(s)+'</main></div>'+navHTML(s,"td-mobile-nav");
  }
  function refreshIcons(){ if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}}); }
  function filter(s){
    let count=0;
    s.app.querySelectorAll("[data-product]").forEach(el=>{
      const match=(s.category==="Tất cả"||el.dataset.category===s.category)&&el.dataset.name.includes(s.q.trim().toLocaleLowerCase("vi"));
      el.hidden=!match;if(match)count++;
    });
    const counter=s.app.querySelector(".td-result-count");if(counter)counter.textContent=count+" sản phẩm";
    const empty=s.app.querySelector(".td-empty");if(empty)empty.hidden=count>0;
    s.app.querySelectorAll('[data-action="category"]').forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.value===s.category)));
  }
  function render(s){
    s.app.dataset.theme=s.theme;
    s.app.classList.toggle("td-phone",s.phone);
    s.app.innerHTML='<div class="td-page"><div class="td-workbar"><div class="td-mode"><button type="button" class="td-switch cursor-interaction" data-action="view" data-view="store" aria-pressed="'+(s.view==="store")+'">Cửa hàng</button><button type="button" class="td-switch cursor-interaction" data-action="view" data-view="admin" aria-pressed="'+(s.view==="admin")+'">Admin</button></div><div class="td-mode"><span class="td-demo">BẢN MẪU</span><button type="button" class="td-switch cursor-interaction" data-action="device" aria-pressed="'+s.phone+'">'+(s.phone?"Xem desktop":"Xem mobile")+'</button></div></div>'+(s.view==="store"?shop(s):admin(s))+'</div>';
    if(s.view==="store")filter(s);
    refreshIcons();
  }
  function openPanel(s,title,body){
    s.lastTrigger=document.activeElement;
    s.app.querySelector(".td-page").inert=true;
    const overlay=document.createElement("div");overlay.className="td-overlay";
    overlay.innerHTML='<section class="td-drawer" role="dialog" aria-modal="true" aria-label="'+title+'"><div style="display:flex;justify-content:space-between;align-items:center"><span class="td-small">TiệmDigital</span>'+button(icon("x"),"close",'aria-label="Đóng chi tiết"')+'</div><h2>'+title+'</h2>'+body+'</section>';
    s.app.appendChild(overlay);overlay.querySelector("button").focus();
    overlay.addEventListener("click",e=>{if(e.target===overlay)closePanel(s);});
    refreshIcons();
  }
  function closePanel(s){
    s.app.querySelector(".td-overlay")?.remove();s.app.querySelector(".td-page").inert=false;
    if(s.lastTrigger?.isConnected)s.lastTrigger.focus();
  }
  root.querySelectorAll(".td-app").forEach(app=>{
    const key=app.dataset.direction, d=dirs[key], prior=saved[key]||{};
    const s={key,app,view:prior.view==="admin"?"admin":"store",theme:prior.theme==="dark"?"dark":"light",phone:prior.phone===true,q:"",category:"Tất cả",module:"today",orderKind:"sale"};
    states.set(key,s);render(s);
    app.addEventListener("input",e=>{
      if(e.target.matches('input[type="search"]')){s.q=e.target.value;filter(s);}
      if(e.target.matches('[data-quantity]')){
        const p=products.find(p=>p.id===Number(e.target.dataset.productId)), qty=Math.max(1,Math.min(20,Number(e.target.value)||1));
        e.target.value=String(qty);app.querySelector("[data-total]").textContent=money(p.price*qty);
      }
    });
    app.addEventListener("click",e=>{
      const b=e.target.closest("button[data-action]");if(!b)return;
      const a=b.dataset.action;
      if(a==="view"){s.view=b.dataset.view;render(s);persist();}
      else if(a==="theme"){s.theme=s.theme==="light"?"dark":"light";render(s);persist();}
      else if(a==="device"){s.phone=!s.phone;render(s);persist();}
      else if(a==="category"){s.category=b.dataset.value;filter(s);}
      else if(a==="module"){s.module=b.dataset.module;render(s);}
      else if(a==="order-kind"){s.orderKind=b.dataset.kind;render(s);}
      else if(a==="close")closePanel(s);
      else if(a==="buy"||a==="detail"){
        const p=products.find(p=>p.id===Number(b.dataset.id));
        openPanel(s,p.name,'<p>'+p.description+'</p><span class="td-stock">Còn hàng</span>'+(a==="buy"?'<label>Số lượng<input type="number" min="1" max="20" value="1" data-quantity data-product-id="'+p.id+'"></label><div class="td-receipt"><span>Tổng tiền</span><strong data-total>'+money(p.price)+'</strong></div><p class="td-small">Bản mẫu thị giác · Không thực hiện giao dịch</p>': '<div class="td-receipt"><span>Giá bán</span><strong>'+money(p.price)+'</strong></div>')+button("Quay lại danh sách","close","",true));
      } else if(a==="account")openPanel(s,"Tài khoản",'<p>Đơn hàng · Ví · Hồ sơ & bảo mật</p>'+button("Quay lại","close","",true));
      else if(a==="settings")openPanel(s,"Cài đặt",'<p>Thanh toán · Telegram · Nội dung trang · Nhật ký quản trị</p>'+button("Quay lại","close","",true));
      else if(a==="row")openPanel(s,b.dataset.title||"Chi tiết",'<p>Panel chi tiết tại chỗ. Đóng lại giữ vị trí và bộ lọc của danh sách.</p><p class="td-small">Dữ liệu minh họa cho hướng thị giác.</p>'+button("Đóng chi tiết","close","",true));
    });
    app.addEventListener("keydown",e=>{
      const overlay=app.querySelector(".td-overlay");if(!overlay)return;
      if(e.key==="Escape"){e.preventDefault();closePanel(s);}
      if(e.key==="Tab"){
        const nodes=[...overlay.querySelectorAll("button,input")], first=nodes[0],last=nodes[nodes.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    });
    if(globalThis.Tweak){
      const style={accent:d.accent,radius:d.radius};
      const applyStyle=()=>{app.style.setProperty("--td-accent",style.accent);app.style.setProperty("--td-radius",style.radius+"px");};
      const tweak=new Tweak({container:app,onChange:applyStyle});
      tweak.addColorPicker(style,"accent",{label:"Màu nhấn",reference:"--td-accent"});
      tweak.addSlider(style,"radius",{label:"Độ bo góc",min:0,max:24,unit:"px",reference:"--td-radius"});
    }
  });
  window.addEventListener("openai:set_globals",e=>{
    const snapshot=e.detail?.globals?.widgetState?.privateContent;if(!snapshot)return;
    states.forEach((s,key)=>{const v=snapshot[key];if(!v)return;s.theme=v.theme==="dark"?"dark":"light";s.view=v.view==="admin"?"admin":"store";s.phone=v.phone===true;render(s);});
  });
})();
</script>
