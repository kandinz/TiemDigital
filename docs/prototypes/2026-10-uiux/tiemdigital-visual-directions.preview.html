    if(s.module===&quot;providers&quot;) return balances+&#x27;&lt;section class=&quot;td-panel&quot;&gt;&lt;div class=&quot;td-panel-title&quot;&gt;&lt;h2&gt;Kết nối nhà cung cấp&lt;/h2&gt;&#x27;+button(&quot;Thêm NCC&quot;,&quot;row&quot;,&#x27;data-title=&quot;Thêm nhà cung cấp&quot;&#x27;,true)+&#x27;&lt;/div&gt;&#x27;+row(&quot;NCC Alpha&quot;,&quot;API · Danh mục và số dư&quot;,&quot;Đã kết nối&quot;,&quot;Chi tiết&quot;,true)+row(&quot;NCC Beta&quot;,&quot;API · Danh mục và số dư&quot;,&quot;Đã kết nối&quot;,&quot;Chi tiết&quot;,true)+&#x27;&lt;/section&gt;&#x27;;
    if(s.module===&quot;orders&quot;) return &#x27;&lt;nav class=&quot;td-chips&quot; aria-label=&quot;Loại đơn&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;td-chip cursor-interaction&quot; data-action=&quot;order-kind&quot; data-kind=&quot;sale&quot; aria-pressed=&quot;&#x27;+(s.orderKind===&quot;sale&quot;)+&#x27;&quot;&gt;Đơn bán&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;td-chip cursor-interaction&quot; data-action=&quot;order-kind&quot; data-kind=&quot;purchase&quot; aria-pressed=&quot;&#x27;+(s.orderKind===&quot;purchase&quot;)+&#x27;&quot;&gt;Đơn nhập NCC&lt;/button&gt;&lt;/nav&gt;&#x27;+(s.orderKind===&quot;sale&quot;?tasks:&#x27;&lt;section class=&quot;td-panel&quot;&gt;&lt;div class=&quot;td-panel-title&quot;&gt;&lt;h2&gt;Đơn nhập NCC&lt;/h2&gt;&lt;span class=&quot;td-small&quot;&gt;Dữ liệu minh họa&lt;/span&gt;&lt;/div&gt;&#x27;+row(&quot;NCC1045 · Lưu trữ đám mây&quot;,&quot;NCC Alpha · 3 sản phẩm&quot;,&quot;Đã nhận hàng&quot;,&quot;Xem&quot;,true)+row(&quot;NCC1040 · Trợ lý AI Pro&quot;,&quot;NCC Beta · 1 sản phẩm&quot;,&quot;Chờ NCC giao&quot;,&quot;Kiểm tra&quot;)+&#x27;&lt;/section&gt;&#x27;);
    return metrics+&#x27;&lt;section class=&quot;td-panel&quot;&gt;&lt;div class=&quot;td-panel-title&quot;&gt;&lt;h2&gt;Thu / chi&lt;/h2&gt;&lt;span class=&quot;td-small&quot;&gt;Hôm nay&lt;/span&gt;&lt;/div&gt;&#x27;+row(&quot;Đơn bán TD1044&quot;,&quot;Tiền bán sản phẩm&quot;,&quot;Thu · 129.000 ₫&quot;,&quot;Xem&quot;,true)+row(&quot;Đơn nhập NCC1045&quot;,&quot;Mua nhập kho — ghi chi khi mua&quot;,&quot;Chi · 210.000 ₫&quot;,&quot;Xem&quot;)+&#x27;&lt;/section&gt;&#x27;;

  function admin(s) {
    const title=navs.find(n=&gt;n[0]===s.module)?.[1]||&quot;Hôm nay&quot;;
    return &#x27;&lt;div class=&quot;td-admin&quot;&gt;&lt;aside class=&quot;td-sidebar&quot;&gt;&#x27;+logo()+navHTML(s,&quot;td-nav&quot;)+&#x27;&lt;div class=&quot;td-settings&quot;&gt;&#x27;+button(icon(&quot;settings-2&quot;)+&quot;Cài đặt&quot;,&quot;settings&quot;)+&#x27;&lt;/div&gt;&lt;/aside&gt;&lt;main class=&quot;td-main&quot;&gt;&lt;header class=&quot;td-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;&#x27;+title+&#x27;&lt;/h1&gt;&lt;p&gt;Thứ Bảy, 31 tháng 10 · Dữ liệu minh họa&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;td-tools&quot;&gt;&#x27;+button(icon(s.theme===&quot;light&quot;?&quot;moon&quot;:&quot;sun&quot;),&quot;theme&quot;,&#x27;aria-label=&quot;Chuyển chế độ sáng tối&quot;&#x27;)+button(icon(&quot;settings-2&quot;),&quot;settings&quot;,&#x27;aria-label=&quot;Cài đặt&quot;&#x27;)+&#x27;&lt;/div&gt;&lt;/header&gt;&#x27;+adminContent(s)+&#x27;&lt;/main&gt;&lt;/div&gt;&#x27;+navHTML(s,&quot;td-mobile-nav&quot;);
  }
  function refreshIcons(){ if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}}); }
  function filter(s){
    let count=0;
    s.app.querySelectorAll(&quot;[data-product]&quot;).forEach(el=&gt;{
      const match=(s.category===&quot;Tất cả&quot;||el.dataset.category===s.category)&amp;&amp;el.dataset.name.includes(s.q.trim().toLocaleLowerCase(&quot;vi&quot;));
      el.hidden=!match;if(match)count++;
    });
    const counter=s.app.querySelector(&quot;.td-result-count&quot;);if(counter)counter.textContent=count+&quot; sản phẩm&quot;;
    const empty=s.app.querySelector(&quot;.td-empty&quot;);if(empty)empty.hidden=count&gt;0;
    s.app.querySelectorAll(&#x27;[data-action=&quot;category&quot;]&#x27;).forEach(el=&gt;el.setAttribute(&quot;aria-pressed&quot;,String(el.dataset.value===s.category)));
  }
  function render(s){
    s.app.dataset.theme=s.theme;
    s.app.classList.toggle(&quot;td-phone&quot;,s.phone);
    s.app.innerHTML=&#x27;&lt;div class=&quot;td-page&quot;&gt;&lt;div class=&quot;td-workbar&quot;&gt;&lt;div class=&quot;td-mode&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;td-switch cursor-interaction&quot; data-action=&quot;view&quot; data-view=&quot;store&quot; aria-pressed=&quot;&#x27;+(s.view===&quot;store&quot;)+&#x27;&quot;&gt;Cửa hàng&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;td-switch cursor-interaction&quot; data-action=&quot;view&quot; data-view=&quot;admin&quot; aria-pressed=&quot;&#x27;+(s.view===&quot;admin&quot;)+&#x27;&quot;&gt;Admin&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;td-mode&quot;&gt;&lt;span class=&quot;td-demo&quot;&gt;BẢN MẪU&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;td-switch cursor-interaction&quot; data-action=&quot;device&quot; aria-pressed=&quot;&#x27;+s.phone+&#x27;&quot;&gt;&#x27;+(s.phone?&quot;Xem desktop&quot;:&quot;Xem mobile&quot;)+&#x27;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+(s.view===&quot;store&quot;?shop(s):admin(s))+&#x27;&lt;/div&gt;&#x27;;
    if(s.view===&quot;store&quot;)filter(s);
    refreshIcons();
  }
  function openPanel(s,title,body){
    s.lastTrigger=document.activeElement;
    s.app.querySelector(&quot;.td-page&quot;).inert=true;
    const overlay=document.createElement(&quot;div&quot;);overlay.className=&quot;td-overlay&quot;;
    overlay.innerHTML=&#x27;&lt;section class=&quot;td-drawer&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;&#x27;+title+&#x27;&quot;&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:center&quot;&gt;&lt;span class=&quot;td-small&quot;&gt;TiệmDigital&lt;/span&gt;&#x27;+button(icon(&quot;x&quot;),&quot;close&quot;,&#x27;aria-label=&quot;Đóng chi tiết&quot;&#x27;)+&#x27;&lt;/div&gt;&lt;h2&gt;&#x27;+title+&#x27;&lt;/h2&gt;&#x27;+body+&#x27;&lt;/section&gt;&#x27;;
    s.app.appendChild(overlay);overlay.querySelector(&quot;button&quot;).focus();
    overlay.addEventListener(&quot;click&quot;,e=&gt;{if(e.target===overlay)closePanel(s);});
    refreshIcons();
  }
  function closePanel(s){
    s.app.querySelector(&quot;.td-overlay&quot;)?.remove();s.app.querySelector(&quot;.td-page&quot;).inert=false;
    if(s.lastTrigger?.isConnected)s.lastTrigger.focus();
  }
  root.querySelectorAll(&quot;.td-app&quot;).forEach(app=&gt;{
    const key=app.dataset.direction, d=dirs[key], prior=saved[key]||{};
    const s={key,app,view:prior.view===&quot;admin&quot;?&quot;admin&quot;:&quot;store&quot;,theme:prior.theme===&quot;dark&quot;?&quot;dark&quot;:&quot;light&quot;,phone:prior.phone===true,q:&quot;&quot;,category:&quot;Tất cả&quot;,module:&quot;today&quot;,orderKind:&quot;sale&quot;};
    states.set(key,s);render(s);
    app.addEventListener(&quot;input&quot;,e=&gt;{
      if(e.target.matches(&#x27;input[type=&quot;search&quot;]&#x27;)){s.q=e.target.value;filter(s);}
      if(e.target.matches(&#x27;[data-quantity]&#x27;)){
        const p=products.find(p=&gt;p.id===Number(e.target.dataset.productId)), qty=Math.max(1,Math.min(20,Number(e.target.value)||1));

      }
    });
    app.addEventListener(&quot;click&quot;,e=&gt;{
      const b=e.target.closest(&quot;button[data-action]&quot;);if(!b)return;
      const a=b.dataset.action;
      if(a===&quot;view&quot;){s.view=b.dataset.view;render(s);persist();}
      else if(a===&quot;theme&quot;){s.theme=s.theme===&quot;light&quot;?&quot;dark&quot;:&quot;light&quot;;render(s);persist();}
      else if(a===&quot;device&quot;){s.phone=!s.phone;render(s);persist();}
      else if(a===&quot;category&quot;){s.category=b.dataset.value;filter(s);}
      else if(a===&quot;module&quot;){s.module=b.dataset.module;render(s);}
      else if(a===&quot;order-kind&quot;){s.orderKind=b.dataset.kind;render(s);}
      else if(a===&quot;close&quot;)closePanel(s);
      else if(a===&quot;buy&quot;||a===&quot;detail&quot;){
        const p=products.find(p=&gt;p.id===Number(b.dataset.id));
        openPanel(s,p.name,&#x27;&lt;p&gt;&#x27;+p.description+&#x27;&lt;/p&gt;&lt;span class=&quot;td-stock&quot;&gt;Còn hàng&lt;/span&gt;&#x27;+(a===&quot;buy&quot;?&#x27;&lt;label&gt;Số lượng&lt;input type=&quot;number&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;1&quot; data-quantity data-product-id=&quot;&#x27;+p.id+&#x27;&quot;&gt;&lt;/label&gt;&lt;div class=&quot;td-receipt&quot;&gt;&lt;span&gt;Tổng tiền&lt;/span&gt;&lt;strong data-total&gt;&#x27;+money(p.price)+&#x27;&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;td-small&quot;&gt;Bản mẫu thị giác · Không thực hiện giao dịch&lt;/p&gt;&#x27;: &#x27;&lt;div class=&quot;td-receipt&quot;&gt;&lt;span&gt;Giá bán&lt;/span&gt;&lt;strong&gt;&#x27;+money(p.price)+&#x27;&lt;/strong&gt;&lt;/div&gt;&#x27;)+button(&quot;Quay lại danh sách&quot;,&quot;close&quot;,&quot;&quot;,true));
      } else if(a===&quot;account&quot;)openPanel(s,&quot;Tài khoản&quot;,&#x27;&lt;p&gt;Đơn hàng · Ví · Hồ sơ &amp; bảo mật&lt;/p&gt;&#x27;+button(&quot;Quay lại&quot;,&quot;close&quot;,&quot;&quot;,true));
      else if(a===&quot;settings&quot;)openPanel(s,&quot;Cài đặt&quot;,&#x27;&lt;p&gt;Thanh toán · Telegram · Nội dung trang · Nhật ký quản trị&lt;/p&gt;&#x27;+button(&quot;Quay lại&quot;,&quot;close&quot;,&quot;&quot;,true));
      else if(a===&quot;row&quot;)openPanel(s,b.dataset.title||&quot;Chi tiết&quot;,&#x27;&lt;p&gt;Panel chi tiết tại chỗ. Đóng lại giữ vị trí và bộ lọc của danh sách.&lt;/p&gt;&lt;p class=&quot;td-small&quot;&gt;Dữ liệu minh họa cho hướng thị giác.&lt;/p&gt;&#x27;+button(&quot;Đóng chi tiết&quot;,&quot;close&quot;,&quot;&quot;,true));
    });
    app.addEventListener(&quot;keydown&quot;,e=&gt;{
      const overlay=app.querySelector(&quot;.td-overlay&quot;);if(!overlay)return;
      if(e.key===&quot;Escape&quot;){e.preventDefault();closePanel(s);}
      if(e.key===&quot;Tab&quot;){
        const nodes=[...overlay.querySelectorAll(&quot;button,input&quot;)], first=nodes[0],last=nodes[nodes.length-1];
        if(e.shiftKey&amp;&amp;document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&amp;&amp;document.activeElement===last){e.preventDefault();first.focus();}
      }
    });
    if(globalThis.Tweak){
      const style={accent:d.accent,radius:d.radius};
      const applyStyle=()=&gt;{app.style.setProperty(&quot;--td-accent&quot;,style.accent);app.style.setProperty(&quot;--td-radius&quot;,style.radius+&quot;px&quot;);};
      const tweak=new Tweak({container:app,onChange:applyStyle});
      tweak.addColorPicker(style,&quot;accent&quot;,{label:&quot;Màu nhấn&quot;,reference:&quot;--td-accent&quot;});
      tweak.addSlider(style,&quot;radius&quot;,{label:&quot;Độ bo góc&quot;,min:0,max:24,unit:&quot;px&quot;,reference:&quot;--td-radius&quot;});
    }
  });
  window.addEventListener(&quot;openai:set_globals&quot;,e=&gt;{
    const snapshot=e.detail?.globals?.widgetState?.privateContent;if(!snapshot)return;
    states.forEach((s,key)=&gt;{const v=snapshot[key];if(!v)return;s.theme=v.theme===&quot;dark&quot;?&quot;dark&quot;:&quot;light&quot;;s.view=v.view===&quot;admin&quot;?&quot;admin&quot;:&quot;store&quot;;s.phone=v.phone===true;render(s);});
  });
})();

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;

    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
